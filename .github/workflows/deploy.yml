name: Deploy to Cafe24 via FTP

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: cafe24-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Validate source files
        run: |
          set -euo pipefail
          test -f index.html
          test -f main.js
          test -f style.css
          test -f profile.html
          test -f admin.html
          test -f profile.js
          test -f admin.js
          test -f auth-shared.js
          test -f upload.html
          test -f card-builder.html
          test -f org.html
          test -f org.js
          test -f contracts.html
          test -f contracts.js
          test -f customers.html
          test -f customers.js
          test -f logo_main.png
          grep -q 'main.js?v=' index.html
          grep -q 'profile.js?v=' profile.html
          grep -q 'admin.js?v=' admin.html
          php -l api/analyze.php
          php -l api/records.php
          php -l api/upload.php
          php -l api/card-design.php
          php -l api/saju-reading.php
          php -l api/lotto-recommend.php
          php -l lotto_offline_json_import.php
          php -l lotto_db_import.php
          php -l lotto_db_config.php
          php -l kapp_premium.php
          test -f lotto_numbers_all.json
          # Validate JSON parses
          php -r 'json_decode(file_get_contents("lotto_numbers_all.json"), true) ?: exit(1);'

      - name: Prepare deploy folder
        run: |
          set -euo pipefail
          rm -rf deploy
          mkdir -p deploy
          cp index.html style.css main.js Marketing.html kapp_premium.php lotto2233.html deploy/
          cp logo_main.png deploy/logo_main.png
          cp profile.html admin.html profile.js admin.js auth-shared.js deploy/
          cp upload.html deploy/upload.html
          cp card-builder.html deploy/card-builder.html
          cp org.html deploy/org.html
          cp org.js deploy/org.js
          cp contracts.html deploy/contracts.html
          cp contracts.js deploy/contracts.js
          cp customers.html deploy/customers.html
          cp customers.js deploy/customers.js
          cp api/analyze.php deploy/analyze.php
          cp api/records.php deploy/records.php
          cp api/upload.php deploy/upload.php
          cp api/card-design.php deploy/card-design.php
          cp api/saju-reading.php deploy/saju-reading.php
          cp api/lotto-recommend.php deploy/lotto-recommend.php
          cp lotto_offline_json_import.php deploy/lotto_offline_json_import.php
          cp lotto_numbers_all.json deploy/lotto_numbers_all.json
          cp lotto_db_import.php deploy/lotto_db_import.php  # 폐기 페이지 — 옛 북마크용 301 리디렉트
          cp lotto_db_config.php deploy/lotto_db_config.php
          # NOTE: lotto_db_config.php 는 자격증명을 담지 않음.
          # 실제 DB 정보는 .env (GitHub Secrets) 에서 읽어들임 — 아래 .env 조립 단계 참조.
          mkdir -p deploy/templates/cards
          cp templates/cards/*.html deploy/templates/cards/
          if [ -f .htaccess ]; then cp .htaccess deploy/.htaccess; fi
          ls -la deploy/

      - name: Verify FTP secret is configured
        env:
          PASS: ${{ secrets.CAFE24_FTP_PASSWORD || secrets.FTP_PASSWORD || secrets.FTP_PASS }}
        run: |
          if [ -z "$PASS" ]; then
            echo "::error::Set CAFE24_FTP_PASSWORD secret in repo Settings -> Secrets and variables -> Actions."
            echo "  Required: CAFE24_FTP_PASSWORD"
            echo "  Optional: CAFE24_FTP_SERVER (defaults to youngman-biz.com)"
            echo "  Optional: CAFE24_FTP_USER   (defaults to nxnxqxx)"
            echo "  Optional: CAFE24_FTP_PORT   (defaults to 21)"
            exit 1
          fi
          echo "FTP password secret found."

      - name: Assemble server .env from secrets
        env:
          OPENAI_KEY: ${{ secrets.OPENAI_API_KEY }}
          RECRAFT_KEY: ${{ secrets.RECRAFT_API_KEY }}
          IDEOGRAM_KEY: ${{ secrets.IDEOGRAM_API_KEY }}
          LOTTO_DB_HOST: ${{ secrets.LOTTO_DB_HOST }}
          LOTTO_DB_NAME: ${{ secrets.LOTTO_DB_NAME }}
          LOTTO_DB_USER: ${{ secrets.LOTTO_DB_USER }}
          LOTTO_DB_PASS: ${{ secrets.LOTTO_DB_PASS }}
          LOTTO_CRON_TOKEN: ${{ secrets.LOTTO_CRON_TOKEN }}
        run: |
          set -e
          {
            echo "VITE_SUPABASE_URL=https://xktjucyijpkopkyvxovh.supabase.co/rest/v1/"
            echo "VITE_SUPABASE_ANON_KEY=sb_publishable_Qg7NbgXvnIEchsjR18X8Mw_d8YsqVbS"
            [ -n "$OPENAI_KEY" ]    && echo "OPENAI_API_KEY=$OPENAI_KEY"       || echo "::warning::OPENAI_API_KEY missing"
            [ -n "$RECRAFT_KEY" ]   && echo "RECRAFT_API_KEY=$RECRAFT_KEY"     || true
            [ -n "$IDEOGRAM_KEY" ]  && echo "IDEOGRAM_API_KEY=$IDEOGRAM_KEY"   || echo "::warning::IDEOGRAM_API_KEY missing"
            [ -n "$LOTTO_DB_HOST" ] && echo "LOTTO_DB_HOST=$LOTTO_DB_HOST"     || echo "LOTTO_DB_HOST=localhost"
            [ -n "$LOTTO_DB_NAME" ] && echo "LOTTO_DB_NAME=$LOTTO_DB_NAME"     || echo "::warning::LOTTO_DB_NAME missing — 로또 DB 기능 비활성"
            [ -n "$LOTTO_DB_USER" ] && echo "LOTTO_DB_USER=$LOTTO_DB_USER"     || echo "::warning::LOTTO_DB_USER missing"
            [ -n "$LOTTO_DB_PASS" ] && echo "LOTTO_DB_PASS=$LOTTO_DB_PASS"     || echo "::warning::LOTTO_DB_PASS missing"
            [ -n "$LOTTO_CRON_TOKEN" ] && echo "LOTTO_CRON_TOKEN=$LOTTO_CRON_TOKEN" || true
          } > deploy/.env
          [ -n "$OPENAI_KEY" ]   && echo "OPENAI_API_KEY len=${#OPENAI_KEY}, prefix=$(printf '%s' "$OPENAI_KEY" | head -c6)…"   || true
          [ -n "$RECRAFT_KEY" ]  && echo "RECRAFT_API_KEY len=${#RECRAFT_KEY}, prefix=$(printf '%s' "$RECRAFT_KEY" | head -c6)…"  || true
          [ -n "$IDEOGRAM_KEY" ] && echo "IDEOGRAM_API_KEY len=${#IDEOGRAM_KEY}, prefix=$(printf '%s' "$IDEOGRAM_KEY" | head -c6)…" || true

      - name: Deploy to Cafe24 (FTP)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.CAFE24_FTP_SERVER || secrets.FTP_SERVER || 'youngman-biz.com' }}
          username: ${{ secrets.CAFE24_FTP_USER || secrets.FTP_USER || 'nxnxqxx' }}
          password: ${{ secrets.CAFE24_FTP_PASSWORD || secrets.FTP_PASSWORD || secrets.FTP_PASS }}
          port: ${{ secrets.CAFE24_FTP_PORT || secrets.FTP_PORT || '21' }}
          protocol: ftp
          local-dir: ./deploy/
          server-dir: ./
          dangerous-clean-slate: false
          log-level: standard
          # Don't try to delete remote files we don't own. We only push our set.
          # NOTE: deploy/.env IS uploaded — it's assembled from GitHub Secrets above.
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**

      - name: Verify deploy via HTTPS
        run: |
          set -euo pipefail
          CB="$(date +%s)"
          MISSING=0
          for f in index.html style.css main.js admin.html admin.js profile.html profile.js auth-shared.js upload.html org.html org.js contracts.html contracts.js customers.html customers.js; do
            code=$(curl -sk -o /dev/null -w "%{http_code}" "https://youngman-biz.com/${f}?cb=${CB}")
            size=$(curl -sk -o /dev/null -w "%{size_download}" "https://youngman-biz.com/${f}?cb=${CB}")
            echo "  ${f}: HTTP ${code}  size=${size}"
            if [ "${code}" != "200" ]; then MISSING=$((MISSING+1)); fi
          done
          rcode=$(curl -sk -o /dev/null -w "%{http_code}" "https://youngman-biz.com/records.php?cb=${CB}")
          echo "  records.php: ${rcode}  (expected 401 without auth)"
          ucode=$(curl -sk -o /dev/null -w "%{http_code}" "https://youngman-biz.com/upload.php?cb=${CB}")
          echo "  upload.php (GET list): ${ucode}  (expected 200)"
          lcode=$(curl -sk -o /dev/null -w "%{http_code}" "https://youngman-biz.com/lotto-recommend.php?cb=${CB}")
          echo "  lotto-recommend.php (GET): ${lcode}  (expected 405 — POST only)"
          ocode=$(curl -sk -o /dev/null -w "%{http_code}" "https://youngman-biz.com/lotto_offline_json_import.php?cb=${CB}")
          echo "  lotto_offline_json_import.php: ${ocode}  (expected 200)"
          jsize=$(curl -sk -o /dev/null -w "%{size_download}" "https://youngman-biz.com/lotto_numbers_all.json?cb=${CB}")
          echo "  lotto_numbers_all.json size: ${jsize} bytes (expected ~400KB)"
          curl -sk "https://youngman-biz.com/?cb=${CB}" | grep -E '<title>|main\.js\?v=' | head -2 || true
          if [ "${MISSING}" -gt 0 ]; then
            echo "::error::${MISSING} file(s) returned non-200 — deploy did not propagate"
            exit 1
          fi
          echo "All key files reachable over HTTPS."
