name: Deploy to Cafe24 via SFTP

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: cafe24-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Validate source files
        run: |
          set -euo pipefail
          test -f index.html
          test -f main.js
          test -f style.css
          test -f profile.html
          test -f admin.html
          test -f profile.js
          test -f admin.js
          test -f auth-shared.js
          grep -q 'main.js?v=' index.html
          grep -q 'profile.js?v=' profile.html
          grep -q 'admin.js?v=' admin.html
          php -l api/analyze.php
          php -l api/records.php
          php -l kapp_premium.php
          if [ -f .htaccess ]; then
            echo ".htaccess found; checking for rewrite rules"
            grep -nE 'RewriteEngine|RewriteRule|RewriteCond' .htaccess || true
          else
            echo "No .htaccess file in repository"
          fi

      - name: Prepare deploy files
        run: |
          set -euo pipefail
          rm -rf deploy
          mkdir -p deploy
          cp index.html style.css main.js Marketing.html kapp_premium.php lotto2233.html deploy/
          cp profile.html admin.html profile.js admin.js auth-shared.js deploy/
          cp api/analyze.php deploy/analyze.php
          cp api/records.php deploy/records.php
          if [ -f .htaccess ]; then cp .htaccess deploy/.htaccess; fi

      - name: Deploy to Cafe24 (probe webroot via HTTPS)
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST || 'youngman-biz.com' }}
          SFTP_USER: ${{ secrets.SFTP_USER || 'nxnxqxx' }}
          SFTP_PORT: ${{ secrets.SFTP_PORT || '22' }}
          SFTP_DIR: ${{ secrets.SFTP_DIR || '' }}
          SFTP_KEY: ${{ secrets.SFTP_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${SFTP_KEY}" ]; then
            echo "::error::SFTP_PRIVATE_KEY secret is not set"; exit 1
          fi

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SFTP_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy

          SSH="ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o BatchMode=yes -i ~/.ssh/id_deploy -p ${SFTP_PORT}"
          SCP="scp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o BatchMode=yes -i ~/.ssh/id_deploy -P ${SFTP_PORT} -p"

          PROBE_TOKEN="probe-$(date +%s)-$$"
          echo "Probe token: ${PROBE_TOKEN}"
          echo "${PROBE_TOKEN}" > /tmp/__probe.txt

          echo "==== Remote home / candidate listing ===="
          $SSH "${SFTP_USER}@${SFTP_HOST}" '
            echo "HOME=$HOME"; pwd; echo "---";
            for d in . www public_html html htdocs httpdocs www/html web; do
              if [ -d "$d" ]; then
                echo ">>> $d  count=$(ls -1A "$d" 2>/dev/null | wc -l)";
              fi;
            done
          '

          if [ -n "${SFTP_DIR}" ]; then
            TARGET="${SFTP_DIR}"
            echo "Using SFTP_DIR override: ${TARGET}"
          else
            echo "==== Probing every candidate dir by uploading marker + curl ===="
            CANDIDATES="www public_html html htdocs httpdocs web . www/html"
            TARGET=""
            for d in $CANDIDATES; do
              # Skip non-existent dirs so scp doesnt error
              if ! $SSH "${SFTP_USER}@${SFTP_HOST}" "[ -d '$d' ]" 2>/dev/null; then
                echo "  skip ${d} (not a dir)"
                continue
              fi
              # Upload marker
              if $SCP /tmp/__probe.txt "${SFTP_USER}@${SFTP_HOST}:${d}/__probe.txt" 2>/dev/null; then
                code=$(curl -sk -o /tmp/__probe.body -w "%{http_code}" "https://youngman-biz.com/__probe.txt?cb=$(date +%s%N)")
                body=$(cat /tmp/__probe.body 2>/dev/null | tr -d '\r\n' || true)
                echo "  ${d}: HTTP ${code}  body='${body}'"
                if [ "${code}" = "200" ] && [ "${body}" = "${PROBE_TOKEN}" ]; then
                  TARGET="${d}"
                  $SSH "${SFTP_USER}@${SFTP_HOST}" "rm -f '${d}/__probe.txt'" 2>/dev/null || true
                  break
                fi
                # cleanup non-matching marker
                $SSH "${SFTP_USER}@${SFTP_HOST}" "rm -f '${d}/__probe.txt'" 2>/dev/null || true
              else
                echo "  ${d}: scp failed (likely no write permission)"
              fi
            done

            if [ -z "${TARGET}" ]; then
              echo "::error::Could not locate webroot — no candidate served the probe. Set SFTP_DIR secret manually."
              exit 1
            fi
            echo "==== Probed webroot: ${TARGET} ===="
          fi

          echo "==== Target dir BEFORE upload ===="
          $SSH "${SFTP_USER}@${SFTP_HOST}" "ls -la '${TARGET}' | head -40"

          echo "==== deploy/ contents ===="
          ls -la deploy/

          echo "==== Uploading each file ===="
          # shellcheck disable=SC2012
          for f in $(ls -A deploy/); do
            echo ">> ${f}"
            $SCP "deploy/${f}" "${SFTP_USER}@${SFTP_HOST}:${TARGET}/${f}"
          done

          echo "==== Target dir AFTER upload ===="
          $SSH "${SFTP_USER}@${SFTP_HOST}" "ls -la '${TARGET}' | head -80"

          echo "==== Per-file presence + size ===="
          $SSH "${SFTP_USER}@${SFTP_HOST}" "T='${TARGET}'; for f in index.html style.css main.js admin.html admin.js profile.html profile.js auth-shared.js .htaccess records.php analyze.php kapp_premium.php lotto2233.html; do \
            if [ -f \"\$T/\$f\" ]; then \
              echo \"OK   \$f  \$(stat -c '%s bytes  %y' \"\$T/\$f\" 2>/dev/null || wc -c < \"\$T/\$f\")\"; \
            else \
              echo \"MISS \$f\"; \
            fi; \
          done" | tee /tmp/__audit.txt

          AUDIT_NAME="_deploy_audit_$(date +%s).txt"
          echo "==== Uploading audit (${AUDIT_NAME}) and fetching it back over HTTPS ===="
          $SCP /tmp/__audit.txt "${SFTP_USER}@${SFTP_HOST}:${TARGET}/${AUDIT_NAME}"
          sleep 2
          curl -sk -o /tmp/__audit_remote.txt -w "audit fetch: HTTP %{http_code} size=%{size_download}\n" "https://youngman-biz.com/${AUDIT_NAME}?cb=$(date +%s%N)"
          echo "----- audit content fetched from live site -----"
          cat /tmp/__audit_remote.txt 2>/dev/null || echo "(empty)"
          echo "------------------------------------------------"

          echo "==== Live HTTPS sanity for newly uploaded files (in this run) ===="
          CB=$(date +%s%N)
          for f in admin.html admin.js profile.html profile.js auth-shared.js style.css index.html; do
            code=$(curl -sk -o /dev/null -w "%{http_code}" "https://youngman-biz.com/${f}?cb=${CB}")
            size=$(curl -sk -o /dev/null -w "%{size_download}" "https://youngman-biz.com/${f}?cb=${CB}")
            echo "  ${f}: HTTP ${code}  size=${size}"
          done

          echo "==== Webroot path actually used: ${TARGET} ===="
          $SSH "${SFTP_USER}@${SFTP_HOST}" "readlink -f '${TARGET}' 2>/dev/null || (cd '${TARGET}' && pwd)"
          $SSH "${SFTP_USER}@${SFTP_HOST}" "rm -f '${TARGET}/${AUDIT_NAME}'" 2>/dev/null || true

      - name: Verify deploy via HTTPS
        run: |
          set -euo pipefail
          echo "==== HTTPS spot check (cache-busted) ===="
          CB="$(date +%s)"
          MISSING=0
          for f in index.html style.css main.js admin.html admin.js profile.html profile.js auth-shared.js; do
            code=$(curl -sk -o /dev/null -w "%{http_code}" "https://youngman-biz.com/${f}?cb=${CB}")
            size=$(curl -sk -o /dev/null -w "%{size_download}" "https://youngman-biz.com/${f}?cb=${CB}")
            echo "  ${f}: ${code} size=${size}"
            if [ "${code}" != "200" ]; then MISSING=$((MISSING+1)); fi
          done

          # records.php intentionally returns 401 without auth — that's healthy.
          rcode=$(curl -sk -o /dev/null -w "%{http_code}" "https://youngman-biz.com/records.php?cb=${CB}")
          echo "  records.php: ${rcode}  (expected 401)"

          echo "==== Title + cache-buster ===="
          curl -sk "https://youngman-biz.com/?cb=${CB}" | grep -E '<title>|main\.js\?v=' | head -4 || true

          if [ "${MISSING}" -gt 0 ]; then
            echo "::error::${MISSING} file(s) returned non-200 — deploy did not propagate"
            exit 1
          fi
          echo "All key files reachable over HTTPS."
