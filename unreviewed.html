<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>미확인 요약 · YOUNGMAN</title>
<link rel="icon" type="image/png" href="logo_main.png">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="style.css?v=20260520-search-deep">
<style>
:root{
    --ledger-line:rgba(20,14,8,.09); --ledger-line-strong:rgba(20,14,8,.16);
    --ledger-bg:#fbf7ef; --ledger-accent:#c8362c; --ledger-accent-deep:#8a2620;
}
.un-shell{max-width:920px;margin:0 auto;padding:28px 22px 140px}
.un-head{margin-bottom:18px}
.un-title{margin:0;font-size:24px;letter-spacing:-.02em;font-weight:700}
.un-sub{margin:6px 0 0;color:#8a847e;font-size:14px;line-height:1.55}
.un-list{display:flex;flex-direction:column;gap:10px}
.un-card{background:#fff;border:1px solid var(--ledger-line);border-radius:14px;padding:16px 18px;cursor:pointer;transition:all 160ms;text-align:left;font-family:inherit}
.un-card:hover{border-color:var(--ledger-line-strong);background:#fbfaf5}
.un-card:active{background:#f4efe7}
.un-card-meta{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
.un-card-name{font-size:16px;font-weight:600;color:#0e0d0c;letter-spacing:-.005em}
.un-card-time{font-size:12.5px;color:#8a847e;white-space:nowrap}
.un-card-summary{font-size:14px;line-height:1.55;color:#4f4943;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;word-break:keep-all}
.un-card-duration{font-size:12px;color:#8a847e;margin-top:6px}
.un-empty{text-align:center;padding:80px 24px;color:#8a847e;font-size:15px;line-height:1.7}
.un-empty .icon{font-size:42px;display:block;margin-bottom:14px}
.un-loading{text-align:center;padding:48px 24px;color:#8a847e;font-size:13px}

/* Detail modal */
.un-modal-backdrop{position:fixed;inset:0;background:rgba(14,13,12,.55);display:none;align-items:center;justify-content:center;z-index:1000;padding:20px}
.un-modal-backdrop.show{display:flex}
.un-modal{background:#fff;border-radius:18px;max-width:520px;width:100%;max-height:90vh;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 24px 60px rgba(20,14,8,.32)}
.un-modal-head{padding:18px 20px 12px;border-bottom:1px solid var(--ledger-line)}
.un-modal-title{margin:0;font-size:18px;font-weight:700;letter-spacing:-.01em}
.un-modal-subtitle{margin:4px 0 0;color:#8a847e;font-size:13px}
.un-modal-body{padding:18px 20px;overflow-y:auto;flex:1}
.un-modal-row{margin-bottom:14px}
.un-modal-row:last-child{margin-bottom:0}
.un-modal-label{font-size:11.5px;font-weight:600;color:#8a847e;letter-spacing:.04em;text-transform:uppercase;margin-bottom:4px}
.un-modal-val{font-size:14.5px;line-height:1.6;color:#0e0d0c;white-space:pre-wrap;word-break:keep-all}
.un-modal-foot{padding:14px 20px;border-top:1px solid var(--ledger-line);display:flex;gap:10px;justify-content:flex-end}
.un-btn{padding:10px 18px;border:1px solid var(--ledger-line-strong);background:#fff;color:#4f4943;font-size:14px;border-radius:10px;cursor:pointer;font-family:inherit;font-weight:500;transition:all 160ms}
.un-btn:hover{background:#fbf7ef;color:#0e0d0c}
.un-btn.primary{background:#0e0d0c;color:#fff;border-color:#0e0d0c}
.un-btn.primary:hover{background:#2a2520}
.un-btn:disabled{opacity:.5;cursor:not-allowed}

@media (max-width:860px){
    .un-shell{padding:22px 14px 140px}
    .un-title{font-size:22px}
    .un-card{padding:14px 16px}
    .un-modal{max-height:85vh;border-radius:14px}
}
</style>
</head>
<body>
<div id="content"></div>

<div class="un-shell">
<header class="un-head">
    <h1 class="un-title">미확인 요약</h1>
    <p class="un-sub">검토 대기 중인 통화 요약입니다. 카드를 탭하여 내용 확인 후 저장하세요.</p>
</header>
<div id="unreviewedList" class="un-list"><div class="un-loading">불러오는 중...</div></div>
</div>

<!-- Detail modal -->
<div class="un-modal-backdrop" id="unModal">
    <div class="un-modal">
        <header class="un-modal-head">
            <h2 class="un-modal-title" id="unModalTitle">상세</h2>
            <p class="un-modal-subtitle" id="unModalSubtitle"></p>
        </header>
        <div class="un-modal-body" id="unModalBody"></div>
        <footer class="un-modal-foot">
            <button class="un-btn" id="unModalCancel" type="button">닫기</button>
            <button class="un-btn primary" id="unModalConfirm" type="button">고객관리대장에 저장</button>
        </footer>
    </div>
</div>

<script type="module">
    import { bootApp, apiRequest } from './auth-shared.js?v=20260517-session-persist';
    await bootApp();

    const list = document.getElementById('unreviewedList');
    const modal = document.getElementById('unModal');
    const modalTitle = document.getElementById('unModalTitle');
    const modalSubtitle = document.getElementById('unModalSubtitle');
    const modalBody = document.getElementById('unModalBody');
    const modalCancel = document.getElementById('unModalCancel');
    const modalConfirm = document.getElementById('unModalConfirm');

    let currentJobId = null;

    function escapeHtml(s) {
        return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }
    function fmtTime(s) {
        if (!s) return '';
        try {
            const d = new Date(String(s).replace(' ', 'T'));
            if (isNaN(d)) return s;
            return d.toLocaleString('ko-KR', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
        } catch { return s; }
    }
    function fmtDuration(sec) {
        sec = parseInt(sec, 10) || 0;
        if (sec < 60) return sec + '초';
        const m = Math.floor(sec / 60);
        const s = sec % 60;
        return s ? `${m}분 ${s}초` : `${m}분`;
    }

    async function load() {
        try {
            const r = await apiRequest('customer-log', { query: 'action=list_unreviewed' });
            const items = r?.items || [];
            if (items.length === 0) {
                list.innerHTML = '<div class="un-empty"><span class="icon">📭</span>미확인 요약이 없습니다.<br>새 통화가 도착하면 여기에 표시됩니다.</div>';
                return;
            }
            list.innerHTML = items.map(j => `
                <button class="un-card" data-job-id="${escapeHtml(j.id)}" type="button">
                    <div class="un-card-meta">
                        <span class="un-card-name">${escapeHtml(j.customer_name || '고객')}</span>
                        <span class="un-card-time">${escapeHtml(fmtTime(j.recorded_at))}</span>
                    </div>
                    <div class="un-card-summary">${escapeHtml(j.summary_preview || '(요약 없음)')}</div>
                    ${j.duration_sec ? `<div class="un-card-duration">통화 ${escapeHtml(fmtDuration(j.duration_sec))}</div>` : ''}
                </button>
            `).join('');
            list.querySelectorAll('.un-card').forEach(el => {
                el.addEventListener('click', () => openDetail(el.dataset.jobId));
            });
        } catch (e) {
            list.innerHTML = `<div class="un-empty">불러오기 실패<br><small>${escapeHtml(e?.message || e)}</small></div>`;
        }
    }

    async function openDetail(jobId) {
        currentJobId = jobId;
        modalTitle.textContent = '불러오는 중...';
        modalSubtitle.textContent = '';
        modalBody.innerHTML = '<div class="un-loading">상세 정보를 불러오고 있습니다...</div>';
        modal.classList.add('show');
        modalConfirm.disabled = true;
        try {
            const r = await apiRequest('customer-log', { query: 'action=preview&job_id=' + encodeURIComponent(jobId) });
            const s = r?.summary || {};
            modalTitle.textContent = s.customer_name || '고객';
            modalSubtitle.textContent = fmtTime(r.recorded_at) + (r.duration_sec ? ' · ' + fmtDuration(r.duration_sec) : '');
            const rows = [
                { label: '요약', value: s.summary },
                { label: '관심사', value: s.interest },
                { label: '문의', value: s.inquiry },
                { label: '예산/조건', value: s.budget_condition },
                { label: 'AI 추천', value: s.next_action },
                { label: '연락처', value: s.phone_number || r.phone_number },
            ].filter(row => row.value);
            modalBody.innerHTML = rows.map(row => `
                <div class="un-modal-row">
                    <div class="un-modal-label">${escapeHtml(row.label)}</div>
                    <div class="un-modal-val">${escapeHtml(row.value)}</div>
                </div>
            `).join('');
            modalConfirm.disabled = false;
        } catch (e) {
            modalBody.innerHTML = `<div class="un-empty">상세 불러오기 실패<br><small>${escapeHtml(e?.message || e)}</small></div>`;
        }
    }

    function closeDetail() {
        modal.classList.remove('show');
        currentJobId = null;
    }

    async function confirmSave() {
        if (!currentJobId) return;
        const jobId = currentJobId;
        modalConfirm.disabled = true;
        modalConfirm.textContent = '저장 중...';
        try {
            await apiRequest('customer-log', { method: 'POST', body: JSON.stringify({ action: 'confirm', job_id: jobId }) });
            closeDetail();
            modalConfirm.textContent = '고객관리대장에 저장';
            await load();
        } catch (e) {
            modalConfirm.disabled = false;
            modalConfirm.textContent = '고객관리대장에 저장';
            alert('저장 실패: ' + (e?.message || e));
        }
    }

    modalCancel.addEventListener('click', closeDetail);
    modal.addEventListener('click', (e) => { if (e.target === modal) closeDetail(); });
    modalConfirm.addEventListener('click', confirmSave);
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && modal.classList.contains('show')) closeDetail(); });

    load();
</script>
</body>
</html>
