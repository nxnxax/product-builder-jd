name: Deploy to Cafe24 via FTP

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: cafe24-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Validate source files
        run: |
          set -euo pipefail
          test -f index.html
          test -f main.js
          test -f style.css
          test -f profile.html
          test -f admin.html
          test -f profile.js
          test -f admin.js
          test -f auth-shared.js
          test -f upload.html
          test -f download.html
          test -f card-builder.html
          test -f org.html
          test -f org.js
          test -f contracts.html
          test -f contracts.js
          test -f customers.html
          test -f customers.js
          test -f ledger-shared.js
          test -f board.html
          test -f board.js
          test -f logo_main.png
          test -f og-thumbnail.png         # OG/Twitter 공유 시 사용되는 카드 이미지
          test -f logout.html             # 단일 로그아웃 transition 페이지 — 누락 시 헤더 로그아웃 깨짐
          test -f login-complete.html     # 단일 로그인 transition 페이지 — 누락 시 로그인 후 redirect 깨짐
          test -f refund.html             # 환불정책 (PortOne/Toss 심사 필수)
          test -f auto-billing.html       # 자동결제 안내 (PortOne/Toss 심사 필수)
          test -f subscribe.html          # 구독 플랜 비교 페이지
          test -f billing.html            # 구독 관리 페이지 (현재 plan / 사용량 / 해지)
          test -f unreviewed.html         # 미확인 요약 페이지 (앱 전용 하단 nav 진입점)
          test -f tester.html             # 베타 테스터용 APK 다운로드 안내 페이지
          test -f import-guide.html       # 타사 통화기록 가져오기 설명서 (index 배너 링크 대상)
          test -f robots.txt              # SEO — 크롤러 차단 정책
          test -f sitemap.xml             # SEO — 크롤러 페이지 인덱싱 지도
          test -f rss.xml                 # SEO — RSS 피드 (robots.txt Sitemap 등록 대상, 삭제 금지)
          grep -q 'google-site-verification' index.html   # 구글 소유확인 메타 — 삭제 시 검색등록 풀림
          grep -q 'naver-site-verification' index.html    # 네이버 소유확인 메타 — 삭제 시 검색등록 풀림
          grep -q 'auth-shared.js?v=' index.html   # 새 랜딩은 main.js 대신 auth-shared 만 import
          grep -q 'profile.js?v=' profile.html
          grep -q 'admin.js?v=' admin.html
          php -l api/analyze.php
          php -l api/records.php
          php -l api/error_logger.php
          php -l api/upload.php
          php -l api/guide-video.php          # 안내영상 관리자 업로드 + 공개 조회 (import-guide.html)
          php -l api/install-ping.php         # 앱 설치 1회 핑 (광고 설치 추적, dedup)
          php -l api/admin-stats.php          # 일별 통계(install/signup/payment) — 관리자 전용
          php -l api/card-design.php
          php -l api/saju-reading.php
          php -l api/lotto-recommend.php
          php -l api/ledger-mobile.php
          php -l api/crypto_helpers.php
          php -l api/process-recording.php   # 통화 녹취 → Clova STT → LLM → customer_log
          php -l api/pageview.php             # 관리자 통계용 방문자/유입경로 트래킹 (2026-05-24)
          php -l api/fcm_helpers.php         # FCM HTTP v1 발송 (Phase 2 M3)
          php -l api/audio_cleanup.php       # 24h 미정리 audio cron (Phase 2 M4)
          php -l api/cron-keep-alive.php      # 30분 FCM silent push keep-alive (앱 cold start 회피)
          php -l api/billing_helpers.php     # PortOne V2 API 헬퍼
          php -l api/billing/verify-payment.php       # 결제 검증 + 구독 활성화
          php -l api/billing/webhook-portone.php      # Webhook 수신 (Standard Webhooks)
          php -l api/billing/cancel-subscription.php  # 구독 해지 (cancel_at_period_end)
          php -l api/billing/config.php               # storeId/channelKey publishable config
          php -l api/billing/cron-renew.php           # 정기결제 자동 갱신 cron (GitHub Actions schedule)
          php -l api/billing/topup-verify.php         # 일회성 충전권 결제 검증 + 충전
          php -l api/billing/topup-settings.php       # 자동충전 동의 토글 / 잔액 조회
          php -l api/billing/topup-selftest.php       # 비활성 stub (검증 완료 후 폐쇄)
          php -l api/billing/notify-test.php          # (임시) 관리자 결제 FCM 팝업 테스트
          php -l api/sms/send-bulk.php
          php -l api/sms/balance.php
          php -l api/sms/providers/SmsProvider.php
          php -l api/sms/providers/SolapiProvider.php
          php -l api/sms/providers/AligoProvider.php
          php -l lotto_offline_json_import.php
          php -l cron-lotto-update.php
          php -l lotto_db_import.php
          php -l lotto_db_config.php
          php -l kapp_premium.php
          test -f lotto_numbers_all.json
          # Validate JSON parses
          php -r 'json_decode(file_get_contents("lotto_numbers_all.json"), true) ?: exit(1);'

      - name: Prepare deploy folder
        run: |
          set -euo pipefail
          rm -rf deploy
          mkdir -p deploy
          cp index.html style.css main.js Marketing.html kapp_premium.php lotto2233.html deploy/
          cp logo_main.png deploy/logo_main.png
          cp og-thumbnail.png deploy/og-thumbnail.png   # OG/Twitter 카드 이미지 (1200x630 권장)
          cp manifest.json deploy/manifest.json         # PWA manifest (바탕화면 바로가기/설치)
          cp sw.js deploy/sw.js                         # PWA service worker (설치 조건 충족 no-op)
          cp app-icon-192.png deploy/app-icon-192.png   # PWA 앱 아이콘 (192x192)
          cp profile.html admin.html profile.js admin.js auth-shared.js deploy/
          cp bridge.js deploy/bridge.js                          # RN WebView 앱 브리지 — auth-shared 가 import
          cp upload.html deploy/upload.html
          cp download.html deploy/download.html
          cp card-builder.html deploy/card-builder.html
          cp org.html deploy/org.html
          cp org.js deploy/org.js
          cp contracts.html deploy/contracts.html
          cp contracts.js deploy/contracts.js
          cp customers.html deploy/customers.html
          cp customers.js deploy/customers.js
          cp ledger-shared.js deploy/ledger-shared.js
          cp board.html deploy/board.html
          cp board.js deploy/board.js
          cp terms.html deploy/terms.html
          cp privacy.html deploy/privacy.html
          cp import-guide.html deploy/import-guide.html         # 타사 통화기록 가져오기 설명서 (index 배너 링크)
          cp forms.html deploy/forms.html
          cp forms.js deploy/forms.js
          cp logout.html deploy/logout.html                      # 단일 로그아웃 cleanup 페이지
          cp login-complete.html deploy/login-complete.html      # 단일 로그인 transition 페이지
          cp refund.html deploy/refund.html                      # 환불정책 (구독 결제 정책 페이지)
          cp auto-billing.html deploy/auto-billing.html          # 자동결제 안내 (구독 결제 정책 페이지)
          cp subscribe.html deploy/subscribe.html                # 구독 플랜 비교 (Free/Plus/Pro)
          cp billing.html deploy/billing.html                    # 구독 관리 (현재 plan / 사용량 / 해지)
          cp unreviewed.html deploy/unreviewed.html              # 미확인 요약 페이지 (앱 하단 nav 진입점)
          cp tester.html deploy/tester.html                      # 베타 테스터 APK 다운로드 안내 (APK 본체는 사장님 FTP 직접 업로드: /download/youngman-latest.apk)
          cp robots.txt deploy/robots.txt                        # SEO — 크롤러 정책
          cp sitemap.xml deploy/sitemap.xml                      # SEO — 인덱싱 지도
          cp rss.xml deploy/rss.xml                              # SEO — RSS 피드 (robots.txt Sitemap 등록, 삭제 금지)
          cp api/analyze.php deploy/analyze.php
          cp api/records.php deploy/records.php
          cp api/error_logger.php deploy/error_logger.php     # 서버 에러 진단 로거 — recording-callback/process-recording 이 require
          cp api/upload.php deploy/upload.php
          cp api/guide-video.php deploy/guide-video.php       # 안내영상 관리자 업로드 엔드포인트
          cp api/install-ping.php deploy/install-ping.php     # 앱 설치 1회 핑 (광고 설치 추적)
          cp api/admin-stats.php deploy/admin-stats.php       # 일별 통계 (관리자 전용)
          cp api/card-design.php deploy/card-design.php
          cp api/saju-reading.php deploy/saju-reading.php
          cp api/lotto-recommend.php deploy/lotto-recommend.php
          cp api/ledger-mobile.php deploy/ledger-mobile.php
          cp api/crypto_helpers.php deploy/crypto_helpers.php   # PII AES-256-GCM 헬퍼 — records/ledger-mobile 이 require
          cp api/process-recording.php deploy/process-recording.php   # 통화 녹취 → Clova STT → LLM → customer_log
          cp api/fcm_helpers.php deploy/fcm_helpers.php   # FCM HTTP v1 발송 — process-recording 이 async 완료 시 require
          cp api/audio_cleanup.php deploy/audio_cleanup.php   # 24h 미정리 audio cron cleanup (M4)
          cp api/cron-process-jobs.php deploy/cron-process-jobs.php   # Phase 2 Path B — server secret worker (recording_jobs 처리)
          cp api/cron-keep-alive.php deploy/cron-keep-alive.php   # 30분 FCM silent push keep-alive (앱 cold start 회피)
          cp api/job-status.php deploy/job-status.php   # 속도 개선 (2026-05-20) — 앱 polling endpoint
          cp api/recording-callback.php deploy/recording-callback.php   # Railway worker 결과 수신 (Phase 2 외부 worker)
          cp api/recording-audio.php deploy/recording-audio.php   # Railway 가 audio 다운로드 (signed URL)
          cp api/pageview.php deploy/pageview.php   # 관리자 통계용 방문자/유입경로 트래킹 (2026-05-24)
          # 구독 결제 (PortOne V2 + 토스페이먼츠)
          cp api/billing_helpers.php deploy/billing_helpers.php
          mkdir -p deploy/billing
          cp api/billing/verify-payment.php deploy/billing/verify-payment.php
          cp api/billing/webhook-portone.php deploy/billing/webhook-portone.php
          cp api/billing/cancel-subscription.php deploy/billing/cancel-subscription.php
          cp api/billing/config.php deploy/billing/config.php
          cp api/billing/cron-renew.php deploy/billing/cron-renew.php
          # Google Play Billing (사장님 2026-05-26 — 어센트라 v83+ 결제 통합)
          cp api/billing/google_play_helpers.php deploy/billing/google_play_helpers.php
          cp api/billing/verify-google-purchase.php deploy/billing/verify-google-purchase.php
          cp api/billing/rtdn.php deploy/billing/rtdn.php
          cp api/billing/topup-verify.php deploy/billing/topup-verify.php
          cp api/billing/topup-settings.php deploy/billing/topup-settings.php
          cp api/billing/topup-selftest.php deploy/billing/topup-selftest.php
          cp api/billing/topup-testsetup.php deploy/billing/topup-testsetup.php
          cp api/billing/notify-test.php deploy/billing/notify-test.php
          # SMS 단체 발송 — 디렉토리 구조 유지 (sms/send-bulk.php + sms/providers/*)
          mkdir -p deploy/sms/providers
          cp api/sms/send-bulk.php deploy/sms/send-bulk.php
          cp api/sms/balance.php deploy/sms/balance.php
          cp api/sms/providers/SmsProvider.php deploy/sms/providers/SmsProvider.php
          cp api/sms/providers/SolapiProvider.php deploy/sms/providers/SolapiProvider.php
          cp api/sms/providers/AligoProvider.php deploy/sms/providers/AligoProvider.php
          cp lotto_offline_json_import.php deploy/lotto_offline_json_import.php
          cp cron-lotto-update.php deploy/cron-lotto-update.php   # 매주 일요일 01:00 KST 자동 회차 갱신 cron
          cp lotto_numbers_all.json deploy/lotto_numbers_all.json
          cp lotto_db_import.php deploy/lotto_db_import.php  # 폐기 페이지 — 옛 북마크용 301 리디렉트
          cp lotto_db_config.php deploy/lotto_db_config.php
          # NOTE: lotto_db_config.php 는 자격증명을 담지 않음.
          # 실제 DB 정보는 .env (GitHub Secrets) 에서 읽어들임 — 아래 .env 조립 단계 참조.
          mkdir -p deploy/templates/cards
          cp templates/cards/*.html deploy/templates/cards/
          if [ -f .htaccess ]; then cp .htaccess deploy/.htaccess; fi
          ls -la deploy/

      - name: Verify FTP secret is configured
        env:
          PASS: ${{ secrets.CAFE24_FTP_PASSWORD || secrets.FTP_PASSWORD || secrets.FTP_PASS }}
        run: |
          if [ -z "$PASS" ]; then
            echo "::error::Set CAFE24_FTP_PASSWORD secret in repo Settings -> Secrets and variables -> Actions."
            echo "  Required: CAFE24_FTP_PASSWORD"
            echo "  Optional: CAFE24_FTP_SERVER (defaults to youngman-biz.com)"
            echo "  Optional: CAFE24_FTP_USER   (defaults to nxnxqxx)"
            echo "  Optional: CAFE24_FTP_PORT   (defaults to 21)"
            exit 1
          fi
          echo "FTP password secret found."

      - name: Assemble server .env from secrets
        env:
          OPENAI_KEY: ${{ secrets.OPENAI_API_KEY }}
          RECRAFT_KEY: ${{ secrets.RECRAFT_API_KEY }}
          IDEOGRAM_KEY: ${{ secrets.IDEOGRAM_API_KEY }}
          ANTHROPIC_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TOGETHER_KEY: ${{ secrets.TOGETHER_API_KEY }}
          NCP_CLOVA_INVOKE_URL: ${{ secrets.NCP_CLOVA_INVOKE_URL }}
          NCP_CLOVA_SECRET: ${{ secrets.NCP_CLOVA_SECRET }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          AUDIO_CLEANUP_TOKEN: ${{ secrets.AUDIO_CLEANUP_TOKEN }}
          LOTTO_DB_HOST: ${{ secrets.LOTTO_DB_HOST }}
          LOTTO_DB_NAME: ${{ secrets.LOTTO_DB_NAME }}
          LOTTO_DB_USER: ${{ secrets.LOTTO_DB_USER }}
          LOTTO_DB_PASS: ${{ secrets.LOTTO_DB_PASS }}
          LOTTO_CRON_TOKEN: ${{ secrets.LOTTO_CRON_TOKEN }}
          CRYPTO_KEY: ${{ secrets.YOUNGMAN_CRYPTO_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          PORTONE_STORE_ID: ${{ secrets.PORTONE_STORE_ID }}
          PORTONE_API_SECRET: ${{ secrets.PORTONE_API_SECRET }}
          PORTONE_WEBHOOK_SECRET: ${{ secrets.PORTONE_WEBHOOK_SECRET }}
          PORTONE_CHANNEL_KEY_TOSS: ${{ secrets.PORTONE_CHANNEL_KEY_TOSS }}
          STT_PROVIDER: ${{ secrets.STT_PROVIDER }}
          LLM_PROVIDER: ${{ secrets.LLM_PROVIDER }}
          RECORDING_WORKER_TOKEN: ${{ secrets.RECORDING_WORKER_TOKEN }}
          RAILWAY_WORKER_URL: ${{ secrets.RAILWAY_WORKER_URL }}
          GOOGLE_PLAY_PACKAGE_NAME: ${{ secrets.GOOGLE_PLAY_PACKAGE_NAME }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          RTDN_SHARED_TOKEN: ${{ secrets.RTDN_SHARED_TOKEN }}
        run: |
          set -e
          {
            echo "VITE_SUPABASE_URL=https://xktjucyijpkopkyvxovh.supabase.co/rest/v1/"
            echo "VITE_SUPABASE_ANON_KEY=sb_publishable_Qg7NbgXvnIEchsjR18X8Mw_d8YsqVbS"
            [ -n "$SUPABASE_SERVICE_KEY" ] && echo "SUPABASE_SERVICE_KEY=$SUPABASE_SERVICE_KEY" || echo "::warning::SUPABASE_SERVICE_KEY missing — 비밀번호 재설정(SMS 인증) 비활성. Secret 등록 필요."
            [ -n "$CRYPTO_KEY" ]    && echo "YOUNGMAN_CRYPTO_KEY=$CRYPTO_KEY"   || echo "::warning::YOUNGMAN_CRYPTO_KEY missing — PII 평문 폴백 (보안 약함)"
            [ -n "$OPENAI_KEY" ]    && echo "OPENAI_API_KEY=$OPENAI_KEY"       || echo "::warning::OPENAI_API_KEY missing"
            [ -n "$RECRAFT_KEY" ]   && echo "RECRAFT_API_KEY=$RECRAFT_KEY"     || true
            [ -n "$IDEOGRAM_KEY" ]  && echo "IDEOGRAM_API_KEY=$IDEOGRAM_KEY"   || echo "::warning::IDEOGRAM_API_KEY missing"
            [ -n "$ANTHROPIC_KEY" ] && echo "ANTHROPIC_API_KEY=$ANTHROPIC_KEY" || echo "::warning::ANTHROPIC_API_KEY missing — Claude HTML 명함 기능 비활성"
            [ -n "$TOGETHER_KEY" ]  && echo "TOGETHER_API_KEY=$TOGETHER_KEY"   || echo "::warning::TOGETHER_API_KEY missing — 사주풀이 gpt-4o 폴백"
            [ -n "$NCP_CLOVA_INVOKE_URL" ] && echo "NCP_CLOVA_INVOKE_URL=$NCP_CLOVA_INVOKE_URL" || echo "::warning::NCP_CLOVA_INVOKE_URL missing — Clova STT 비활성"
            [ -n "$NCP_CLOVA_SECRET" ] && echo "NCP_CLOVA_SECRET=$NCP_CLOVA_SECRET" || echo "::warning::NCP_CLOVA_SECRET missing — Clova STT 비활성"
            if [ -n "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
              # multi-line JSON 보존을 위해 단일 라인 echo. .env 파서가 따옴표 제거하므로 작은따옴표로 감싸기.
              # 단순화: minified JSON 권장. multiline 도 .env 파서가 첫 라인만 잡으므로 사용자가 minify 필수.
              echo "FIREBASE_SERVICE_ACCOUNT_JSON=$FIREBASE_SERVICE_ACCOUNT_JSON"
            else
              echo "::warning::FIREBASE_SERVICE_ACCOUNT_JSON missing — async FCM 발송 비활성 (sync/폴링은 작동)"
            fi
            [ -n "$AUDIO_CLEANUP_TOKEN" ] && echo "AUDIO_CLEANUP_TOKEN=$AUDIO_CLEANUP_TOKEN" || echo "::warning::AUDIO_CLEANUP_TOKEN missing — audio_cleanup.php 호출 시 500"
            [ -n "$LOTTO_DB_HOST" ] && echo "LOTTO_DB_HOST=$LOTTO_DB_HOST"     || echo "LOTTO_DB_HOST=localhost"
            [ -n "$LOTTO_DB_NAME" ] && echo "LOTTO_DB_NAME=$LOTTO_DB_NAME"     || echo "::warning::LOTTO_DB_NAME missing — 로또 DB 기능 비활성"
            [ -n "$LOTTO_DB_USER" ] && echo "LOTTO_DB_USER=$LOTTO_DB_USER"     || echo "::warning::LOTTO_DB_USER missing"
            [ -n "$LOTTO_DB_PASS" ] && echo "LOTTO_DB_PASS=$LOTTO_DB_PASS"     || echo "::warning::LOTTO_DB_PASS missing"
            [ -n "$LOTTO_CRON_TOKEN" ] && echo "LOTTO_CRON_TOKEN=$LOTTO_CRON_TOKEN" || true
            # PortOne + 토스페이먼츠 — 구독 결제 시스템
            [ -n "$PORTONE_STORE_ID" ] && echo "PORTONE_STORE_ID=$PORTONE_STORE_ID" || echo "::warning::PORTONE_STORE_ID missing — 결제 endpoint 503"
            [ -n "$PORTONE_API_SECRET" ] && echo "PORTONE_API_SECRET=$PORTONE_API_SECRET" || echo "::warning::PORTONE_API_SECRET missing — 결제 API 호출 503"
            [ -n "$PORTONE_WEBHOOK_SECRET" ] && echo "PORTONE_WEBHOOK_SECRET=$PORTONE_WEBHOOK_SECRET" || echo "::warning::PORTONE_WEBHOOK_SECRET missing — webhook 검증 503"
            [ -n "$PORTONE_CHANNEL_KEY_TOSS" ] && echo "PORTONE_CHANNEL_KEY_TOSS=$PORTONE_CHANNEL_KEY_TOSS" || echo "::warning::PORTONE_CHANNEL_KEY_TOSS missing — 토스 결제창 비활성"
            # STT provider toggle: 'clova' (기본, 화자분리 포함 ~180원/건) 또는 'whisper' (OpenAI Whisper ~50원/건, 화자분리 없음)
            [ -n "$STT_PROVIDER" ] && echo "STT_PROVIDER=$STT_PROVIDER" || echo "STT_PROVIDER=clova"
            # LLM provider toggle: 'openai' (기본, gpt-4o-mini ~1원/건) 또는 'anthropic' (Claude Sonnet 4.6 ~7~21원/건, 보고서 수준)
            [ -n "$LLM_PROVIDER" ] && echo "LLM_PROVIDER=$LLM_PROVIDER" || echo "LLM_PROVIDER=openai"
            # Phase 2 Path B — recording_jobs cron worker token (X-Cron-Token / X-Internal-Worker-Token 둘 다 같은 값)
            [ -n "$RECORDING_WORKER_TOKEN" ] && echo "RECORDING_WORKER_TOKEN=$RECORDING_WORKER_TOKEN" || echo "::warning::RECORDING_WORKER_TOKEN missing — cron-process-jobs 비활성"
            # Phase 2 외부 worker — Railway 가입 후 URL 등록 시에만 활성. 없으면 cafe24 자체 처리.
            [ -n "$RAILWAY_WORKER_URL" ] && echo "RAILWAY_WORKER_URL=$RAILWAY_WORKER_URL" || true
            # Google Play Billing (사장님 2026-05-26)
            [ -n "$GOOGLE_PLAY_PACKAGE_NAME" ] && echo "GOOGLE_PLAY_PACKAGE_NAME=$GOOGLE_PLAY_PACKAGE_NAME" || echo "GOOGLE_PLAY_PACKAGE_NAME=com.youngmanapp"
            # Service Account JSON — minified 한 줄. FIREBASE_SERVICE_ACCOUNT_JSON 패턴과 동일.
            if [ -n "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" ]; then
              echo "GOOGLE_PLAY_SERVICE_ACCOUNT_JSON=$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON"
            else
              echo "::warning::GOOGLE_PLAY_SERVICE_ACCOUNT_JSON missing — verify-google-purchase / rtdn 비활성"
            fi
            [ -n "$RTDN_SHARED_TOKEN" ] && echo "RTDN_SHARED_TOKEN=$RTDN_SHARED_TOKEN" || true
          } > deploy/.env
          [ -n "$OPENAI_KEY" ]    && echo "OPENAI_API_KEY len=${#OPENAI_KEY}, prefix=$(printf '%s' "$OPENAI_KEY" | head -c6)…"     || true
          [ -n "$RECRAFT_KEY" ]   && echo "RECRAFT_API_KEY len=${#RECRAFT_KEY}, prefix=$(printf '%s' "$RECRAFT_KEY" | head -c6)…"   || true
          [ -n "$IDEOGRAM_KEY" ]  && echo "IDEOGRAM_API_KEY len=${#IDEOGRAM_KEY}, prefix=$(printf '%s' "$IDEOGRAM_KEY" | head -c6)…" || true
          [ -n "$ANTHROPIC_KEY" ] && echo "ANTHROPIC_API_KEY len=${#ANTHROPIC_KEY}, prefix=$(printf '%s' "$ANTHROPIC_KEY" | head -c10)…" || true

      - name: Deploy to Cafe24 (FTP)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.CAFE24_FTP_SERVER || secrets.FTP_SERVER || 'youngman-biz.com' }}
          username: ${{ secrets.CAFE24_FTP_USER || secrets.FTP_USER || 'nxnxqxx' }}
          password: ${{ secrets.CAFE24_FTP_PASSWORD || secrets.FTP_PASSWORD || secrets.FTP_PASS }}
          port: ${{ secrets.CAFE24_FTP_PORT || secrets.FTP_PORT || '21' }}
          protocol: ftp
          local-dir: ./deploy/
          server-dir: ./
          dangerous-clean-slate: false
          log-level: standard
          # Don't try to delete remote files we don't own. We only push our set.
          # NOTE: deploy/.env IS uploaded — it's assembled from GitHub Secrets above.
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**

      - name: Verify deploy via HTTPS
        run: |
          set -euo pipefail
          CB="$(date +%s)"
          MISSING=0
          for f in index.html style.css main.js admin.html admin.js profile.html profile.js auth-shared.js upload.html download.html org.html org.js contracts.html contracts.js customers.html customers.js terms.html privacy.html forms.html forms.js logout.html login-complete.html import-guide.html; do
            code=$(curl -sk -o /dev/null -w "%{http_code}" "https://youngman-biz.com/${f}?cb=${CB}")
            size=$(curl -sk -o /dev/null -w "%{size_download}" "https://youngman-biz.com/${f}?cb=${CB}")
            echo "  ${f}: HTTP ${code}  size=${size}"
            if [ "${code}" != "200" ]; then MISSING=$((MISSING+1)); fi
          done
          rcode=$(curl -sk -o /dev/null -w "%{http_code}" "https://youngman-biz.com/records.php?cb=${CB}")
          echo "  records.php: ${rcode}  (expected 401 without auth)"
          ucode=$(curl -sk -o /dev/null -w "%{http_code}" "https://youngman-biz.com/upload.php?cb=${CB}")
          echo "  upload.php (GET list): ${ucode}  (expected 200)"
          lcode=$(curl -sk -o /dev/null -w "%{http_code}" "https://youngman-biz.com/lotto-recommend.php?cb=${CB}")
          echo "  lotto-recommend.php (GET): ${lcode}  (expected 405 — POST only)"
          prcode=$(curl -sk -o /dev/null -w "%{http_code}" "https://youngman-biz.com/process-recording.php?cb=${CB}")
          echo "  process-recording.php (GET): ${prcode}  (expected 405 — POST only)"
          accode=$(curl -sk -o /dev/null -w "%{http_code}" "https://youngman-biz.com/audio_cleanup.php?cb=${CB}")
          echo "  audio_cleanup.php (GET no token): ${accode}  (expected 401 unauthorized)"
          ocode=$(curl -sk -o /dev/null -w "%{http_code}" "https://youngman-biz.com/lotto_offline_json_import.php?cb=${CB}")
          echo "  lotto_offline_json_import.php: ${ocode}  (expected 200)"
          jsize=$(curl -sk -o /dev/null -w "%{size_download}" "https://youngman-biz.com/lotto_numbers_all.json?cb=${CB}")
          echo "  lotto_numbers_all.json size: ${jsize} bytes (expected ~400KB)"
          curl -sk "https://youngman-biz.com/?cb=${CB}" | grep -E '<title>|main\.js\?v=' | head -2 || true
          if [ "${MISSING}" -gt 0 ]; then
            echo "::error::${MISSING} file(s) returned non-200 — deploy did not propagate"
            exit 1
          fi
          echo "All key files reachable over HTTPS."
