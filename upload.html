<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>개인자료함 · YOUNGMAN</title>
  <link rel="icon" type="image/png" href="logo_main.png">
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="style.css?v=20260516-recipient-remove">
  <style>
    .upload-wrap { max-width: 760px; margin: 3rem auto 5rem; padding: 0 1.5rem; }
    .upload-wrap h2 { margin: 0 0 .35rem; font-size: 1.75rem; letter-spacing: -.01em; font-weight: 700; }
    .upload-wrap .subtitle { color: var(--fg-secondary); margin: 0 0 1rem; font-size: 1rem; font-weight: 500; line-height: 1.55; }
    .upload-wrap .download-note {
      margin: 0 0 1.75rem; padding: .85rem 1rem;
      background: var(--accent-soft); border: 1px solid rgba(200, 54, 44, 0.18);
      border-radius: var(--radius-md); color: var(--accent-deep); font-size: .95rem; font-weight: 500; line-height: 1.6;
    }
    .upload-wrap .download-note b { color: var(--accent-deep); font-weight: 700; }
    .drop-zone {
      display: block;
      border: 1.5px dashed var(--border-strong);
      border-radius: var(--radius-lg);
      padding: 3.25rem 1.5rem;
      text-align: center;
      cursor: pointer;
      transition: border-color .15s ease, background .15s ease;
      background: var(--bg-subtle);
    }
    .drop-zone:hover, .drop-zone.dragover {
      border-color: var(--accent);
      background: var(--accent-soft);
    }
    .drop-zone input[type="file"] { position: absolute; left: -9999px; }
    .drop-zone p { margin: .4rem 0; color: var(--fg-secondary); font-size: 1rem; font-weight: 500; }
    .drop-zone .primary { color: var(--fg); font-weight: 700; font-size: 1.1rem; }
    .upload-status {
      margin-top: 1rem; padding: .85rem 1.1rem;
      border-radius: var(--radius-md); font-size: 1rem; font-weight: 500;
      display: none; word-break: break-all; line-height: 1.5;
    }
    .upload-status.success { background: var(--success-soft); color: var(--success); display: block; }
    .upload-status.error { background: var(--danger-soft); color: var(--danger); display: block; }
    .upload-status code {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: .95em; background: rgba(0,0,0,.04); padding: .15rem .45rem;
      border-radius: var(--radius-xs); font-weight: 600;
    }
    .copy-btn {
      margin-left: .5rem; padding: .4rem .85rem; font-size: .9rem; font-weight: 600;
      background: var(--bg); border: 1px solid var(--border-strong);
      border-radius: var(--radius-sm); cursor: pointer; color: var(--fg);
    }
    .copy-btn:hover { background: var(--bg-muted); }
    .recent-head { display: flex; align-items: baseline; justify-content: space-between; margin: 2.5rem 0 1rem; }
    .recent-head h3 { margin: 0; font-size: 1.2rem; font-weight: 700; }
    .recent-head .hint { color: var(--fg-secondary); font-size: .95rem; font-weight: 500; }
    .recent-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: .75rem;
    }
    .recent-item {
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      overflow: hidden;
      background: var(--bg);
      transition: border-color .15s ease;
      display: flex; flex-direction: column;
    }
    .recent-item:hover { border-color: var(--border-strong); }
    .recent-item a.thumb { display: block; aspect-ratio: 4/3; overflow: hidden; background: var(--bg-muted); }
    .recent-item img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .recent-item .doc-thumb {
      width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      background: var(--bg-subtle); color: var(--fg-secondary);
      font-size: 2rem; font-weight: 700; letter-spacing: .03em;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    .recent-item .meta {
      padding: .6rem .75rem; font-size: .85rem; font-weight: 500;
      color: var(--fg-secondary); display: flex; flex-direction: column; gap: .45rem;
    }
    .recent-item .meta .name {
      color: var(--fg); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 700; font-size: .95rem;
    }
    .recent-item .meta .actions { display: flex; gap: .35rem; flex-wrap: wrap; }
    .recent-item .meta .actions button { margin: 0; font-size: .85rem; }
    .recent-empty { color: var(--fg-secondary); font-size: 1rem; font-weight: 500; padding: 1.5rem 0; }
  </style>
</head>
<body>
  <header id="app-header" class="app-header"></header>

  <main class="upload-wrap">
    <h2>개인자료함</h2>
    <p class="subtitle">이미지·동영상·문서 (PDF/Office/ZIP/CSV/TXT) 를 본인 자료함에 업로드합니다. 자료는 사용자별로 격리되어 다른 사람 자료는 보이지 않습니다.</p>
    <p class="download-note">📎 <b>업로드된 파일은 해당 링크를 통해 다운로드 받으실 수 있습니다.</b> 각 파일의 <b>URL 복사</b> 버튼으로 링크를 가져가세요. 링크를 받은 사람은 별도 로그인 없이 다운로드할 수 있으니 외부 공유에 주의하세요.</p>

    <label class="drop-zone" id="drop-zone" for="file-input">
      <p class="primary">클릭하거나 드래그해서 업로드</p>
      <p>캡쳐화면을 Ctrl+V 하시면 바로 업로드됩니다</p>
      <p>이미지 ≤ 20MB · 동영상 ≤ 100MB · 일반 파일 ≤ 50MB</p>
      <input type="file" id="file-input">
    </label>

    <div id="status" class="upload-status"></div>

    <div class="recent-head">
      <h3>내 자료</h3>
      <span class="hint" id="recentHint">최신순 · 100개까지 표시</span>
    </div>
    <div id="recent" class="recent-grid"></div>
  </main>

  <script type="module">
    import { initSupabase, getSession, getAccessToken, bootApp } from './auth-shared.js?v=20260516-recipient-remove';

    const fileInput = document.getElementById('file-input');
    const dropZone = document.getElementById('drop-zone');
    const statusEl = document.getElementById('status');
    const recentEl = document.getElementById('recent');
    const recentHint = document.getElementById('recentHint');

    let booted = false;

    bootApp();
    (async () => {
        try { await initSupabase(); } catch {}
        const session = getSession();
        if (!session) {
            recentEl.innerHTML = '<div class="recent-empty">로그인이 필요합니다. <a href="index.html" style="color:var(--accent);">홈으로 이동</a></div>';
            recentHint.textContent = '';
            return;
        }
        booted = true;
        loadRecent();
    })();

    async function authedFetch(url, init = {}) {
        const token = await getAccessToken({ forceRefresh: true });
        const headers = { ...(init.headers || {}) };
        if (token) {
            headers.Authorization = 'Bearer ' + token;
            headers['X-Auth-Token'] = token;   // 일부 호스팅이 Authorization 을 깎을 때 백업
        }
        // multipart FormData 인 경우 _token 필드도 함께 첨부 (서버 fallback).
        if (token && init.body instanceof FormData && !init.body.has('_token')) {
            init.body.append('_token', token);
        }
        // GET 등 body 가 없는 경우 query string 에 _token 추가.
        let finalUrl = url;
        if (token && (!init.method || init.method === 'GET')) {
            finalUrl += (url.includes('?') ? '&' : '?') + '_token=' + encodeURIComponent(token);
        }
        return fetch(finalUrl, { ...init, headers });
    }

    function setStatus(html, type) {
      statusEl.className = 'upload-status ' + (type || '');
      statusEl.innerHTML = html;
    }

    async function copyText(text, btn) {
      try {
        await navigator.clipboard.writeText(text);
        if (btn) { const old = btn.textContent; btn.textContent = '복사됨'; setTimeout(() => btn.textContent = old, 1200); }
      } catch {}
    }

    async function upload(file) {
      if (!file) return;
      if (!booted) { setStatus('로그인이 필요합니다.', 'error'); return; }
      setStatus('업로드 중…', 'success');
      const fd = new FormData();
      fd.append('file', file);
      try {
        const res = await authedFetch('upload.php', { method: 'POST', body: fd });
        const data = await res.json();
        if (!data.ok) throw new Error(data.error || '업로드 실패');
        statusEl.className = 'upload-status success';
        statusEl.innerHTML = '';
        const span = document.createElement('span');
        span.innerHTML = '업로드 완료 — 공유 URL: <code></code>';
        span.querySelector('code').textContent = data.url;
        const btn = document.createElement('button');
        btn.className = 'copy-btn';
        btn.type = 'button';
        btn.textContent = 'URL 복사';
        btn.addEventListener('click', () => copyText(data.url, btn));
        const open = document.createElement('a');
        open.className = 'copy-btn';
        open.href = data.url;
        open.target = '_blank';
        open.rel = 'noopener';
        open.textContent = '다운로드 페이지 열기';
        open.style.textDecoration = 'none';
        statusEl.appendChild(span);
        statusEl.appendChild(btn);
        statusEl.appendChild(open);
        loadRecent();
      } catch (e) {
        setStatus('실패: ' + (e.message || e), 'error');
      }
    }

    async function loadRecent() {
      try {
        const res = await authedFetch('upload.php?cb=' + Date.now());
        const data = await res.json();
        if (!data.ok) throw new Error(data.error);
        const files = data.files || [];
        if (!files.length) {
          recentEl.innerHTML = '<div class="recent-empty">아직 업로드된 자료가 없습니다.</div>';
          return;
        }
        recentEl.innerHTML = '';
        for (const f of files) {
          const item = document.createElement('div');
          item.className = 'recent-item';
          // src = 파일 직접 경로 (썸네일 표시용), shareUrl = 다운로드 페이지 (URL 복사용)
          const src = f.src || ('/uploads/' + encodeURIComponent(f.name));
          const shareUrl = f.shareUrl || src;
          const fullShareUrl = location.origin + shareUrl;

          const thumb = document.createElement('a');
          thumb.className = 'thumb';
          thumb.href = shareUrl;          // 썸네일 클릭 → 다운로드 페이지
          thumb.target = '_blank';
          thumb.rel = 'noopener';
          if (f.kind === 'video') {
            const v = document.createElement('video');
            v.src = src; v.muted = true; v.playsInline = true; v.preload = 'metadata';
            v.style.cssText = 'width:100%;height:100%;object-fit:cover;display:block;background:#000;';
            thumb.appendChild(v);
          } else if (f.kind === 'image') {
            const img = document.createElement('img');
            img.src = src; img.loading = 'lazy'; img.alt = f.name;
            thumb.appendChild(img);
          } else {
            const dt = document.createElement('div');
            dt.className = 'doc-thumb';
            dt.textContent = (f.ext || '').toUpperCase() || '파일';
            thumb.appendChild(dt);
          }

          const meta = document.createElement('div');
          meta.className = 'meta';
          const name = document.createElement('div');
          name.className = 'name';
          name.textContent = f.name;
          name.title = f.name;
          const actions = document.createElement('div');
          actions.className = 'actions';

          const open = document.createElement('a');
          open.className = 'copy-btn';
          open.href = shareUrl;
          open.target = '_blank';
          open.rel = 'noopener';
          open.textContent = '다운로드 페이지';
          open.style.textDecoration = 'none';

          const cp = document.createElement('button');
          cp.className = 'copy-btn';
          cp.type = 'button';
          cp.textContent = 'URL 복사';
          cp.addEventListener('click', (ev) => {
            ev.preventDefault();
            copyText(fullShareUrl, cp);
          });

          const del = document.createElement('button');
          del.className = 'copy-btn';
          del.type = 'button';
          del.textContent = '삭제';
          del.style.color = 'var(--danger)';
          del.style.borderColor = 'var(--danger)';
          del.addEventListener('click', async (ev) => {
            ev.preventDefault();
            if (!confirm(`"${f.name}" 을(를) 삭제할까요? 되돌릴 수 없습니다.`)) return;
            del.disabled = true; del.textContent = '삭제 중…';
            try {
              const res = await authedFetch('upload.php?action=delete&name=' + encodeURIComponent(f.name), { method: 'DELETE' });
              const data = await res.json().catch(() => null);
              if (!res.ok || !data?.ok) throw new Error(data?.error || ('실패 ' + res.status));
              loadRecent();
            } catch (e) {
              del.disabled = false; del.textContent = '삭제';
              setStatus('삭제 실패: ' + (e.message || e), 'error');
            }
          });

          actions.appendChild(open);
          actions.appendChild(cp);
          actions.appendChild(del);
          meta.appendChild(name);
          meta.appendChild(actions);
          item.appendChild(thumb);
          item.appendChild(meta);
          recentEl.appendChild(item);
        }
      } catch (e) {
        recentEl.innerHTML = '<div class="recent-empty">목록을 불러올 수 없습니다: ' + (e.message || e) + '</div>';
      }
    }

    fileInput.addEventListener('change', () => upload(fileInput.files[0]));
    ['dragenter', 'dragover'].forEach(t => dropZone.addEventListener(t, (e) => {
      e.preventDefault(); e.stopPropagation();
      dropZone.classList.add('dragover');
    }));
    ['dragleave', 'drop'].forEach(t => dropZone.addEventListener(t, (e) => {
      e.preventDefault(); e.stopPropagation();
      dropZone.classList.remove('dragover');
    }));
    dropZone.addEventListener('drop', (e) => {
      const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
      if (f) upload(f);
    });
    document.addEventListener('paste', (e) => {
      const items = (e.clipboardData && e.clipboardData.items) || [];
      for (const it of items) {
        if (it.type && it.type.startsWith('image/')) {
          const f = it.getAsFile();
          if (f) { upload(f); return; }
        }
      }
    });
  </script>
</body>
</html>
