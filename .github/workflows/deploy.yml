name: Deploy via FTP

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: cafe24-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: FTP Deploy
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER || 'youngman-biz.com' }}
          username: ${{ secrets.FTP_USER || 'nxnxqxx' }}
          password: ${{ secrets.FTP_PASS || secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftp
          local-dir: ./
          server-dir: /www/
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.github/**
            **/.gitignore
            **/.env*
            **/.idx*
            **/.vscode/**
            **/node_modules/**
            **/functions/**
            **/README.md
            **/GEMINI.md
            **/blueprint.md
            package.json
            package-lock.json
