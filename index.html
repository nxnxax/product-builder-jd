<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>고객 정보 관리 시스템</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="app-header">
        <div class="header-container">
            <h1>전사 통합 관리 <span class="accent">ERP</span></h1>
            <nav class="main-nav">
                <button id="nav-customers" class="nav-link active">고객 관리</button>
                <button id="nav-employees" class="nav-link">직원 관리</button>
            </nav>
            <div class="header-actions">
                <button id="theme-btn" class="icon-btn">테마 변경</button>
            </div>
        </div>
    </header>

    <main class="dashboard">
        <!-- 고객 관리 섹션 -->
        <section id="customer-section" class="content-section">
            <div class="controls">
                <div class="search-box">
                    <input type="text" id="customer-search" placeholder="고객 이름 검색...">
                </div>
                <button id="add-customer-btn" class="primary-btn">+ 새 고객 등록</button>
            </div>

            <div class="customer-list-container table-wrapper">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>이름</th>
                            <th>전화번호</th>
                            <th>가입일</th>
                            <th>관리</th>
                        </tr>
                    </thead>
                    <tbody id="customer-list">
                        <!-- 고객 정보가 여기에 렌더링됩니다 -->
                    </tbody>
                </table>
                <div id="customer-empty" class="empty-state hidden">
                    <p>등록된 고객이 없습니다.</p>
                </div>
            </div>
        </section>

        <!-- 직원 관리 섹션 -->
        <section id="employee-section" class="content-section hidden">
            <div class="controls">
                <div class="search-box">
                    <input type="text" id="employee-search" placeholder="직원 이름 또는 직함 검색...">
                </div>
                <button id="add-employee-btn" class="primary-btn">+ 새 직원 등록</button>
            </div>

            <div class="employee-list-container table-wrapper">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>이름</th>
                            <th>직함</th>
                            <th>연락처</th>
                            <th>투입일</th>
                            <th>관리</th>
                        </tr>
                    </thead>
                    <tbody id="employee-list">
                        <!-- 직원 정보가 여기에 렌더링됩니다 -->
                    </tbody>
                </table>
                <div id="employee-empty" class="empty-state hidden">
                    <p>등록된 직원이 없습니다.</p>
                </div>
            </div>
        </section>
    </main>

    <!-- 공통 모달 -->
    <div id="app-modal" class="modal hidden">
        <div class="modal-content">
            <header class="modal-header">
                <h2 id="modal-title">등록</h2>
                <button id="close-modal" class="close-btn">&times;</button>
            </header>
            <form id="app-form">
                <input type="hidden" id="item-id">
                <input type="hidden" id="item-type"> <!-- 'customer' or 'employee' -->
                
                <div id="form-fields">
                    <!-- JS에서 동적으로 필드 생성 -->
                </div>

                <div class="form-actions">
                    <button type="button" id="cancel-btn" class="secondary-btn">취소</button>
                    <button type="submit" id="save-btn" class="primary-btn">저장하기</button>
                </div>
            </form>
        </div>
    </div>

    <script src="main.js" type="module"></script>
</body>
</html>
