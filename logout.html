<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>로그아웃 중… · YOUNGMAN</title>
<meta name="robots" content="noindex,nofollow">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
<link rel="icon" type="image/png" href="logo_main.png">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
    html, body { margin:0; padding:0; background:#fbf8f3; font-family:'Pretendard',-apple-system,system-ui,sans-serif; color:#0e0d0c }
    .wrap { min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:20px; padding:24px; text-align:center }
    img { height:38px; opacity:.85 }
    .ring { width:38px; height:38px; border:3px solid rgba(200,54,44,.18); border-top-color:#c8362c; border-radius:50%; animation:spin .9s linear infinite }
    @keyframes spin { to { transform:rotate(360deg) } }
    p { margin:0; color:#4f4943; font-size:14px; letter-spacing:-.005em }
    small { display:block; color:#8a847e; font-size:12px; margin-top:6px }
    a { color:#0e0d0c; font-weight:600 }
</style>
</head>
<body class="is-anon">
    <div class="wrap" role="status" aria-live="polite">
        <img src="logo_main.png" alt="YOUNGMAN">
        <div class="ring" aria-hidden="true"></div>
        <p>로그아웃 처리 중…<small>모든 디바이스의 세션을 종료합니다.</small></p>
        <small>이동되지 않으면 <a href="index.html">여기를 눌러 메인으로 이동</a>하세요.</small>
    </div>
    <script type="module">
        /* =========================================================================
           단일 로그아웃 cleanup 페이지 — 모든 로그아웃 경로의 종착지.

           중요: signOut({ scope: 'global' }) 사용.
             - default 'local' 은 현재 디바이스 storage 만 clear, 서버 refresh token 살아있음.
             - 다른 브라우저/탭/디바이스에서 그 refresh token 으로 silent refresh 발생 가능.
             - 같은 origin 의 다른 탭이 메모리 session 유지하면 자기 페이지에서 로그인 상태 유지.
             - 'global' 은 서버의 모든 refresh token revoke → 어떤 디바이스든 401 처리.
           ========================================================================= */

        const TARGET = 'index.html?_a=' + Date.now();

        // cleanup — 전체 wipe + KEEP 키만 백업/복원.
        // 이 방식은 (1) 어떤 supabase 키 prefix 도 빠짐없이 제거 (2) 사용자 슬롯 선택값만 살림.
        // 정밀 패턴 매칭이 미지의 supabase 키 잔재를 남길 위험 차단.
        const KEEP_PATTERNS = [
            /^yman_nav_/i,             // 헤더 신규양식 슬롯 1/2 선택값
            /^erp\.userEmail\.last$/i, // 재로그인 시 슬롯 키 매칭용 마지막 email
        ];
        const shouldKeep = (k) => !!k && KEEP_PATTERNS.some(p => p.test(k));

        function clearStorage() {
            // 1) localStorage 의 KEEP 키 백업
            const backup = {};
            try {
                for (let i = 0; i < localStorage.length; i++) {
                    const k = localStorage.key(i);
                    if (shouldKeep(k)) {
                        try { backup[k] = localStorage.getItem(k); } catch {}
                    }
                }
            } catch {}

            // 2) 전체 wipe
            try { sessionStorage.clear(); } catch {}
            try { localStorage.clear(); } catch {}

            // 3) KEEP 복원
            try {
                Object.entries(backup).forEach(([k, v]) => {
                    if (v !== null && v !== undefined) {
                        try { localStorage.setItem(k, v); } catch {}
                    }
                });
            } catch {}
            // 쿠키 — 인증 관련 추정되는 것만
            try {
                document.cookie.split(';').forEach(c => {
                    const eq = c.indexOf('=');
                    const name = (eq > -1 ? c.substr(0, eq) : c).trim();
                    if (!name) return;
                    const low = name.toLowerCase();
                    if (low.startsWith('sb-') || low.includes('supabase') || low.includes('auth') || low.includes('session')) {
                        document.cookie = name + '=; expires=Thu, 01 Jan 1970 00:00:00 GMT; path=/;';
                        document.cookie = name + '=; expires=Thu, 01 Jan 1970 00:00:00 GMT; path=/; domain=' + location.hostname + ';';
                    }
                });
            } catch {}
            // IndexedDB — supabase 관련만 (안전망)
            try {
                if (typeof indexedDB !== 'undefined' && indexedDB.databases) {
                    indexedDB.databases().then(dbs => {
                        dbs.forEach(db => {
                            if (db?.name && /supabase|auth|sb-/.test(db.name.toLowerCase())) {
                                try { indexedDB.deleteDatabase(db.name); } catch {}
                            }
                        });
                    }).catch(() => {});
                }
            } catch {}
        }

        // ChatGPT 진단 (2026-05-20) 반영 — explicit 가드:
        // URL 에 ?explicit=1 없으면 사용자 명시 의도 아님 (history.back / 잘못된 navigation race).
        // 그 경우 notifyLogout() 호출 X, sessionStorage flag 도 set X.
        // 사용자 명시 logout 버튼은 logout.html?explicit=1 으로 진입.
        const _isExplicitLogout = (() => {
            try {
                const params = new URLSearchParams(window.location.search);
                return params.get('explicit') === '1';
            } catch { return false; }
        })();

        // 사장님 2026-05-21 hotfix — module top-level `return` 은 SyntaxError.
        // login-complete.html 의 a2385b8 와 동일 패턴. if 블록 안에 전체 흐름 통합.
        if (_isExplicitLogout) {
            // 0) 사용자 의도적 로그아웃 플래그 set — auth-shared.js 가 SIGNED_OUT 시점에 이 플래그를 보고만 logout 통보.
            try { sessionStorage.setItem('erp.userInitiatedLogout', '1'); } catch {}

            // 0-2) 네이티브 앱에 logout 먼저 통보 — navigation race 로 SIGNED_OUT 이벤트가 못 닿는 경우 대비.
            try {
                const b = await import('./bridge.js?v=20260528-startsubscription');
                b.notifyLogout();
            } catch {}

            // 1) Supabase signOut — scope: 'global' 로 서버의 모든 refresh token revoke.
            //    다른 브라우저/디바이스에서 silent refresh 로 살아나는 시나리오 차단.
            try {
                const mod = await import('./auth-shared.js?v=20260528-bridge-subs');
                const result = await mod.initSupabase().catch(() => null);
                const client = result?.client;
                if (client?.auth?.signOut) {
                    // global scope — 서버의 모든 refresh token revoke.
                    // 실패해도 storage 직접 cleanup 으로 보강.
                    await Promise.race([
                        client.auth.signOut({ scope: 'global' }).catch(() => {
                            // global 권한 부족하면 local fallback
                            return client.auth.signOut().catch(() => {});
                        }),
                        new Promise(r => setTimeout(r, 1200)),   // 1.2초 timeout
                    ]);
                }
            } catch {}

            // 2) storage 광범위 정리
            clearStorage();
            // 3) 100ms 양보 (signOut 비동기 storage write 완료 대비) + 한 번 더
            await new Promise(r => setTimeout(r, 100));
            clearStorage();

            // 4) 새 URL 로 replace — cache-bust query 로 bfcache 회피.
            try { window.location.replace(TARGET); }
            catch { try { window.location.href = TARGET; } catch {} }

            // 5) 1.5초 fallback — 여전히 본 페이지면 강제 이동.
            setTimeout(() => {
                if (window.location.pathname.endsWith('logout.html')) {
                    try { window.location.href = TARGET; } catch {}
                    setTimeout(() => { try { window.location.reload(); } catch {} }, 800);
                }
            }, 1500);
        } else {
            // explicit 아닌 진입 (history.back / redirect race) — logout 의도 아님.
            // 사용자에게 안내 후 메인 페이지로 이동.
            try { console.warn('[logout.html] not explicit, redirecting to index'); } catch {}
            try { window.location.replace('/'); } catch {}
        }
    </script>
</body>
</html>
