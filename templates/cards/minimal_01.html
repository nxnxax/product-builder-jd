<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Card · minimal_01</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root {
  --bg: {{neutral}};
  --fg: {{fg}};
  --accent: {{primary}};
  --secondary: {{secondary}};
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: #f4f4f4; }
body { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 40px; font-family: 'Pretendard', -apple-system, sans-serif; }
.card {
  width: {{width}}px; height: {{height}}px;
  background: var(--bg);
  color: var(--fg);
  position: relative;
  display: grid;
  grid-template-rows: 1fr auto;
  padding: 10% 9%;
  box-shadow: 0 12px 36px rgba(0,0,0,0.08), 0 1px 3px rgba(0,0,0,0.04);
  overflow: hidden;
}
.upper { display: flex; flex-direction: column; justify-content: center; align-items: flex-start; }
.name { font-size: 1.95em; font-weight: 600; letter-spacing: -0.024em; line-height: 1.05; word-break: keep-all; }
.title { font-size: 0.78em; color: var(--secondary); margin-top: 0.55em; letter-spacing: 0.02em; }
.lower { display: grid; grid-template-columns: 1fr auto; gap: 1.2em; align-items: end; padding-top: 1.4em; border-top: 1px solid var(--accent); }
.left-meta { font-size: 0.68em; color: var(--secondary); line-height: 1.65; letter-spacing: 0.01em; }
.right-meta { font-size: 0.68em; color: var(--secondary); line-height: 1.65; text-align: right; }
.company { font-size: 0.85em; font-weight: 600; color: var(--fg); letter-spacing: -0.005em; word-break: keep-all; }
.empty { display: none; }
</style>
</head>
<body>
  <article class="card">
    <div class="upper">
      <div class="name">{{name}}</div>
      <div class="title {{title_empty}}">{{title}}</div>
    </div>
    <div class="lower">
      <div class="left-meta">
        <div class="company {{company_empty}}">{{company}}</div>
        <div class="{{address_empty}}" style="margin-top:.35em;">{{address}}</div>
      </div>
      <div class="right-meta">
        <div class="{{phone_empty}}">{{phone}}</div>
        <div class="{{email_empty}}">{{email}}</div>
      </div>
    </div>
  </article>
</body>
</html>
