<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>내 양식 · YOUNGMAN</title>
<link rel="icon" type="image/png" href="logo_main.png">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="style.css?v=20260515-nav-persist">
<style>
:root{
    --ledger-line:rgba(20,14,8,.09); --ledger-line-strong:rgba(20,14,8,.16);
    --ledger-bg:#fbf7ef; --ledger-accent:#c8362c; --ledger-accent-deep:#8a2620;
}
.ledger-shell{max-width:1100px;margin:0 auto;padding:32px 24px 80px}
.ledger-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.ledger-title{margin:0;font-size:24px;letter-spacing:-.02em}
.ledger-sub{margin:6px 0 0;color:#8a847e;font-size:13.5px;line-height:1.55}
.tiny-btn{border:1px solid var(--ledger-line-strong);background:#fff;color:#4f4943;font-size:13px;padding:7px 13px;border-radius:8px;cursor:pointer;font-family:inherit;font-weight:500;transition:all 160ms}
.tiny-btn:hover{background:#fbf7ef;color:#0e0d0c}
.tiny-btn.primary{background:#0e0d0c;color:#fff;border-color:#0e0d0c}
.tiny-btn.primary:hover{background:#2a2520}
.tiny-btn.danger{color:var(--ledger-accent);border-color:rgba(200,54,44,.3)}
.tiny-btn.danger:hover{background:#fff8f7}

/* 양식 카드 그리드 */
.form-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.form-card{background:#fff;border:1px solid var(--ledger-line);border-radius:14px;padding:18px 18px 14px;cursor:pointer;transition:all 160ms;display:flex;flex-direction:column;gap:6px;position:relative}
.form-card:hover{border-color:var(--ledger-line-strong);box-shadow:0 4px 14px rgba(20,14,8,.06)}
.form-card-title{font-size:17px;font-weight:700;color:#0e0d0c;letter-spacing:-.01em;line-height:1.3;word-break:break-word}
.form-card-meta{font-size:12.5px;color:#8a847e}
.form-card-actions{display:flex;gap:6px;margin-top:8px;padding-top:8px;border-top:1px solid var(--ledger-line)}
.form-card-actions .tiny-btn{font-size:12px;padding:5px 9px}
.form-card-new{border:2px dashed var(--ledger-line-strong);background:transparent;align-items:center;justify-content:center;text-align:center;color:#8a847e;font-weight:600;font-size:15px;min-height:140px}
.form-card-new:hover{border-color:#0e0d0c;color:#0e0d0c;background:#fbf7ef}
.empty-state{padding:60px 20px;text-align:center;color:#8a847e}
.empty-state h2{margin:0 0 8px;font-size:18px;color:#4f4943}

/* ===== Ledger 표 + accordion-card — customers/contracts/org 와 동일 UI ===== */
.tbl-wrap{overflow-x:auto}
table.ledger-tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.ledger-tbl thead th{background:#fbf7ef;border-bottom:1px solid var(--ledger-line-strong);text-align:left;padding:10px 12px;font-weight:600;font-size:12.5px;color:#4f4943;letter-spacing:.01em;white-space:nowrap}
.ledger-tbl tbody td{padding:9px 12px;border-bottom:1px solid var(--ledger-line);vertical-align:middle}
.ledger-tbl tbody tr:hover{background:#fbfaf5}
.ledger-tbl tbody tr.selected{background:#fff8f7}
.ledger-tbl .col-no{width:48px;text-align:center;color:#8a847e;font-variant-numeric:tabular-nums}
.ledger-tbl .col-check{width:36px;text-align:center}
.ledger-tbl .col-check input[type=checkbox]{width:15px;height:15px;cursor:pointer;accent-color:var(--ledger-accent)}
.ledger-tbl .col-action{width:120px;text-align:right;white-space:nowrap}
.row-action-btn{border:0;background:transparent;color:#8a847e;font-size:13px;cursor:pointer;padding:4px 6px;border-radius:5px;font-family:inherit;display:inline-flex;align-items:center;gap:2px}
.row-action-btn:hover{color:var(--ledger-accent);background:#fff8f7}
.row-action-btn.danger:hover{color:var(--ledger-accent)}
.ledger-tbl thead th[data-col-key]{cursor:pointer;user-select:none;position:relative;transition:background 120ms}
.ledger-tbl thead th[data-col-key]:hover{background:#f4efe7 !important}
.ledger-tbl thead th[data-col-key].col-filtered{color:var(--ledger-accent) !important;background:rgba(200,54,44,.08) !important}
.cell-text{display:inline-block;font-size:13px;color:#0e0d0c;line-height:1.4}
.cell-multiline{white-space:pre-wrap;max-width:280px;font-size:12.5px;color:#4f4943}
.cell-empty{color:#c4bfb8;font-size:13px}

.accordion-card{background:#fff;border:1px solid var(--ledger-line-strong);border-radius:14px;margin-bottom:14px;overflow:hidden;box-shadow:0 2px 6px rgba(20,14,8,.04)}
.accordion-card.open{box-shadow:0 10px 28px rgba(20,14,8,.09);border-color:var(--ledger-accent-deep)}
.accordion-card.open .accordion-head{background:linear-gradient(180deg,var(--ledger-bg) 0%,#fff 100%);border-bottom:1px solid var(--ledger-line)}
.accordion-head{display:flex;align-items:center;gap:12px;padding:16px 20px;user-select:none;position:relative;flex-wrap:wrap}
.accordion-head::before{content:'';width:4px;height:34px;border-radius:99px;background:var(--ledger-accent);flex-shrink:0;opacity:1}
.accordion-head h3{margin:0;font-size:18px;font-weight:700;letter-spacing:-.015em;color:#0e0d0c}
.accordion-head .head-count{color:#8a847e;font-size:13.5px;margin-left:6px;font-weight:500}
.accordion-head .head-actions{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
.accordion-head .head-actions button{border:1px solid transparent;background:transparent;padding:7px 13px;border-radius:7px;cursor:pointer;font-size:13.5px;color:#4f4943;font-family:inherit;font-weight:600}
.accordion-head .head-actions button:hover{background:#fbf7ef;color:#0e0d0c;border-color:var(--ledger-line)}
.accordion-body{display:block}

/* 양식 사용 화면 — 상단 백 버튼 */
.use-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.back-btn{border:0;background:transparent;color:#4f4943;font-size:14px;cursor:pointer;font-family:inherit;padding:6px 10px;border-radius:8px;font-weight:500}
.back-btn:hover{background:#fbf7ef;color:#0e0d0c}
.use-head h2{margin:0;font-size:20px}

/* 빌더 모달 — 큼직 + 시력 약한 사용자 대응 */
.builder-modal .modal-panel{max-width:680px}
.builder-modal .modal-body{max-height:65vh;overflow-y:auto;padding:8px 4px}
.field-list{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.field-item{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:14px 14px;background:#fbf7ef;border:1px solid var(--ledger-line);border-radius:12px}
.field-item.editing{background:rgba(200,54,44,.07);border-color:rgba(200,54,44,.3)}
.field-item-name{font-size:16px;font-weight:700;color:#0e0d0c;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:-.005em}
.field-item-type{font-size:13px;font-weight:600;color:#4f4943;padding:4px 10px;background:#fff;border:1px solid var(--ledger-line);border-radius:99px;white-space:nowrap}
.field-item-toggle-labels{font-size:13px;color:#4f4943;margin-top:4px;font-weight:500}
.field-item .icon-btn{border:1px solid transparent;background:transparent;cursor:pointer;width:36px;height:36px;border-radius:8px;color:#4f4943;font-size:16px;font-weight:600;display:inline-flex;align-items:center;justify-content:center}
.field-item .icon-btn:hover{background:#fff;color:#0e0d0c;border-color:var(--ledger-line)}
.field-item .icon-btn.danger:hover{color:var(--ledger-accent);border-color:rgba(200,54,44,.3)}
.field-item .icon-btn:disabled{opacity:.35;cursor:not-allowed}

.field-add-row{display:flex;gap:10px;align-items:center;margin-top:18px;padding:14px;background:#fbf7ef;border:1px dashed var(--ledger-line-strong);border-radius:12px;flex-wrap:wrap}
.field-add-row input[type=text],.field-add-row select{padding:10px 14px;border:1px solid var(--ledger-line);border-radius:9px;font-size:15px;font-weight:500;font-family:inherit;background:#fff;color:#0e0d0c;outline:none}
.field-add-row input[type=text]:focus,.field-add-row select:focus{border-color:#0e0d0c}
.field-add-row input[data-add-label]{flex:1;min-width:160px}
.field-add-row select[data-add-type]{flex:0 0 auto;min-width:140px}
.field-add-row .tiny-btn{padding:10px 16px !important;font-size:14px !important;font-weight:600 !important;white-space:nowrap;flex-shrink:0}
.field-add-row .add-go-btn{margin-left:auto;flex-shrink:0;white-space:nowrap;min-width:120px}
.field-add-row .toggle-extra{display:flex;gap:8px;width:100%;margin-top:10px}
.field-add-row .toggle-extra input{flex:1}
.field-add-row .extra-row{display:flex;flex-direction:column;gap:8px;width:100%;margin-top:10px}
.field-add-row .extra-row input,.field-add-row .extra-row select,.field-add-row .extra-row textarea{
    padding:10px 14px;border:1px solid var(--ledger-line);border-radius:9px;font-size:15px;font-weight:500;
    font-family:inherit;background:#fff;color:#0e0d0c;outline:none;width:100%;box-sizing:border-box;
}
.field-add-row .extra-row textarea{resize:vertical;min-height:84px;line-height:1.5}
.field-add-row .extra-row[data-extra-toggle]{flex-direction:row}
.field-add-row .extra-row[data-extra-toggle] input{flex:1}
.field-add-row .extra-row[data-extra-ref]{flex-direction:row;flex-wrap:wrap}
.field-add-row .extra-row[data-extra-ref] select{flex:1 1 160px}
.field-add-row .add-required-check{display:inline-flex;align-items:center;gap:7px;font-size:14px;color:#0e0d0c;font-weight:600;white-space:nowrap;cursor:pointer;padding:6px 4px}
.field-add-row .add-required-check input{accent-color:var(--ledger-accent);width:17px;height:17px;cursor:pointer}
.field-add-row .add-edit-status{flex:1 1 100%;background:rgba(200,54,44,0.08);border:1px solid rgba(200,54,44,.22);border-radius:9px;padding:10px 14px;font-size:14px;color:var(--ledger-accent-deep);font-weight:700;display:flex;align-items:center;gap:8px}
.field-add-row .add-edit-status .tiny-btn{margin-left:auto;font-size:13px !important;padding:6px 12px !important}

/* 필드 리스트 — 편집/순서 변경 버튼 영역 + 필수 뱃지 */
.field-item-required-badge{display:inline-block;margin-left:8px;padding:2px 8px;background:rgba(200,54,44,.12);color:var(--ledger-accent-deep);border-radius:5px;font-size:12.5px;font-weight:700;vertical-align:2px}
.field-item-actions{display:inline-flex;gap:3px}

/* 빌더 모달 안 양식 제목 라벨도 가독성 */
.builder-modal label[for=formTitleInput],
.builder-modal .form-help{font-size:14px !important;font-weight:600 !important;color:#0e0d0c !important;margin-bottom:6px;display:block}

/* 폼 제목 입력 */
.form-title-input{width:100%;padding:13px 16px;border:1px solid var(--ledger-line-strong);border-radius:10px;font-size:17px;font-weight:700;font-family:inherit;color:#0e0d0c;outline:none;margin-bottom:10px;background:#fff}
.form-title-input:focus{border-color:#0e0d0c}

/* 토글 셀 — 양식 사용 화면 */
.toggle-cell{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:99px;font-size:14.5px;font-weight:700;cursor:pointer;user-select:none;border:1px solid transparent}
.toggle-cell.on{background:#e6f4ea;color:#1b5e20;border-color:#a5d6a7}
.toggle-cell.off{background:#fce8e6;color:#8a2620;border-color:#f1c4c1}

/* 좌우 스위치 (양식 사용 + 모달) */
.switch-cell{display:inline-flex;align-items:center;gap:10px;cursor:pointer;user-select:none;font-size:14px;font-weight:600}
.switch-cell .switch-track{display:inline-block;width:44px;height:24px;border-radius:99px;background:#d1cdc6;position:relative;transition:background 200ms;flex-shrink:0}
.switch-cell .switch-thumb{position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.15);transition:left 200ms}
.switch-cell.on .switch-track{background:var(--ledger-accent)}
.switch-cell.on .switch-thumb{left:22px}
.switch-cell .switch-label{color:#0e0d0c}

/* 모달 안 스위치 컨트롤 */
.switch-control{display:inline-flex;align-items:center;gap:12px;cursor:pointer;user-select:none;padding:6px 0}
.switch-control .switch-track{display:inline-block;width:52px;height:28px;border-radius:99px;background:#d1cdc6;position:relative;transition:background 200ms;flex-shrink:0}
.switch-control .switch-thumb{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.18);transition:left 200ms}
.switch-control .switch-track.on{background:var(--ledger-accent)}
.switch-control .switch-track.on .switch-thumb{left:27px}
.switch-control .switch-label-text{font-size:15px;font-weight:600;color:#0e0d0c}

/* 수식 도움말 details */
.formula-help summary{padding:6px 0;font-size:13px !important}
.formula-help code{background:#f4efe7;padding:2px 6px;border-radius:4px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;color:#4f4943}

/* 양식 설정 섹션 */
.settings-section{margin-top:18px;padding:14px 16px;background:#fbf7ef;border:1px solid var(--ledger-line);border-radius:12px}
.settings-section[open]{background:#fff;border-color:var(--ledger-line-strong)}
.settings-section summary{cursor:pointer;font-size:15px;font-weight:700;color:#0e0d0c;list-style:none;padding:2px 0}
.settings-section summary::-webkit-details-marker{display:none}
.settings-section summary::after{content:" ▾";color:#8a847e;font-size:13px}
.settings-section[open] summary::after{content:" ▴"}
.settings-section code{background:#f4efe7;padding:2px 6px;border-radius:4px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;color:#4f4943}
.settings-list{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.settings-list:empty{display:none}
.settings-item{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:center;padding:10px 12px;background:#fbf7ef;border:1px solid var(--ledger-line);border-radius:9px}
.settings-item-key{font-size:14.5px;font-weight:700;color:#0e0d0c}
.settings-item-val{font-size:14.5px;font-weight:600;color:#4f4943}
.settings-item .icon-btn{border:0;background:transparent;cursor:pointer;width:32px;height:32px;border-radius:6px;color:#8a847e;font-size:15px;display:inline-flex;align-items:center;justify-content:center}
.settings-item .icon-btn.danger:hover{color:var(--ledger-accent);background:#fff8f7}
.settings-add{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.settings-add input{flex:1 1 140px;min-width:0;padding:9px 12px;border:1px solid var(--ledger-line);border-radius:8px;font-size:14px;font-weight:500;background:#fff;color:#0e0d0c;font-family:inherit;outline:none}
.settings-add input:focus{border-color:#0e0d0c}
.settings-add .tiny-btn{flex:0 0 auto;white-space:nowrap}

/* 수식 UI 빌더 */
.formula-builder{display:flex;flex-direction:column;gap:10px;width:100%;margin-top:10px;padding:12px;background:#fff;border:1px solid var(--ledger-line);border-radius:10px}
.formula-toolbar{display:flex;gap:8px;flex-wrap:wrap}
.formula-toolbar select{flex:1 1 140px;padding:8px 10px;border:1px solid var(--ledger-line);border-radius:8px;font-size:13.5px;font-weight:600;background:#fbf7ef;color:#0e0d0c;cursor:pointer;font-family:inherit}
.formula-toolbar select:hover{background:#fff;border-color:var(--ledger-line-strong)}
.formula-ops{display:flex;gap:6px;flex-wrap:wrap}
.formula-ops button{padding:8px 14px;border:1px solid var(--ledger-line);background:#fbf7ef;color:#0e0d0c;font-size:15px;font-weight:700;border-radius:8px;cursor:pointer;font-family:inherit;min-width:42px}
.formula-ops button:hover{background:#fff;border-color:var(--ledger-line-strong)}
.formula-ops .formula-clear{margin-left:auto;color:var(--ledger-accent);border-color:rgba(200,54,44,.25);min-width:auto;padding:8px 12px;font-size:13px}
.formula-ops .formula-clear:hover{background:#fff8f7}

/* 모바일에서 form-grid 1열 / 패딩 줄임 + 빌더 모달 정리 */
@media (max-width:640px){
    .ledger-shell{padding:18px 12px 80px}
    .ledger-title{font-size:20px}
    .form-grid{grid-template-columns:1fr;gap:10px}
    .form-card{padding:14px}
    .builder-modal .modal-panel{max-width:none;margin:8px;max-height:calc(100vh - 16px);display:flex;flex-direction:column}
    .builder-modal .modal-body{max-height:none;flex:1}
    /* 필드 항목 — 2단으로: 이름/뱃지 한 줄, 타입+액션 둘째 줄 */
    .field-item{grid-template-columns:1fr auto;grid-template-rows:auto auto;gap:8px;padding:14px 12px}
    .field-item > div:first-child{grid-column:1 / -1}
    .field-item-name{font-size:16.5px;white-space:normal;word-break:break-word}
    .field-item-type{grid-column:1;justify-self:start;font-size:13px}
    .field-item-actions{grid-column:2;justify-self:end}
    .field-item .icon-btn{width:40px;height:40px;font-size:17px}
    /* 추가/편집 행 — wrap 깔끔하게 */
    .field-add-row{flex-direction:column;align-items:stretch;gap:10px;padding:14px 12px}
    .field-add-row input[data-add-label]{flex:1 1 auto;min-width:0;width:100%}
    .field-add-row select[data-add-type]{width:100%;min-width:0}
    .field-add-row .add-required-check{justify-content:flex-start;width:100%;padding:4px 0;font-size:15px}
    .field-add-row .tiny-btn{width:100%;text-align:center;padding:12px 18px !important;font-size:15.5px !important}
    .field-add-row .add-edit-status{padding:11px 14px;font-size:14.5px}
    .field-add-row .add-edit-status .tiny-btn{width:auto;flex:0 0 auto}
    .toggle-cell{font-size:15.5px;padding:8px 18px}
}
</style>
</head>
<body>

<header id="app-header" class="app-header"></header>

<main id="app-dashboard" class="dashboard">
    <div class="ledger-shell">
        <div id="content"></div>
    </div>
</main>

<!-- 양식 빌더 모달 -->
<div id="builderModal" class="modal-backdrop hidden builder-modal" data-no-close-bg>
    <div class="modal-panel">
        <header class="modal-header">
            <div>
                <h2 id="builderTitle">새 양식 만들기</h2>
                <p class="modal-subtitle">내가 쓰기 편한 항목으로 양식을 직접 구성합니다.</p>
            </div>
        </header>
        <div class="modal-body">
            <label class="form-help" for="formTitleInput" style="font-weight:600;color:#4f4943;">양식 제목</label>
            <input type="text" id="formTitleInput" class="form-title-input" placeholder="예: 거래처 명함, 매물 리스트, 미팅 일지..." maxlength="40">

            <div class="form-help" style="margin-top:14px;font-weight:600;color:#4f4943;">항목 (필드)</div>
            <div id="fieldList" class="field-list"></div>

            <div class="field-add-row" id="fieldAddRow">
                <div class="add-edit-status hidden" data-edit-status>편집 중 · <b data-edit-target></b><button type="button" class="tiny-btn" data-add-cancel>취소</button></div>
                <input type="text" data-add-label placeholder="새 항목 이름 (예: 거래처명, 가격, 진행상태)" maxlength="30">
                <select data-add-type>
                    <option value="text">텍스트</option>
                    <option value="number">숫자</option>
                    <option value="date">날짜</option>
                    <option value="tel">전화번호</option>
                    <option value="textarea">긴 텍스트</option>
                    <option value="toggle">ON/OFF 토글</option>
                    <option value="switch">좌우 스위치</option>
                    <option value="select">드롭다운 (선택)</option>
                    <option value="file">첨부파일</option>
                    <option value="formula">수식 (자동 계산)</option>
                    <option value="ref">다른 양식 참조</option>
                </select>
                <label class="add-required-check"><input type="checkbox" data-add-required> 필수</label>
                <button type="button" class="tiny-btn primary add-go-btn" data-add-go>+ 항목 추가</button>
                <div class="extra-row hidden" data-extra-toggle>
                    <input type="text" data-add-on placeholder="ON 문구 (예: 완료, 계약)" maxlength="12">
                    <input type="text" data-add-off placeholder="OFF 문구 (예: 미완료, 가계약)" maxlength="12">
                </div>
                <div class="extra-row hidden" data-extra-select>
                    <textarea data-add-options placeholder="옵션을 한 줄에 하나씩 입력&#10;예:&#10;진행중&#10;완료&#10;보류" rows="3"></textarea>
                </div>
                <div class="extra-row hidden" data-extra-formula>
                    <input type="text" data-add-formula placeholder="아래 버튼으로 수식 조립 — 예: {수량} * {단가}">
                    <!-- UI 빌더 — 클릭으로 수식 조립 -->
                    <div class="formula-builder">
                        <div class="formula-toolbar">
                            <select data-formula-insert-field><option value="">+ 항목 삽입</option></select>
                            <select data-formula-insert-ref><option value="">+ 다른 양식 셀</option></select>
                            <select data-formula-insert-setting><option value="">+ 다른 양식 설정값</option></select>
                            <select data-formula-insert-fn>
                                <option value="">+ 함수 삽입</option>
                                <option value="IF(__c,__a,__b)">IF (조건)</option>
                                <option value="DAYS(__a,__b)">DAYS (날짜차)</option>
                                <option value="TODAY()">TODAY (오늘)</option>
                                <option value="CONCAT(__a,__b)">CONCAT (연결)</option>
                                <option value="SUM(__a,__b)">SUM (합계)</option>
                                <option value="AVG(__a,__b)">AVG (평균)</option>
                                <option value="MIN(__a,__b)">MIN</option>
                                <option value="MAX(__a,__b)">MAX</option>
                                <option value="COUNT(__a)">COUNT (개수)</option>
                            </select>
                        </div>
                        <div class="formula-ops">
                            <button type="button" data-formula-op="+">+</button>
                            <button type="button" data-formula-op="-">−</button>
                            <button type="button" data-formula-op="*">×</button>
                            <button type="button" data-formula-op="/">÷</button>
                            <button type="button" data-formula-op="(">(</button>
                            <button type="button" data-formula-op=")">)</button>
                            <button type="button" data-formula-op="*0.01" title="× 1%">×1%</button>
                            <button type="button" data-formula-clear class="formula-clear">지우기</button>
                        </div>
                        <details class="formula-help" style="margin:0">
                            <summary style="font-size:13px;color:#4f4943;cursor:pointer;font-weight:700">함수 설명 보기</summary>
                            <div style="font-size:13px;color:#0e0d0c;line-height:1.7;padding:10px 12px;background:#fff;border:1px solid var(--ledger-line);border-radius:8px;margin-top:8px">
                                <div><b>IF(조건, 참값, 거짓값)</b> — 비교는 =, !=, &lt;, &gt;</div>
                                <div><b>DAYS(A, B)</b> — 두 날짜 차이 (일수)</div>
                                <div><b>TODAY()</b> — 오늘 (YYYY-MM-DD)</div>
                                <div><b>CONCAT(a, b, …)</b> — 문자열 연결</div>
                                <div><b>SUM/AVG/MIN/MAX/COUNT("양식", "필드")</b> — 다른 양식 집계</div>
                            </div>
                        </details>
                    </div>
                </div>
                <div class="extra-row hidden" data-extra-ref>
                    <select data-add-ref-form><option value="">참조할 양식을 선택하세요…</option></select>
                    <select data-add-ref-label-key disabled><option value="">참조 양식 선택 후 표시할 항목 선택</option></select>
                    <input type="text" data-add-ref-label-key-text placeholder="또는 직접 키 입력 (예: customer, name)" maxlength="40" class="hidden">
                </div>
            </div>

            <!-- 양식 설정 — 사용자 정의 키-값 (수수료, 비율 등) -->
            <details class="settings-section" id="settingsSection">
                <summary>⚙ 양식 설정 (수수료·비율 등)</summary>
                <p class="form-help" style="margin:8px 0 6px;color:#4f4943">이 양식의 고정값을 등록하면 다른 양식 수식에서 <code>SETTING("이 양식", "키")</code> 로 참조 가능합니다.</p>
                <div id="settingsList" class="settings-list"></div>
                <div class="settings-add">
                    <input type="text" data-setting-key placeholder="설정 이름 (예: 팀장수수료)" maxlength="30">
                    <input type="text" data-setting-value placeholder="값 (예: 3.3 또는 텍스트)" maxlength="50">
                    <button type="button" class="tiny-btn primary" data-setting-add>+ 설정 추가</button>
                </div>
            </details>

            <p class="form-help error hidden" id="builderError"></p>
        </div>
        <footer class="modal-footer">
            <button class="tiny-btn danger" type="button" id="builderDelete" style="margin-right:auto;display:none">양식 삭제</button>
            <button class="tiny-btn" type="button" id="builderCancel">취소</button>
            <button class="tiny-btn primary" type="button" id="builderSave">저장</button>
        </footer>
    </div>
</div>

<script type="module">
    import { mountAppHeader } from './auth-shared.js?v=20260515-nav-persist';
    mountAppHeader();
</script>
<script type="module" src="forms.js?v=20260515-nav-persist"></script>

</body>
</html>
