*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Pretendard,sans-serif;background:var(--bg);color:var(--text);letter-spacing:-.2px}.wrap{max-width:1220px;margin:0 auto;padding:28px 18px 48px}.hero{background:#fff;border:1px solid var(--line);border-radius:28px;padding:30px;box-shadow:var(--shadow);margin-bottom:18px}.badge{display:inline-flex;padding:7px 12px;border-radius:999px;background:#eef6ff;color:#1d4ed8;font-size:12px;font-weight:800}h1{margin:14px 0 0;font-size:42px;line-height:1.1;letter-spacing:-1.6px}.sub{margin-top:12px;max-width:820px;color:var(--muted);font-size:16px;line-height:1.65}.layout{display:grid;grid-template-columns:340px 1fr;gap:18px;align-items:start}.card,.panel{background:#fff;border:1px solid var(--line);border-radius:24px;padding:22px;box-shadow:var(--shadow)}.card-title{font-size:20px;font-weight:850;margin-bottom:14px}.label{font-size:13px;font-weight:800;color:#344054;margin-bottom:8px}textarea{width:100%;min-height:220px;border:1px solid #d9e4ef;border-radius:18px;background:#fff;padding:15px;font-size:16px;line-height:1.6;resize:vertical;outline:none;color:var(--text)}textarea:focus{border-color:#60a5fa;box-shadow:0 0 0 4px rgba(37,99,235,.10)}button{width:100%;height:54px;margin-top:14px;border:0;border-radius:16px;background:#2563eb;color:#fff;font-size:16px;font-weight:850;cursor:pointer;box-shadow:0 10px 22px rgba(37,99,235,.18)}button:disabled{opacity:.65;cursor:wait}.notice{margin-top:12px;color:#667085;font-size:13px;line-height:1.55}.speed-note{background:#ecfdf5;border:1px solid #d1fae5;color:#047857;border-radius:16px;padding:12px}.error{margin-bottom:14px;padding:13px;border-radius:16px;background:#fff1f2;border:1px solid #fecdd3;color:#be123c}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}.metric{border:1px solid var(--line);border-radius:18px;padding:15px;background:#fbfdff}.metric span{display:block;color:var(--muted);font-size:13px}.metric strong{display:block;margin-top:6px;font-size:24px}.main-analysis{border:1px solid var(--line);border-radius:24px;background:#fff;padding:22px;margin-bottom:18px}.analysis-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:14px}.kicker{font-size:12px;color:#2563eb;font-weight:850}.main-keyword{font-size:30px;font-weight:900;margin-top:4px;letter-spacing:-1px}.pill{padding:8px 12px;border-radius:999px;background:#ecfeff;color:#0e7490;font-size:12px;font-weight:850;white-space:nowrap}.summary-box{border:1px solid var(--line);border-radius:18px;background:#f8fbff;padding:15px;color:#344054;line-height:1.65;font-size:15px}.mini-data,.content-supply-table,.channel-grid{display:grid;gap:12px;margin-top:14px}.mini-data{grid-template-columns:repeat(6,1fr)}.content-supply-table{grid-template-columns:repeat(4,1fr)}.channel-grid{grid-template-columns:repeat(4,1fr)}.mini,.supply-card,.channel{border:1px solid var(--line);border-radius:18px;background:#fff;padding:15px}.mini span{display:block;color:var(--muted);font-size:12px}.mini strong{display:block;margin-top:5px;font-size:18px}.section-title{font-size:18px;font-weight:900;margin:20px 0 10px}.supply-card .name,.channel-name{font-size:16px;font-weight:900;margin-bottom:12px}.data-line{display:flex;justify-content:space-between;gap:10px;margin-top:8px;font-size:13px;color:#667085;border:1px solid var(--line);border-radius:14px;background:#fbfdff;padding:10px}.data-line strong{color:#101828}.supply-card:after{content:"";display:block;height:8px;border-radius:999px;background:linear-gradient(90deg,#38bdf8,#10b981);margin:12px 0 2px}.supply-level{display:inline-flex;margin-top:12px;padding:6px 9px;border-radius:999px;background:#ecfdf5;color:#047857;font-size:12px;font-weight:800}.channel-top{display:flex;justify-content:space-between;gap:10px}.score{font-size:17px;font-weight:900;color:#2563eb}.bar{height:8px;background:#eef4fb;border-radius:999px;overflow:hidden;margin:12px 0}.bar span{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#38bdf8,#10b981)}.channel p{margin:0;color:#667085;font-size:13px;line-height:1.55}.supply-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.supply-chip{border:1px solid var(--line);border-radius:14px;background:#fbfdff;padding:10px}.supply-chip span{font-size:11px;color:#667085}.supply-chip b{display:block;margin-top:4px;font-size:13px}.action{margin-top:10px;color:#047857;font-size:13px;font-weight:800;line-height:1.45}.table-wrap{width:100%;overflow-x:auto;border:1px solid var(--line);border-radius:18px;background:#fff}table{width:100%;min-width:820px;border-collapse:collapse;font-size:14px}th,td{padding:13px;border-bottom:1px solid #eef2f6;text-align:left;white-space:nowrap}th{background:#f8fbff;color:#344054;font-weight:850}.tag-main,.tag-related{display:inline-flex;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:800}.tag-main{background:#dbeafe;color:#1d4ed8}.tag-related{background:#f2f4f7;color:#475467}.empty,.loading{padding:22px;color:#667085;border-radius:18px;background:#fbfdff;border:1px dashed var(--line)}
@media(max-width:920px){.wrap{padding:16px 12px 36px}.hero{padding:24px 20px;border-radius:22px}h1{font-size:30px}.layout,.metrics,.mini-data,.content-supply-table,.channel-grid{grid-template-columns:1fr}.card,.panel,.main-analysis{padding:18px;border-radius:20px}.analysis-head{display:block}.pill{display:inline-flex;margin-top:10px}.table-wrap{display:none}.channel-name,.supply-card .name{font-size:20px;line-height:1.25}.content-supply-table .supply-card .data-line{display:grid;grid-template-columns:1fr 1fr;align-items:center}.content-supply-table .supply-card .data-line strong{text-align:right;font-size:16px}}

<body>
<div class="wrap"><section class="hero"><div class="badge">NAVER MARKETING ANALYZER</div><h1>키워드 마케팅 효율 분석</h1><div class="sub">입력 키워드를 기준으로 월간 검색량, 발행량, 경쟁강도를 함께 분석해 가장 효율적인 마케팅 채널을 추천합니다.</div></section>
<div class="layout"><aside class="card"><div class="card-title">키워드 입력</div><form id="form"><div class="label">분석할 키워드</div><textarea id="keywords"></textarea><button id="submit" type="submit">분석하기</button></form><div class="notice">여러 개를 입력하면 줄 단위로 각각 분석합니다.</div><div class="notice speed-note">Cloudflare Pages 버전: API 키는 서버리스 함수 환경변수에 저장됩니다.</div></aside><main class="panel"><div class="card-title">분석 결과</div><div id="result"><div class="empty">키워드를 입력하고 분석 버튼을 누르세요.</div></div></main></div></div>
<script>
const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const countFmt=v=>(v===null||v===undefined)?'-':Number(v).toLocaleString('ko-KR')+'건';
function render(data){const results=data.results||[],mainRows=data.mainRows||[];if(!results.length){$('#result').innerHTML='<div class="empty">분석 결과가 없습니다.</div>';return}let html=`<div class="metrics"><div class="metric"><span>분석 키워드</span><strong>${mainRows.length.toLocaleString('ko-KR')}개</strong></div><div class="metric"><span>전체 데이터</span><strong>${results.length.toLocaleString('ko-KR')}개</strong></div><div class="metric"><span>총 검색량</span><strong>${Number(data.totalVolume||0).toLocaleString('ko-KR')}</strong></div></div>`;
for(const main of mainRows){const a=data.analyses[main.inputKeyword];html+=`<section class="main-analysis"><div class="analysis-head"><div><div class="kicker">입력 키워드 분석</div><div class="main-keyword">${esc(main.keyword)}</div></div><div class="pill">추천 채널: ${esc(a.best.name)}</div></div><div class="summary-box"><b>${esc(a.best.name)}</b> 효율 점수가 가장 높습니다. ${esc(a.reason)}<br>${esc(a.budget)}</div><div class="mini-data"><div class="mini"><span>검색량 등급</span><strong>${esc(a.volumeGrade)}</strong></div><div class="mini"><span>월간 총검색수</span><strong>${Number(main.totalSearch||0).toLocaleString('ko-KR')}</strong></div><div class="mini"><span>월간 모바일</span><strong>${esc(main.mobileSearch)}</strong></div><div class="mini"><span>월간 PC</span><strong>${esc(main.pcSearch)}</strong></div><div class="mini"><span>모바일 비중</span><strong>${esc(a.mobileShare)}%</strong></div><div class="mini"><span>경쟁정도</span><strong>${esc(a.competition)}</strong></div></div><div class="section-title">노출결과 수집 분석</div><div class="content-supply-table">${Object.values(a.contentSupply).map(s=>`<div class="supply-card"><div class="name">${esc(s.label)}</div><div class="data-line"><span>일일 발행량</span><strong>${countFmt(s.daily)}</strong></div><div class="data-line"><span>총 발행량</span><strong>${countFmt(s.total)}</strong></div><div class="supply-level">경쟁강도 ${esc(s.level)}</div></div>`).join('')}</div><div class="channel-grid">${a.channels.map(ch=>`<div class="channel"><div class="channel-top"><div class="channel-name">${esc(ch.name)}</div><div class="score">${ch.score}점</div></div><div class="bar"><span style="width:${ch.score}%"></span></div><p>${esc(ch.desc)}</p><div class="supply-row"><div class="supply-chip"><span>일일</span><b>${countFmt(ch.daily)}</b></div><div class="supply-chip"><span>총량</span><b>${countFmt(ch.total)}</b></div></div><div class="action">실행: ${esc(ch.action)}</div></div>`).join('')}</div></section>`}
html+=`<div class="section-title">키워드 상세 데이터</div><div class="table-wrap"><table><thead><tr><th>입력키워드</th><th>구분</th><th>키워드</th><th>PC</th><th>모바일</th><th>총검색수</th><th>경쟁정도</th><th>상태</th></tr></thead><tbody>${results.map(row=>`<tr><td>${esc(row.inputKeyword)}</td><td><span class="${row.type==='입력키워드'?'tag-main':'tag-related'}">${esc(row.type)}</span></td><td><b>${esc(row.keyword)}</b></td><td>${esc(row.pcSearch)}</td><td>${esc(row.mobileSearch)}</td><td>${Number(row.totalSearch||0).toLocaleString('ko-KR')}</td><td>${esc(row.competition)}</td><td>${esc(row.status)}</td></tr>`).join('')}</tbody></table></div>`;$('#result').innerHTML=html}
$('#form').addEventListener('submit',async e=>{e.preventDefault();const keywords=$('#keywords').value.trim();if(!keywords){$('#result').innerHTML='<div class="error">키워드를 입력해주세요.</div>';return}$('#submit').disabled=true;$('#submit').textContent='분석 중...';$('#result').innerHTML='<div class="loading">분석 데이터를 가져오는 중입니다.</div>';try{const res=await fetch('analyze.php',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({keywords})});const data=await res.json();if(!res.ok)throw new Error(data.error||'분석 실패');render(data)}catch(err){$('#result').innerHTML=`<div class="error">${esc(err.message)}</div>`}finally{$('#submit').disabled=false;$('#submit').textContent='분석하기'}});
</script>
</body></html>
