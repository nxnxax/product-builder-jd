name: Deploy to Cafe24 via SFTP

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: cafe24-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Validate source files
        run: |
          set -euo pipefail
          test -f index.html
          test -f main.js
          test -f style.css
          test -f profile.html
          test -f admin.html
          test -f profile.js
          test -f admin.js
          test -f auth-shared.js
          grep -q 'main.js?v=' index.html
          grep -q 'profile.js?v=' profile.html
          grep -q 'admin.js?v=' admin.html
          php -l api/analyze.php
          php -l api/records.php
          php -l kapp_premium.php
          if [ -f .htaccess ]; then
            echo ".htaccess found; checking for rewrite rules"
            grep -nE 'RewriteEngine|RewriteRule|RewriteCond' .htaccess || true
          else
            echo "No .htaccess file in repository"
          fi

      - name: Prepare deploy files
        run: |
          set -euo pipefail
          rm -rf deploy
          mkdir -p deploy
          cp index.html style.css main.js Marketing.html kapp_premium.php lotto2233.html deploy/
          cp profile.html admin.html profile.js admin.js auth-shared.js deploy/
          cp api/analyze.php deploy/analyze.php
          cp api/records.php deploy/records.php
          if [ -f .htaccess ]; then cp .htaccess deploy/.htaccess; fi

      - name: Deploy to Cafe24 (auto-detect webroot)
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST || 'youngman-biz.com' }}
          SFTP_USER: ${{ secrets.SFTP_USER || 'nxnxqxx' }}
          SFTP_PORT: ${{ secrets.SFTP_PORT || '22' }}
          SFTP_DIR: ${{ secrets.SFTP_DIR || '' }}
          SFTP_KEY: ${{ secrets.SFTP_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${SFTP_KEY}" ]; then
            echo "::error::SFTP_PRIVATE_KEY secret is not set"; exit 1
          fi

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SFTP_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy

          SSH="ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o BatchMode=yes -i ~/.ssh/id_deploy -p ${SFTP_PORT}"
          SCP="scp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o BatchMode=yes -i ~/.ssh/id_deploy -P ${SFTP_PORT} -p"

          echo "==== Remote home / candidate listings ===="
          $SSH "${SFTP_USER}@${SFTP_HOST}" '
            echo "HOME=$HOME"; pwd; echo "---";
            for d in . www public_html html htdocs httpdocs html/htdocs; do
              if [ -d "$d" ]; then
                echo ">>> ls $d (count=$(ls -1A "$d" 2>/dev/null | wc -l))";
                ls -la "$d" 2>/dev/null | head -8;
              fi;
            done
          '

          echo "==== Detecting actual webroot by locating live index.html ===="
          DETECTED=$($SSH "${SFTP_USER}@${SFTP_HOST}" '
            for d in www public_html html htdocs httpdocs html/htdocs .; do
              if [ -f "$d/index.html" ] && grep -q "main.js?v=" "$d/index.html" 2>/dev/null; then
                echo "$d"; exit 0;
              fi;
            done;
            exit 1;
          ' || true)

          if [ -n "${SFTP_DIR}" ]; then
            TARGET="${SFTP_DIR}"
            echo "Using SFTP_DIR override from secret: ${TARGET}"
          elif [ -n "${DETECTED}" ]; then
            TARGET="${DETECTED}"
            echo "Auto-detected webroot: ${TARGET}"
          else
            echo "::error::Could not locate webroot. Set SFTP_DIR secret to the correct path (e.g. www, public_html)."
            exit 1
          fi

          echo "==== Target dir listing BEFORE upload ===="
          $SSH "${SFTP_USER}@${SFTP_HOST}" "ls -la '${TARGET}' | head -40"

          echo "==== deploy/ contents to upload ===="
          ls -la deploy/

          echo "==== Uploading each file (will FAIL LOUDLY on error) ===="
          # shellcheck disable=SC2012
          for f in $(ls -A deploy/); do
            echo ">> ${f}"
            $SCP "deploy/${f}" "${SFTP_USER}@${SFTP_HOST}:${TARGET}/${f}"
          done

          echo "==== Target dir listing AFTER upload ===="
          $SSH "${SFTP_USER}@${SFTP_HOST}" "ls -la '${TARGET}' | head -80"

          echo "==== Per-file presence + size on remote ===="
          $SSH "${SFTP_USER}@${SFTP_HOST}" "T='${TARGET}'; for f in index.html style.css main.js admin.html admin.js profile.html profile.js auth-shared.js .htaccess records.php analyze.php kapp_premium.php lotto2233.html; do \
            if [ -f \"\$T/\$f\" ]; then \
              echo \"OK   \$f  \$(stat -c '%s bytes  %y' \"\$T/\$f\" 2>/dev/null || wc -c < \"\$T/\$f\")\"; \
            else \
              echo \"MISS \$f\"; \
            fi; \
          done"

      - name: Verify deploy via HTTPS
        run: |
          set -euo pipefail
          echo "==== HTTPS spot check (cache-busted) ===="
          CB="$(date +%s)"
          MISSING=0
          for f in index.html style.css main.js admin.html admin.js profile.html profile.js auth-shared.js; do
            code=$(curl -sk -o /dev/null -w "%{http_code}" "https://youngman-biz.com/${f}?cb=${CB}")
            size=$(curl -sk -o /dev/null -w "%{size_download}" "https://youngman-biz.com/${f}?cb=${CB}")
            echo "  ${f}: ${code} size=${size}"
            if [ "${code}" != "200" ]; then MISSING=$((MISSING+1)); fi
          done

          # records.php intentionally returns 401 without auth — that's healthy.
          rcode=$(curl -sk -o /dev/null -w "%{http_code}" "https://youngman-biz.com/records.php?cb=${CB}")
          echo "  records.php: ${rcode}  (expected 401)"

          echo "==== Title + cache-buster ===="
          curl -sk "https://youngman-biz.com/?cb=${CB}" | grep -E '<title>|main\.js\?v=' | head -4 || true

          if [ "${MISSING}" -gt 0 ]; then
            echo "::error::${MISSING} file(s) returned non-200 — deploy did not propagate"
            exit 1
          fi
          echo "All key files reachable over HTTPS."
