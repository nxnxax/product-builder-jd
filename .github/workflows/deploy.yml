name: Deploy to Cafe24

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: cafe24-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy public files to Cafe24 by FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: youngman-biz.com
          username: nxnxqxx
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftp
          local-dir: ./
          server-dir: /
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.github/**
            **/.gitignore
            **/.env*
            **/.idx*
            **/.vscode/**
            **/node_modules/**
            **/functions/**
            **/README.md
            **/GEMINI.md
            **/blueprint.md
            package.json
            package-lock.json
