<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>로그인 처리 중… · YOUNGMAN</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" type="image/png" href="logo_main.png">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
    html, body { margin:0; padding:0; background:#fbf8f3; font-family:'Pretendard',-apple-system,system-ui,sans-serif; color:#0e0d0c }
    .wrap { min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:20px; padding:24px; text-align:center }
    img { height:38px; opacity:.85 }
    .ring { width:38px; height:38px; border:3px solid rgba(200,54,44,.18); border-top-color:#c8362c; border-radius:50%; animation:spin .9s linear infinite }
    @keyframes spin { to { transform:rotate(360deg) } }
    p { margin:0; color:#4f4943; font-size:14px; letter-spacing:-.005em }
    small { display:block; color:#8a847e; font-size:12px; margin-top:6px }
    a { color:#0e0d0c; font-weight:600 }
    .err { color:#c8362c; font-weight:700 }

    /* Google 신규 가입자 추가 정보 입력 form */
    .signup-extra { max-width:420px; margin:0 auto; padding:28px 26px; background:#fff; border-radius:16px; box-shadow:0 24px 60px rgba(20,14,8,.18); }
    .signup-extra h2 { margin:0 0 8px; font-size:22px; font-weight:800; color:#0e0d0c; text-align:center; }
    .signup-extra .sub { margin:0 0 18px; color:#8a847e; font-size:13px; text-align:center; }
    .signup-extra .field { display:flex; flex-direction:column; gap:5px; font-size:12.5px; font-weight:600; color:#4f4943; }
    .signup-extra .field input { padding:10px 13px; border:1px solid rgba(20,14,8,.16); border-radius:8px; font-size:14px; font-family:inherit; outline:none; }
    .signup-extra .field input:focus { border-color:#0e0d0c; }
    .signup-extra .nick-row { display:flex; gap:6px; align-items:flex-end; margin-bottom:12px; }
    .signup-extra .nick-row .field { flex:1; }
    .signup-extra .check-btn { padding:9px 12px; background:#0e0d0c; color:#fff; border:0; border-radius:8px; font-size:12px; font-weight:700; cursor:pointer; white-space:nowrap; font-family:inherit; }
    .signup-extra .check-btn:disabled { opacity:.5; cursor:wait; }
    .signup-extra .nick-result { font-size:11.5px; font-weight:600; margin:-6px 0 12px; }
    .signup-extra .nick-result.ok { color:#1b5e20; }
    .signup-extra .nick-result.ng { color:#c8362c; }
    .signup-extra .phone-row { margin-bottom:12px; }
    .signup-extra .consents { display:flex; flex-direction:column; gap:8px; padding:12px; background:#fbf7ef; border-radius:8px; margin-bottom:12px; }
    .signup-extra .consents label { display:flex; align-items:center; gap:8px; font-size:13px; font-weight:500; color:#4f4943; cursor:pointer; }
    .signup-extra .consents input[type=checkbox] { width:14px; height:14px; accent-color:#c8362c; margin:0; }
    .signup-extra .consents .req { font-size:10.5px; font-weight:700; color:#c8362c; background:rgba(200,54,44,.1); padding:2px 6px; border-radius:4px; }
    .signup-extra .consents .opt { font-size:10.5px; font-weight:700; color:#4f4943; background:rgba(20,14,8,.08); padding:2px 6px; border-radius:4px; }
    .signup-extra .consents a { color:#0e0d0c; text-decoration:underline; font-weight:600; }
    .signup-extra .err-msg { color:#c8362c; font-size:12.5px; font-weight:600; min-height:18px; margin:0 0 8px; }
    .signup-extra .submit { width:100%; padding:12px 18px; background:#0e0d0c; color:#fff; border:0; border-radius:8px; font-size:14px; font-weight:700; cursor:pointer; font-family:inherit; }
    .signup-extra .submit:disabled { opacity:.55; cursor:wait; }
</style>
</head>
<body>
    <div class="wrap" role="status" aria-live="polite" id="loadingState">
        <img src="logo_main.png" alt="YOUNGMAN">
        <div class="ring" aria-hidden="true"></div>
        <p id="msg">로그인 처리 중…<small>잠시 후 이전 페이지로 돌아갑니다.</small></p>
        <small>이동되지 않으면 <a href="customers.html">고객관리대장으로 이동</a>하세요.</small>
    </div>

    <div class="wrap" id="extraWrap" style="display:none;">
        <form class="signup-extra" id="extraForm">
            <h2>가입을 완료해 주세요</h2>
            <p class="sub">YOUNGMAN 에 처음 오셨네요. 닉네임 설정과 약관 동의가 필요합니다.</p>
            <div class="nick-row">
                <label class="field">닉네임 <input type="text" id="extraNickname" minlength="2" maxlength="20" placeholder="2~20자 한글/영문/숫자" required></label>
                <button type="button" class="check-btn" id="extraCheckNick">중복확인</button>
            </div>
            <div class="nick-result" id="extraNickResult" hidden></div>
            <label class="field phone-row">휴대폰 번호 <input type="tel" id="extraPhone" autocomplete="tel" placeholder="010-0000-0000" required></label>
            <div class="consents">
                <label><input type="checkbox" id="extraAgreeAll"> 전체 동의</label>
                <label><input type="checkbox" id="extraAgreeTerms" data-req> <span class="req">필수</span> <a href="terms.html" target="_blank" rel="noopener">이용약관</a>에 동의</label>
                <label><input type="checkbox" id="extraAgreePrivacy" data-req> <span class="req">필수</span> <a href="privacy.html" target="_blank" rel="noopener">개인정보처리방침</a>에 동의</label>
                <label><input type="checkbox" id="extraAgreeMarketing"> <span class="opt">선택</span> 마케팅 정보 수신 동의</label>
            </div>
            <p class="err-msg" id="extraErr"></p>
            <button type="submit" class="submit" id="extraSubmit">가입 완료</button>
        </form>
    </div>
    <script type="module">
        /* =========================================================================
           단일 로그인 transition 페이지 — 모든 로그인 성공 흐름의 종착지.

           이전 분산된 흐름(openSharedLoginModal 안에서 곧장 navigateAfterAuth,
           Google OAuth 가 현재 페이지로 callback) 이 supabase 의 비동기 storage
           write 와 race 해서 "로그인이 가끔 안 됨" 증상 반복 발생.

           이 페이지의 역할:
             1) initSupabase 호출 → supabase 가 storage 에서 session 읽음
                (OAuth 의 경우 URL hash 의 access_token 자동 처리)
             2) getSession 명시 await → session 인식 확정
             3) 짧은 양보(120ms) 후 한 번 더 확인 → 비동기 storage write 따라잡기
             4) ?next=<url> 파라미터로 받은 페이지로 cache-bust replace
             5) 1.8 초 fallback: 여전히 본 페이지면 강제 customers.html 로 이동
           ========================================================================= */

        const $msg = document.getElementById('msg');

        function safeNext(raw) {
            // 외부 URL / 절대 경로 / javascript: 같은 위험 차단 — 같은 사이트의 .html 만 허용.
            // fallback 도 메인(index.html) — 명시되지 않으면 안전 default.
            const decoded = (() => { try { return decodeURIComponent(raw || ''); } catch { return ''; } })()
                .replace(/^\/+/, '');
            if (!decoded) return 'index.html';
            if (!/^[A-Za-z0-9_.-]+(\.html)?(\?[^/]*)?$/.test(decoded)) return 'index.html';
            return decoded;
        }

        const params = new URLSearchParams(location.search);
        const nextRaw = params.get('next');
        const target  = safeNext(nextRaw);

        let session = null;
        try {
            const mod = await import('./auth-shared.js?v=20260517-token-refresh');
            const result = await mod.initSupabase().catch(() => null);
            const client = result?.client;
            if (client?.auth?.getSession) {
                const { data } = await client.auth.getSession();
                session = data?.session || null;
            }
        } catch {}

        // 첫 시도에 session 없으면 짧게 양보 후 한 번 더 — 비동기 storage write 따라잡기.
        if (!session) {
            await new Promise(r => setTimeout(r, 120));
            try {
                const mod = await import('./auth-shared.js?v=20260517-token-refresh');
                const result = await mod.initSupabase().catch(() => null);
                if (result?.client?.auth?.getSession) {
                    const { data } = await result.client.auth.getSession();
                    session = data?.session || null;
                }
            } catch {}
        }

        if (!session) {
            // 세션이 확실히 set 안 된 경우 — 메인 페이지로 가서 로그인 모달 다시 띄움.
            $msg.innerHTML = '<span class="err">로그인이 완료되지 않았습니다.</span><small>메인 페이지로 돌아갑니다.</small>';
            setTimeout(() => { window.location.replace('index.html?_a=' + Date.now()); }, 800);
        } else {
            // session 확정 → members 행 자동 보강 (idempotent ensure mode).
            // supabase auth 에는 있는데 public.members 에 없는 '고아 user' 케이스 자동 복구.
            const meta = session.user?.user_metadata || {};
            const provider = session.user?.app_metadata?.provider || '';
            const isGoogle = provider === 'google';
            let ensureSucceeded = false;
            let needsNickname = false;   // 서버가 알려주는 닉네임 부재 신호 (이미 등록 + 신규 INSERT 둘 다 커버)
            try {
                const ensureResp = await fetch('records.php?resource=auth-member&ensure=1', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + session.access_token,
                    },
                    body: JSON.stringify({
                        resource: 'auth-member',
                        ensure: true,
                        email: session.user?.email || '',
                        fullName: meta.full_name || meta.name || '',
                        phone:    meta.phone || '',
                        nickname: meta.nickname || '',
                    }),
                });
                const ensureData = await ensureResp.json().catch(() => ({}));
                console.log('[ensure member]', ensureResp.status, ensureData);
                ensureSucceeded = ensureResp.ok && (ensureData?.ok || ensureData?.already);
                // server 가 needsNickname=true 면 무조건 닉네임 입력 필요 (신규 INSERT or 기존 nickname 비어있음)
                needsNickname = !!ensureData?.needsNickname;
                if (!ensureSucceeded) {
                    try {
                        sessionStorage.setItem('erp.ensureError', JSON.stringify({
                            status: ensureResp.status,
                            error: ensureData?.error || 'unknown',
                            at: new Date().toISOString(),
                        }));
                    } catch {}
                }
            } catch (e) {
                console.error('[ensure member] fetch error', e);
                try { sessionStorage.setItem('erp.ensureError', JSON.stringify({ error: String(e?.message || e), at: new Date().toISOString() })); } catch {}
            }

            // Google 가입자 + members.nickname 비어있음 (신규 INSERT 또는 기존 행 닉네임 미설정) → 추가 정보 입력 form 표시.
            const needsExtra = isGoogle && needsNickname && !(meta.nickname || '').trim();
            if (needsExtra) {
                document.getElementById('loadingState').style.display = 'none';
                document.getElementById('extraWrap').style.display = 'flex';
                setupExtraForm(session, target);
                // submit 후 진행 — 자동 redirect 안 함. module top-level 이라 return 사용 X.
            } else {

            // 원래 가려던 페이지로 cache-bust replace.
            const sep = target.includes('?') ? '&' : '?';
            const url = target + sep + '_a=' + Date.now();
            try { window.location.replace(url); }
            catch { try { window.location.href = url; } catch {} }

            // fallback — 1.8 초 후에도 여전히 이 페이지면 강제 이동.
            setTimeout(() => {
                if (location.pathname.endsWith('login-complete.html')) {
                    try { window.location.href = 'customers.html?_a=' + Date.now(); } catch {}
                    setTimeout(() => { try { window.location.reload(); } catch {} }, 800);
                }
            }, 1800);
            } /* end else (needsExtra 가 false 인 경우만 redirect) */
        }

        // Google 신규 가입자 — 닉네임 + 약관 입력 form 처리.
        function setupExtraForm(session, target) {
            const form = document.getElementById('extraForm');
            const nickEl = document.getElementById('extraNickname');
            const phoneEl = document.getElementById('extraPhone');
            const checkBtn = document.getElementById('extraCheckNick');
            const resultEl = document.getElementById('extraNickResult');
            const errEl = document.getElementById('extraErr');
            const submitBtn = document.getElementById('extraSubmit');
            const agreeAll = document.getElementById('extraAgreeAll');
            const agreeTerms = document.getElementById('extraAgreeTerms');
            const agreePrivacy = document.getElementById('extraAgreePrivacy');
            const agreeMarketing = document.getElementById('extraAgreeMarketing');
            let nickChecked = false;

            // 전체동의 체크 동기화
            agreeAll.addEventListener('change', () => {
                [agreeTerms, agreePrivacy, agreeMarketing].forEach(el => { el.checked = agreeAll.checked; });
            });
            [agreeTerms, agreePrivacy, agreeMarketing].forEach(el => el.addEventListener('change', () => {
                agreeAll.checked = agreeTerms.checked && agreePrivacy.checked && agreeMarketing.checked;
            }));

            nickEl.addEventListener('input', () => {
                resultEl.hidden = true;
                nickChecked = false;
            });

            // 닉네임 중복확인
            checkBtn.addEventListener('click', async () => {
                const v = nickEl.value.trim();
                if (!v) { resultEl.hidden=false; resultEl.className='nick-result ng'; resultEl.textContent='닉네임을 입력해주세요.'; return; }
                checkBtn.disabled = true; checkBtn.textContent = '확인 중…';
                try {
                    const resp = await fetch('records.php?resource=auth-availability&nickname=' + encodeURIComponent(v), { method: 'GET' });
                    const data = await resp.json().catch(() => ({}));
                    if (data?.nickname_invalid) {
                        resultEl.hidden=false; resultEl.className='nick-result ng';
                        resultEl.textContent = '닉네임은 2~20자, 한글/영문/숫자/_/- 만 가능합니다.';
                    } else if (data?.nickname_taken === true) {
                        resultEl.hidden=false; resultEl.className='nick-result ng';
                        resultEl.textContent = '이미 사용 중인 닉네임입니다.';
                    } else {
                        resultEl.hidden=false; resultEl.className='nick-result ok';
                        resultEl.textContent = '✅ 사용 가능한 닉네임입니다.';
                        nickChecked = true;
                    }
                } catch (e) {
                    resultEl.hidden=false; resultEl.className='nick-result ng';
                    resultEl.textContent = '확인 실패: ' + (e?.message || e);
                } finally {
                    checkBtn.disabled = false; checkBtn.textContent = '중복확인';
                }
            });

            // submit
            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                errEl.textContent = '';
                const nickname = nickEl.value.trim();
                const phoneRaw = phoneEl.value.trim();
                const phoneDigits = phoneRaw.replace(/\D/g, '');
                if (!nickname) { errEl.textContent = '닉네임을 입력해주세요.'; return; }
                if (!nickChecked) { errEl.textContent = '닉네임 중복확인 후 진행해주세요.'; return; }
                if (!phoneDigits) { errEl.textContent = '휴대폰 번호를 입력해주세요.'; return; }
                if (!/^01[016789]\d{7,8}$/.test(phoneDigits)) { errEl.textContent = '올바른 휴대폰 번호를 입력해주세요 (010-0000-0000).'; return; }
                if (!agreeTerms.checked || !agreePrivacy.checked) { errEl.textContent = '필수 약관에 동의해주세요.'; return; }

                submitBtn.disabled = true; submitBtn.textContent = '저장 중…';
                try {
                    // 1) members 행 update (nickname + phone)
                    const updateResp = await fetch('records.php?resource=auth-profile', {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + session.access_token },
                        body: JSON.stringify({ resource: 'auth-profile', data: { nickname, phone: phoneDigits } }),
                    });
                    const updateData = await updateResp.json().catch(() => ({}));
                    if (!updateResp.ok || !updateData?.ok) throw new Error(updateData?.error || ('HTTP ' + updateResp.status));

                    // 2) supabase user_metadata 업데이트 (nickname + 약관 동의 기록)
                    try {
                        const mod = await import('./auth-shared.js?v=20260517-token-refresh');
                        const result = await mod.initSupabase().catch(() => null);
                        const client = result?.client;
                        if (client?.auth?.updateUser) {
                            await client.auth.updateUser({
                                data: {
                                    nickname,
                                    phone: phoneDigits,
                                    terms_agreed: true,
                                    privacy_agreed: true,
                                    marketing_opt_in: !!agreeMarketing.checked,
                                    consent_at: new Date().toISOString(),
                                    app_registered: true,
                                },
                            });
                        }
                    } catch {}

                    // 3) 원래 가려던 페이지로 이동
                    const sep = target.includes('?') ? '&' : '?';
                    const url = target + sep + '_a=' + Date.now();
                    try { window.location.replace(url); }
                    catch { try { window.location.href = url; } catch {} }
                } catch (err) {
                    errEl.textContent = '저장 실패: ' + (err?.message || err);
                    submitBtn.disabled = false; submitBtn.textContent = '가입 완료';
                }
            });

            // 닉네임 input 자동 focus
            setTimeout(() => nickEl?.focus(), 100);
        }
    </script>
</body>
</html>
