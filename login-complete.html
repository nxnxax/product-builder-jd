<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>로그인 처리 중… · YOUNGMAN</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" type="image/png" href="logo_main.png">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
    html, body { margin:0; padding:0; background:#fbf8f3; font-family:'Pretendard',-apple-system,system-ui,sans-serif; color:#0e0d0c }
    .wrap { min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:20px; padding:24px; text-align:center }
    img { height:38px; opacity:.85 }
    .ring { width:38px; height:38px; border:3px solid rgba(200,54,44,.18); border-top-color:#c8362c; border-radius:50%; animation:spin .9s linear infinite }
    @keyframes spin { to { transform:rotate(360deg) } }
    p { margin:0; color:#4f4943; font-size:14px; letter-spacing:-.005em }
    small { display:block; color:#8a847e; font-size:12px; margin-top:6px }
    a { color:#0e0d0c; font-weight:600 }
    .err { color:#c8362c; font-weight:700 }
</style>
</head>
<body>
    <div class="wrap" role="status" aria-live="polite">
        <img src="logo_main.png" alt="YOUNGMAN">
        <div class="ring" aria-hidden="true"></div>
        <p id="msg">로그인 처리 중…<small>잠시 후 이전 페이지로 돌아갑니다.</small></p>
        <small>이동되지 않으면 <a href="customers.html">고객관리대장으로 이동</a>하세요.</small>
    </div>
    <script type="module">
        /* =========================================================================
           단일 로그인 transition 페이지 — 모든 로그인 성공 흐름의 종착지.

           이전 분산된 흐름(openSharedLoginModal 안에서 곧장 navigateAfterAuth,
           Google OAuth 가 현재 페이지로 callback) 이 supabase 의 비동기 storage
           write 와 race 해서 "로그인이 가끔 안 됨" 증상 반복 발생.

           이 페이지의 역할:
             1) initSupabase 호출 → supabase 가 storage 에서 session 읽음
                (OAuth 의 경우 URL hash 의 access_token 자동 처리)
             2) getSession 명시 await → session 인식 확정
             3) 짧은 양보(120ms) 후 한 번 더 확인 → 비동기 storage write 따라잡기
             4) ?next=<url> 파라미터로 받은 페이지로 cache-bust replace
             5) 1.8 초 fallback: 여전히 본 페이지면 강제 customers.html 로 이동
           ========================================================================= */

        const $msg = document.getElementById('msg');

        function safeNext(raw) {
            // 외부 URL / 절대 경로 / javascript: 같은 위험 차단 — 같은 사이트의 .html 만 허용.
            // fallback 도 메인(index.html) — 명시되지 않으면 안전 default.
            const decoded = (() => { try { return decodeURIComponent(raw || ''); } catch { return ''; } })()
                .replace(/^\/+/, '');
            if (!decoded) return 'index.html';
            if (!/^[A-Za-z0-9_.-]+(\.html)?(\?[^/]*)?$/.test(decoded)) return 'index.html';
            return decoded;
        }

        const params = new URLSearchParams(location.search);
        const nextRaw = params.get('next');
        const target  = safeNext(nextRaw);

        let session = null;
        try {
            const mod = await import('./auth-shared.js?v=20260516-login-error-ko');
            const result = await mod.initSupabase().catch(() => null);
            const client = result?.client;
            if (client?.auth?.getSession) {
                const { data } = await client.auth.getSession();
                session = data?.session || null;
            }
        } catch {}

        // 첫 시도에 session 없으면 짧게 양보 후 한 번 더 — 비동기 storage write 따라잡기.
        if (!session) {
            await new Promise(r => setTimeout(r, 120));
            try {
                const mod = await import('./auth-shared.js?v=20260516-login-error-ko');
                const result = await mod.initSupabase().catch(() => null);
                if (result?.client?.auth?.getSession) {
                    const { data } = await result.client.auth.getSession();
                    session = data?.session || null;
                }
            } catch {}
        }

        if (!session) {
            // 세션이 확실히 set 안 된 경우 — 메인 페이지로 가서 로그인 모달 다시 띄움.
            $msg.innerHTML = '<span class="err">로그인이 완료되지 않았습니다.</span><small>메인 페이지로 돌아갑니다.</small>';
            setTimeout(() => { window.location.replace('index.html?_a=' + Date.now()); }, 800);
        } else {
            // session 확정 → members 행 자동 보강 (idempotent ensure mode).
            // supabase auth 에는 있는데 public.members 에 없는 '고아 user' 케이스 자동 복구.
            try {
                const meta = session.user?.user_metadata || {};
                const ensureResp = await fetch('records.php?resource=auth-member&ensure=1', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + session.access_token,
                    },
                    body: JSON.stringify({
                        resource: 'auth-member',
                        ensure: true,
                        email: session.user?.email || '',
                        // metadata 의 user 정보도 함께 보냄 → records.php 가 우선 사용
                        fullName: meta.full_name || meta.name || '',
                        phone:    meta.phone || '',
                        nickname: meta.nickname || '',
                    }),
                });
                const ensureData = await ensureResp.json().catch(() => ({}));
                console.log('[ensure member]', ensureResp.status, ensureData);
                // 실패 시 sessionStorage 에 기록 — 다음 페이지에서 확인 가능
                if (!ensureResp.ok && !ensureData?.ok) {
                    try {
                        sessionStorage.setItem('erp.ensureError', JSON.stringify({
                            status: ensureResp.status,
                            error: ensureData?.error || 'unknown',
                            at: new Date().toISOString(),
                        }));
                    } catch {}
                }
            } catch (e) {
                console.error('[ensure member] fetch error', e);
                try { sessionStorage.setItem('erp.ensureError', JSON.stringify({ error: String(e?.message || e), at: new Date().toISOString() })); } catch {}
            }

            // 원래 가려던 페이지로 cache-bust replace.
            const sep = target.includes('?') ? '&' : '?';
            const url = target + sep + '_a=' + Date.now();
            try { window.location.replace(url); }
            catch { try { window.location.href = url; } catch {} }

            // fallback — 1.8 초 후에도 여전히 이 페이지면 강제 이동.
            setTimeout(() => {
                if (location.pathname.endsWith('login-complete.html')) {
                    try { window.location.href = 'customers.html?_a=' + Date.now(); } catch {}
                    setTimeout(() => { try { window.location.reload(); } catch {} }, 800);
                }
            }, 1800);
        }
    </script>
</body>
</html>
