    <style>

<body>

<script type="module">
    import { initSupabase, apiRequest, getSession, mountAppHeader, mountAppFooter } from './auth-shared.js?v=20260517-session-persist';

    const PLAN_DEFS = [
        {
            key: 'free',
            name: 'Free',
            price: 0,
            tagline: '무료로 영맨의 기본 기능을 사용하세요.',
            features: [
                { text: '고객관리대장 + 양식 커스터마이징', on: true },
                { text: '문자발송 (사용량 개인 부담)', on: true },
                { text: '마케팅 분석', on: true },
                { text: 'AI 사주 + 로또 분석', on: true },
                { text: 'AI 통화 요약 체험 30분/월', on: true },
                { text: '유료 플랜 시 자동 충전 사용 가능', on: false },
            ],
            cta: { primary: false, label: '무료로 시작' },
        },
        {
            key: 'plus',
            name: 'Plus',
            price: 19000,
            tagline: '하루 평균 10분 통화 영업자에게 — AI 요약으로 기록을 자동화.',
            recommended: true,
            features: [
                { text: 'Free 전체 기능 포함', on: true },
                { text: 'AI 통화 요약 월 300분 (분 단위 과금)', on: true },
                { text: '동일 전화번호 통화 자동 누적', on: true },
                { text: '담당자 메모 동기화', on: true },
                { text: '초과 시 자동 충전 (₩5,000 = 71분 추가, 동의 시)', on: true },
            ],
            cta: { primary: true, label: 'Plus 시작하기' },
        },
        {
            key: 'pro',
            name: 'Pro',
            price: 39000,
            tagline: '하루 평균 30분+ 통화 헤비유저에게 — 1,000분 + 자동 충전.',
            features: [
                { text: 'Plus 전체 기능 포함', on: true },
                { text: 'AI 통화 요약 월 1,000분 (분 단위 과금)', on: true },
                { text: '동일 전화번호 통화 자동 누적', on: true },
                { text: '담당자 메모 동기화', on: true },
                { text: '초과 시 자동 충전 (₩5,000 = 71분 추가, 동의 시)', on: true },
            ],
            cta: { primary: true, label: 'Pro 시작하기' },
        },
    ];

    // premium = Phase 1 legacy plan, Plus 와 동일 권한 (백엔드 마이그레이션 적용 후 사라짐).
    const PLAN_LABEL = { free: 'Free', plus: 'Plus', pro: 'Pro', trialing: '신규 체험', premium: 'Plus' };
    function normalizePlan(p) { return (p === 'premium') ? 'plus' : p; }

    function formatPrice(n) {
        if (!n) return '무료';
        return '₩' + Number(n).toLocaleString('ko-KR');
    }

    function escapeHtml(s) {
        return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    function renderPlans(currentPlan, planStatus) {
        const isTrialing = planStatus === 'trialing';
        const html = PLAN_DEFS.map(plan => {
            const isCurrent = (
                (plan.key === 'free' && (currentPlan === 'free' || (isTrialing && currentPlan !== 'plus' && currentPlan !== 'pro'))) ||
                plan.key === currentPlan
            );
            const cardCls = ['plan-card', plan.recommended ? 'recommended' : '', isCurrent ? 'current' : ''].filter(Boolean).join(' ');
            const featuresHtml = plan.features.map(f =>
                `<li class="${f.on ? '' : 'muted'}">${escapeHtml(f.text)}</li>`
            ).join('');

            let ctaHtml;
            if (isCurrent) {
                ctaHtml = `<button class="plan-cta current" type="button" disabled>현재 사용 중</button>`;
            } else if (plan.key === 'free') {
                // 유료 플랜 사용자가 free 로 다운그레이드 — billing 페이지에서 해지로 처리.
                ctaHtml = `<a class="plan-cta secondary" href="billing.html">관리 페이지에서 해지</a>`;
            } else {
                // 결제 진행 — PortOne JS SDK 호출 (data-pay-plan 으로 click handler 가 잡음).
                ctaHtml = `<button class="plan-cta primary" type="button" data-pay-plan="${plan.key}">${escapeHtml(plan.cta.label)}</button>`;
            }

            return `
                <article class="${cardCls}">
                    <h2 class="plan-name">${escapeHtml(plan.name)}</h2>
                    <div class="plan-price">
                        <span class="price-num">${formatPrice(plan.price)}</span>
                        ${plan.price ? '<span class="price-unit">/ 월</span>' : ''}
                    </div>
                    <p class="plan-tagline">${escapeHtml(plan.tagline)}</p>
                    <ul class="plan-features">${featuresHtml}</ul>
                    ${ctaHtml}
                </article>
            `;
        }).join('');

        document.getElementById('sub-content').innerHTML = `<div class="plan-grid">${html}</div>`;

        // 현재 plan 상단 표시
        if (currentPlan && currentPlan !== 'free') {
            const display = document.getElementById('sub-current-display');
            display.style.display = 'block';
            display.innerHTML = `<span class="sub-current-pill">현재 플랜: ${escapeHtml(PLAN_LABEL[currentPlan] || currentPlan)}</span>`;
        }
        if (isTrialing) {
            document.getElementById('sub-trial-banner').style.display = 'block';
        }
    }

    function renderAnon() {
        document.getElementById('sub-content').innerHTML = `
            <div class="anon-notice">
                <p style="font-size:16px;margin-bottom:12px;">구독 정보를 보려면 먼저 <a href="index.html">로그인</a>해 주세요.</p>
                <p style="font-size:13px;color:var(--fg-tertiary);">로그인하지 않아도 아래 플랜 정보는 비교해 보실 수 있습니다.</p>
            </div>
            <div style="margin-top:24px;">${renderPlansHTMLOnly()}</div>
        `;
    }
    function renderPlansHTMLOnly() {
        const html = PLAN_DEFS.map(plan => {
            const cardCls = ['plan-card', plan.recommended ? 'recommended' : ''].filter(Boolean).join(' ');
            const featuresHtml = plan.features.map(f =>
                `<li class="${f.on ? '' : 'muted'}">${escapeHtml(f.text)}</li>`
            ).join('');
            const ctaHtml = `<a class="plan-cta ${plan.cta.primary ? 'primary' : 'secondary'}" href="index.html">로그인 후 시작</a>`;
            return `
                <article class="${cardCls}">
                    <h2 class="plan-name">${escapeHtml(plan.name)}</h2>
                    <div class="plan-price">
                        <span class="price-num">${formatPrice(plan.price)}</span>
                        ${plan.price ? '<span class="price-unit">/ 월</span>' : ''}
                    </div>
                    <p class="plan-tagline">${escapeHtml(plan.tagline)}</p>
                    <ul class="plan-features">${featuresHtml}</ul>
                    ${ctaHtml}
                </article>
            `;
        }).join('');
        return `<div class="plan-grid">${html}</div>`;
    }

    // PortOne 결제 흐름 — SDK 로드 + config 가져오기 + 결제창 호출.
    let _payConfig = null;
    let _payInProgress = false;

    async function ensurePayConfig() {
        if (_payConfig) return _payConfig;
        const r = await fetch('/billing/config.php', { credentials: 'omit' });
        if (!r.ok) throw new Error('결제 설정을 불러올 수 없습니다 (HTTP ' + r.status + ')');
        const data = await r.json();
        if (data.status !== 'ok') throw new Error(data.message || '결제 설정 오류');
        _payConfig = data;
        return data;
    }

    async function ensureSdk() {
        // browser-sdk.js 가 defer 로딩됨 — window.PortOne 가 준비될 때까지 대기.
        for (let i = 0; i < 60; i++) {
            if (window.PortOne && typeof window.PortOne.requestIssueBillingKey === 'function') return;
            await new Promise(r => setTimeout(r, 100));
        }
        throw new Error('PortOne SDK 로드 실패');
    }

    function genId(prefix) {
        const uuid = (crypto && crypto.randomUUID) ? crypto.randomUUID() : (Date.now() + '-' + Math.random().toString(36).slice(2));
        return prefix + '-' + uuid;
    }

    async function startPayment(planKey, profile) {
        if (_payInProgress) return;
        _payInProgress = true;
        const button = document.querySelector(`[data-pay-plan="${planKey}"]`);
        const originalText = button ? button.textContent : '';
        try {
            if (button) { button.disabled = true; button.textContent = '세션 확인 중…'; }
            // 토큰 만료 가능성 — 결제 전 세션 새로 확인. Supabase JS 가 autoRefreshToken=true 이면
            // getSession() 호출이 만료 임박 토큰을 자동 refresh. 없거나 짧은 토큰이면 차단.
            const sessionCheck = getSession();
            if (!sessionCheck?.access_token) {
                alert('로그인 세션이 만료되었습니다. 페이지를 새로고침한 후 다시 로그인해 주세요.');
                window.location.reload();
                return;
            }
            if (button) button.textContent = '결제창 준비 중…';
            const [config] = await Promise.all([ensurePayConfig(), ensureSdk()]);
            const planInfo = config.plans[planKey];
            if (!planInfo) throw new Error('알 수 없는 plan: ' + planKey);

            const issueId = genId('iss');
            const customerEmail = profile.email || '';

            // 모바일은 IFRAME modal 이 화면 폭 벗어남 → REDIRECTION 모드 사용
            // (토스 페이지 전체 화면으로 이동 후 결제 완료 시 우리 페이지로 복귀).
            const isMobile = window.matchMedia('(max-width: 820px)').matches;
            // localStorage 에 pending plan 임시 저장 — redirect 후 복귀 시 사용.
            try {
                localStorage.setItem('billing_pending', JSON.stringify({ plan: planKey, issueId, ts: Date.now() }));
            } catch {}

            const issueParams = {
                storeId: config.storeId,
                channelKey: config.channelKey,
                billingKeyMethod: 'CARD',
                issueId,
                issueName: planInfo.label + ' 정기결제 등록',
                customer: {
                    customerId: customerEmail,
                    email: customerEmail,
                    fullName: profile.name || customerEmail,
                },
            };
            if (isMobile) {
                issueParams.redirectUrl = window.location.origin + '/subscribe.html?billing_return=1';
                // PortOne V2 의 모바일 windowType — redirection 강제.
                issueParams.windowType = { pc: 'IFRAME', mobile: 'REDIRECTION' };
            }

            // Step 1 — 빌링키만 발급 (토스페이먼츠는 requestIssueBillingKeyAndPay 미지원).
            if (button) button.textContent = isMobile ? '결제 페이지로 이동…' : '카드 등록 창 여는 중…';
            const resp = await window.PortOne.requestIssueBillingKey(issueParams);

            // REDIRECTION 모드는 페이지 navigate 됨 — 아래 코드 도달 안 함 (성공 시).
            // 이 아래는 PC IFRAME 모드의 성공/실패 응답 처리.

            if (resp && resp.code) {
                if (button) { button.disabled = false; button.textContent = originalText; }
                if (resp.code !== 'PORTONE_USER_CANCEL') {
                    alert('카드 등록 실패: ' + (resp.message || resp.code));
                }
                return;
            }

            const billingKey = resp && resp.billingKey ? resp.billingKey : '';
            if (!billingKey) {
                if (button) { button.disabled = false; button.textContent = originalText; }
                alert('빌링키 발급 응답이 비어있습니다. 다시 시도해 주세요.');
                return;
            }

            // Step 2 — 서버에 빌링키 전달, 서버가 PortOne API 로 첫 결제 실행 + DB 갱신.
            if (button) button.textContent = '결제 처리 중…';
            // 빌링키 발급 동안 토큰 만료 가능 — 다시 fresh session.
            const session = getSession();
            if (!session?.access_token) {
                alert('세션이 만료되었습니다. 빌링키는 발급됐으니 페이지 새로고침 후 다시 결제 버튼을 누르거나, 관리자에게 카드 등록 ID 를 알려주세요:\n' + issueId);
                window.location.reload();
                return;
            }
            const verify = await fetch('/billing/verify-payment.php', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + session.access_token,
                },
                body: JSON.stringify({ billingKey, issueId, plan: planKey }),
            });
            const result = await verify.json();
            if (result.status !== 'ok') {
                if (button) { button.disabled = false; button.textContent = originalText; }
                // 진단용 — 콘솔에 raw 응답 dump (PortOne schema 분석용)
                try { console.error('[subscribe] verify-payment 실패 응답', result); } catch {}
                let msg = '결제 처리 실패: ' + (result.message || result.code);
                if (result.payment_id) msg += '\n결제 ID: ' + result.payment_id;
                if (result.debug && result.debug.response_keys) {
                    msg += '\n응답 keys: ' + result.debug.response_keys.join(', ');
                }
                alert(msg);
                return;
            }

            window.location.href = '/billing.html?success=1';
        } catch (e) {
            if (button) { button.disabled = false; button.textContent = originalText; }
            console.error('[subscribe] payment error', e);
            alert('결제 진행 중 오류: ' + (e?.message || e));
        } finally {
            _payInProgress = false;
        }
    }

    // 모바일 REDIRECTION 모드로 결제 후 복귀 — query string 에서 billingKey 받음.
    async function handleBillingReturn() {
        const url = new URL(window.location.href);
        if (url.searchParams.get('billing_return') !== '1') return false;
        const billingKey = url.searchParams.get('billingKey') || url.searchParams.get('billing_key') || '';
        const errCode = url.searchParams.get('code');
        const errMsg = url.searchParams.get('message');
        // 임시 저장된 plan / issueId 복원
        let pending = null;
        try {
            const raw = localStorage.getItem('billing_pending');
            if (raw) pending = JSON.parse(raw);
        } catch {}
        // 사용 후 정리 + URL 깨끗이.
        try { localStorage.removeItem('billing_pending'); } catch {}
        history.replaceState(null, '', window.location.pathname);

        if (errCode || !billingKey || !pending?.plan) {
            if (errCode) alert('결제 취소/실패: ' + (errMsg || errCode));
            return false;
        }
        // verify-payment 서버 호출
        try {
            await initSupabase();
            const session = getSession();
            if (!session?.access_token) {
                alert('세션이 만료되었습니다. 다시 로그인 후 결제 페이지에서 재시도해 주세요.');
                return false;
            }
            const verify = await fetch('/billing/verify-payment.php', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + session.access_token,
                },
                body: JSON.stringify({ billingKey, issueId: pending.issueId, plan: pending.plan }),
            });
            const result = await verify.json();
            if (result.status !== 'ok') {
                alert('결제 처리 실패: ' + (result.message || result.code) + (result.payment_id ? '\n결제 ID: ' + result.payment_id : ''));
                return false;
            }
            window.location.href = '/billing.html?success=1';
            return true;
        } catch (e) {
            alert('결제 확인 중 오류: ' + (e?.message || e));
            return false;
        }
    }

    (async function boot() {
        mountAppHeader();
        mountAppFooter();
        try { await initSupabase(); } catch {}
        // 모바일 결제 후 복귀 처리 (페이지 일반 렌더 전).
        if (await handleBillingReturn()) return;
        const session = getSession();
        if (!session?.user) {
            renderAnon();
            return;
        }
        let currentProfile = { email: session.user.email, plan: 'trialing', plan_status: 'trialing', name: '' };
        try {
            const res = await apiRequest('auth-profile');
            currentProfile = Object.assign(currentProfile, res?.profile || {});
            const plan = normalizePlan((currentProfile.plan || 'trialing').toLowerCase());
            const planStatus = (currentProfile.plan_status || 'trialing').toLowerCase();
            renderPlans(plan, planStatus);
        } catch (e) {
            console.warn('[subscribe] profile fetch failed', e);
            renderPlans('trialing', 'trialing');
        }
        // 결제 버튼 click handler.
        document.querySelectorAll('[data-pay-plan]').forEach(btn => {
            btn.addEventListener('click', () => startPayment(btn.dataset.payPlan, currentProfile));
        });
    })();
</script>
