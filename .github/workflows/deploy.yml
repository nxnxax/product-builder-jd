name: Deploy to Cafe24 via SFTP

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: cafe24-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Validate source files
        run: |
          set -euo pipefail
          test -f index.html
          test -f main.js
          test -f style.css
          test -f profile.html
          test -f admin.html
          test -f profile.js
          test -f admin.js
          test -f auth-shared.js
          grep -q 'main.js?v=' index.html
          grep -q 'profile.js?v=' profile.html
          grep -q 'admin.js?v=' admin.html
          php -l api/analyze.php
          php -l api/records.php
          php -l kapp_premium.php
          if [ -f .htaccess ]; then
            echo ".htaccess found; checking for rewrite rules"
            grep -nE 'RewriteEngine|RewriteRule|RewriteCond' .htaccess || true
          else
            echo "No .htaccess file in repository"
          fi

      - name: Prepare deploy files
        run: |
          set -euo pipefail
          rm -rf deploy
          mkdir -p deploy
          cp index.html style.css main.js Marketing.html kapp_premium.php lotto2233.html deploy/
          cp profile.html admin.html profile.js admin.js auth-shared.js deploy/
          cp api/analyze.php deploy/analyze.php
          cp api/records.php deploy/records.php
          if [ -f .htaccess ]; then cp .htaccess deploy/.htaccess; fi

      - name: Deploy to Cafe24
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SFTP_HOST || 'youngman-biz.com' }}
          username: ${{ secrets.SFTP_USER || 'nxnxqxx' }}
          port: ${{ secrets.SFTP_PORT || 22 }}
          key: ${{ secrets.SFTP_PRIVATE_KEY }}
          source: "deploy/*,deploy/.htaccess"
          target: ${{ secrets.SFTP_DIR || './' }}
          strip_components: 1
          overwrite: true
          debug: true

      - name: Check HTTP status
        run: |
          set -euo pipefail
          curl -I --fail https://youngman-biz.com/
