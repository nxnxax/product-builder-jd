<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>조직도 · YOUNGMAN</title>
<link rel="icon" type="image/png" href="logo_main.png">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="style.css?v=20260512-dropdown-center">
<style>
:root{
    --ledger-line:rgba(20,14,8,.09); --ledger-line-strong:rgba(20,14,8,.16);
    --ledger-bg:#fbf7ef; --ledger-accent:#c8362c; --ledger-accent-deep:#8a2620;
}
.ledger-shell{max-width:1280px;margin:0 auto;padding:32px 24px 80px}
.ledger-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.ledger-title{margin:0;font-size:24px;letter-spacing:-.02em}
.ledger-sub{margin:6px 0 0;color:#8a847e;font-size:13.5px;line-height:1.55}

.group-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:14px 16px;background:#fff;border:1px solid var(--ledger-line);border-radius:12px;margin-bottom:14px}
.group-bar .label{font-size:12.5px;color:#8a847e;font-weight:600;letter-spacing:.02em;margin-right:4px}
.group-pill{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;background:#fbf7ef;border:1px solid var(--ledger-line-strong);border-radius:999px;font-size:13px;cursor:pointer;font-family:inherit;color:#0e0d0c;transition:all 160ms}
.group-pill:hover{background:#f4efe7}
.group-pill.active{background:#0e0d0c;color:#fff;border-color:#0e0d0c}
.group-pill.multi-mode{background:#fff8f7;border-color:rgba(200,54,44,.4);color:var(--ledger-accent-deep)}
.group-pill.multi-mode.active{background:var(--ledger-accent);color:#fff;border-color:var(--ledger-accent)}
.group-pill input[type=checkbox]{width:14px;height:14px;accent-color:var(--ledger-accent);margin:0}
.tiny-btn{border:1px solid var(--ledger-line-strong);background:#fff;color:#4f4943;font-size:12.5px;padding:6px 11px;border-radius:7px;cursor:pointer;font-family:inherit;font-weight:500;transition:all 160ms}
.tiny-btn:hover{background:#fbf7ef;color:#0e0d0c}
.tiny-btn.danger{color:var(--ledger-accent);border-color:rgba(200,54,44,.3)}
.tiny-btn.danger:hover{background:#fff8f7}
.tiny-btn.primary{background:#0e0d0c;color:#fff;border-color:#0e0d0c}
.tiny-btn.primary:hover{background:#2a2520}

.team-section{background:#fff;border:1px solid var(--ledger-line);border-radius:12px;padding:0;margin-bottom:18px;overflow:hidden}
.team-head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--ledger-line);background:#fbf7ef}
.team-head h3{margin:0;font-size:15px;font-weight:700;letter-spacing:-.005em}
.team-head .count{color:#8a847e;font-size:12.5px;margin-left:8px;font-weight:500}
.team-head .actions{display:flex;gap:6px}

.tbl-wrap{overflow-x:auto}
table.ledger-tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.ledger-tbl thead th{position:sticky;top:0;background:#fbf7ef;border-bottom:1px solid var(--ledger-line-strong);text-align:left;padding:10px 12px;font-weight:600;font-size:12.5px;color:#4f4943;letter-spacing:.01em;white-space:nowrap}
.ledger-tbl thead .filter-row th{background:#fff;border-bottom:1px solid var(--ledger-line);padding:6px 8px}
.ledger-tbl thead .filter-row input{width:100%;height:28px;padding:0 8px;border:1px solid var(--ledger-line);border-radius:6px;font-size:12px;background:#fbf7ef;color:#0e0d0c;font-family:inherit;outline:none}
.ledger-tbl thead .filter-row input:focus{border-color:#0e0d0c;background:#fff}
.ledger-tbl tbody td{padding:10px 12px;border-bottom:1px solid var(--ledger-line);vertical-align:middle}
.ledger-tbl tbody tr:hover{background:#fbfaf5}
.ledger-tbl tbody tr.selected{background:#fff8f7}
.ledger-tbl tbody td input,.ledger-tbl tbody td select{width:100%;height:30px;padding:0 8px;border:1px solid transparent;background:transparent;border-radius:5px;font-size:13px;color:#0e0d0c;font-family:inherit;outline:none;transition:all 120ms}
.ledger-tbl tbody td input:focus,.ledger-tbl tbody td select:focus{border-color:#0e0d0c;background:#fff}
.ledger-tbl tbody td input:hover,.ledger-tbl tbody td select:hover{background:#fff;border-color:var(--ledger-line)}
.ledger-tbl .col-no{width:48px;text-align:center;color:#8a847e;font-variant-numeric:tabular-nums}
.ledger-tbl .col-check{width:36px;text-align:center}
.ledger-tbl .col-check input[type=checkbox]{width:15px;height:15px;cursor:pointer;accent-color:var(--ledger-accent)}
.ledger-tbl .col-action{width:72px;text-align:right;white-space:nowrap}
.row-action-btn{border:0;background:transparent;color:#8a847e;font-size:13px;cursor:pointer;padding:4px 6px;border-radius:5px;font-family:inherit}
.row-action-btn:hover{color:var(--ledger-accent);background:#fff8f7}

.team-foot{padding:10px 18px;border-top:1px solid var(--ledger-line);background:#fbfaf5}

.bulk-bar{position:sticky;top:64px;background:#fff;border:1px solid var(--ledger-line-strong);padding:12px 16px;display:none;align-items:center;justify-content:space-between;gap:10px;border-radius:12px;box-shadow:0 8px 24px rgba(20,14,8,.08);z-index:60;margin-bottom:14px}
.bulk-bar.active{display:flex}
.bulk-bar .info{font-size:13px;color:#4f4943}
.bulk-bar .info b{color:var(--ledger-accent);font-weight:700}

.notice-foot{margin-top:24px;padding:14px 18px;background:rgba(200,54,44,.06);border:1px solid rgba(200,54,44,.18);border-radius:10px;color:var(--ledger-accent-deep);font-size:13px;line-height:1.6}

.empty{text-align:center;padding:60px 24px;color:#8a847e;font-size:14px;line-height:1.7;background:#fff;border:1px dashed var(--ledger-line-strong);border-radius:12px}
.empty b{color:#0e0d0c}

/* 모달 — 통일 시스템(.modal-backdrop / .modal-panel)은 style.css 에서. 여기는 페이지 고유 보강만. */
.modal-panel .checkboxes{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.modal-panel .checkboxes label{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border:1px solid var(--ledger-line-strong);border-radius:999px;font-weight:500;cursor:pointer;margin:0;font-size:13px;background:#fff;transition:all 160ms}
.modal-panel .checkboxes label:has(input:checked){background:#0e0d0c;color:#fff;border-color:#0e0d0c}
.modal-panel .checkboxes input[type=checkbox]{width:14px;height:14px;margin:0;accent-color:var(--ledger-accent)}

.type-comm-list{margin-top:8px;border:1px solid var(--ledger-line);border-radius:8px;padding:8px;background:#fbf7ef}
.type-comm-row{display:grid;grid-template-columns:140px 1fr 1fr 1fr 32px;gap:6px;align-items:center;margin-bottom:6px}
.type-comm-row.role-lead{grid-template-columns:140px 1fr 32px}
.type-comm-row.role-lead [data-role-cell="head"],
.type-comm-row.role-lead [data-role-cell="lead"]{display:none}
.type-comm-row:last-child{margin-bottom:0}
.type-comm-row input{height:32px !important;font-size:12.5px !important}
.type-comm-row .x{border:0;background:transparent;color:#b91c1c;cursor:pointer;font-size:16px;line-height:1}

.dropdown{position:relative;display:inline-block}
.dropdown-menu{position:absolute;top:calc(100% + 6px);left:0;background:#fff;border:1px solid var(--ledger-line-strong);border-radius:8px;box-shadow:0 8px 24px rgba(20,14,8,.12);min-width:240px;max-height:300px;overflow-y:auto;z-index:50;padding:6px;display:none}
.dropdown-menu.open{display:block}
.dropdown-menu .item{padding:9px 12px;border-radius:6px;cursor:pointer;font-size:13px;display:flex;align-items:center;gap:8px}
.dropdown-menu .item:hover{background:#fbf7ef}
.dropdown-menu .item.current{font-weight:600}
.dropdown-menu .divider{height:1px;background:var(--ledger-line);margin:4px 0}

@media (max-width:768px){
    .ledger-shell{padding:20px 8px 60px}
    .ledger-tbl{font-size:12.5px}
    .ledger-tbl thead th,.ledger-tbl tbody td{padding:8px 8px}
}

/* ===== 컬럼 헤더 클릭형 필터 dropdown ===== */
.ledger-tbl thead th[data-col-key]{cursor:pointer;user-select:none;position:relative;transition:background 120ms}
.ledger-tbl thead th[data-col-key]:hover{background:#f4efe7 !important}
.ledger-tbl thead th[data-col-key].col-filtered{color:var(--ledger-accent) !important;background:rgba(200,54,44,.08) !important}
.ledger-tbl thead th[data-col-key] .col-arrow{display:inline-block;margin-left:4px;opacity:.45;font-size:9px;transform:translateY(-1px)}
.ledger-tbl thead th[data-col-key]:hover .col-arrow{opacity:1}
.ledger-tbl thead th[data-col-key].col-filtered .col-arrow{opacity:1;color:var(--ledger-accent)}

.filter-pop{position:fixed;z-index:200;background:#fff;border:1px solid var(--ledger-line-strong);border-radius:8px;box-shadow:0 12px 32px rgba(20,14,8,.18);width:240px;max-width:92vw;padding:10px 10px 8px;font-family:inherit}
.filter-pop-head{display:flex;align-items:center;justify-content:space-between;font-size:12.5px;font-weight:700;color:#0e0d0c;margin-bottom:8px;padding:0 2px}
.filter-pop-close{border:0;background:transparent;font-size:18px;cursor:pointer;color:#8a847e;padding:0 4px;line-height:1;font-family:inherit}
.filter-pop-close:hover{color:var(--ledger-accent)}
.filter-pop-search{width:100%;height:28px;padding:0 8px;border:1px solid var(--ledger-line);border-radius:5px;font-size:12px;font-family:inherit;outline:none;background:#fbf7ef;margin-bottom:4px}
.filter-pop-search:focus{border-color:#0e0d0c;background:#fff}
.filter-pop-toggle{display:flex;align-items:center;gap:6px;padding:5px 4px;font-size:12px;color:#4f4943;cursor:pointer;border-bottom:1px dashed var(--ledger-line);margin-bottom:4px}
.filter-pop-toggle input{width:14px;height:14px;accent-color:var(--ledger-accent);margin:0}
.filter-pop-list{max-height:220px;overflow-y:auto;margin:0 -4px}
.filter-pop-list label{display:flex;align-items:center;gap:6px;padding:4px 6px;font-size:12px;cursor:pointer;border-radius:4px;color:#2a2520;margin:0}
.filter-pop-list label:hover{background:#fbf7ef}
.filter-pop-list input[type=checkbox]{width:14px;height:14px;margin:0;accent-color:var(--ledger-accent)}
.filter-pop-list .count{margin-left:auto;color:#8a847e;font-size:11px;font-variant-numeric:tabular-nums}
.filter-pop-actions{display:flex;gap:6px;padding-top:8px;border-top:1px solid var(--ledger-line);margin-top:4px}
.filter-pop-actions button{flex:1}

/* 모달 row 변형 — 3분할 (단가/수수료 입력) */
.modal-row > .row-control.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;align-items:center}
.modal-row > .row-control.three .mini-label{font-size:11.5px;color:#8a847e;text-align:right;padding-right:4px}

/* ===== 그룹 accordion 카드 ===== */
.group-toolbar{display:flex;align-items:center;gap:8px;padding:14px 18px;background:#fff;border:1px solid var(--ledger-line);border-radius:12px;margin-bottom:16px}
.group-toolbar .label{font-size:12.5px;color:#8a847e;font-weight:600}
.group-toolbar .spacer{flex:1}

.accordion-card{background:#fff;border:1px solid var(--ledger-line-strong);border-radius:14px;margin-bottom:14px;overflow:hidden;box-shadow:0 2px 6px rgba(20,14,8,.04);transition:box-shadow 200ms,border-color 200ms}
.accordion-card.open{box-shadow:0 10px 28px rgba(20,14,8,.09);border-color:var(--ledger-accent-deep)}
.accordion-card.open .accordion-head{background:linear-gradient(180deg,var(--ledger-bg) 0%,#fff 100%);border-bottom:1px solid var(--ledger-line)}
.accordion-head{display:flex;align-items:center;gap:12px;padding:16px 20px;user-select:none;position:relative}
.accordion-head::before{content:'';width:4px;height:34px;border-radius:99px;background:var(--ledger-accent);flex-shrink:0;opacity:1}
.accordion-head h3{margin:0;font-size:18px;font-weight:700;letter-spacing:-.015em;color:#0e0d0c}
.accordion-head .star{font-size:11px;color:var(--ledger-accent);font-weight:700;letter-spacing:.05em;background:rgba(200,54,44,.08);padding:3px 8px;border-radius:99px}
.accordion-head .count-pill{margin-left:auto;padding:4px 11px;background:#fbf7ef;border:1px solid var(--ledger-line);border-radius:99px;font-size:11.5px;color:#4f4943;font-weight:600;font-variant-numeric:tabular-nums}
.accordion-head .head-actions{display:flex;gap:4px;opacity:1}
.accordion-head .head-actions button{border:1px solid transparent;background:transparent;padding:5px 10px;border-radius:6px;cursor:pointer;font-size:12px;color:#4f4943;font-family:inherit;font-weight:500}
.accordion-head .head-actions button:hover{background:#fbf7ef;color:#0e0d0c;border-color:var(--ledger-line)}
.accordion-head .head-actions button.danger{color:var(--ledger-accent)}
.accordion-head .head-actions button.danger:hover{background:#fff8f7;border-color:rgba(200,54,44,.3)}
.accordion-body{display:block}

</style>
</head>
<body>

<header id="app-header" class="app-header"></header>

<main class="ledger-shell">
    <div class="ledger-head">
        <div>
            <h1 class="ledger-title">조직도</h1>
            <p class="ledger-sub">팀 구성과 직급별 수수료를 관리합니다. 입력한 수수료는 계약자 관리대장의 정산에 자동 반영됩니다.</p>
        </div>
    </div>

    <div class="group-toolbar">
        <span class="label">현장</span>
        <span class="spacer"></span>
        <button class="tiny-btn" id="exportAllBtn" type="button" title="모든 그룹을 시트별로 합쳐 .xlsx 로 다운로드">📥 전체 엑셀 다운로드</button>
        <button class="tiny-btn primary" id="newGroupBtn" type="button">+ 새 현장 추가</button>
    </div>

    <div class="bulk-bar" id="bulkBar">
        <div class="info"><b id="bulkCount">0</b>개 선택됨</div>
        <div style="display:flex;gap:8px;">
            <button class="tiny-btn" id="bulkClearBtn" type="button">선택 해제</button>
            <button class="tiny-btn danger" id="bulkDeleteBtn" type="button">선택 삭제</button>
        </div>
    </div>

    <div id="content"></div>

    <div class="notice-foot">
        ※ 여기에서 입력한 직급별·타입별 수수료는 <b>계약자 관리대장</b>에서 지급수수료 자동계산에 활용됩니다.
    </div>
</main>

<!-- 그룹 생성/편집 모달 -->
<div class="modal-backdrop hidden" id="groupModal">
    <div class="modal-panel narrow">
        <header class="modal-header">
            <div>
                <h2 id="groupModalTitle">새 현장 만들기</h2>
                <p class="modal-subtitle">조직도를 분리해서 관리할 단위입니다 (예: 본사, 지점명, 사업부).</p>
            </div>
        </header>
        <div class="modal-body">
            <div class="modal-row">
                <label class="row-label" for="groupNameInput">현장 이름</label>
                <div class="row-control">
                    <input type="text" id="groupNameInput" placeholder="예: 본사, 강남점, 1팀그룹...">
                </div>
            </div>
            <div class="modal-row">
                <label class="row-label" for="groupIsDefaultInput">기본 현장</label>
                <div class="row-control inline">
                    <input type="checkbox" id="groupIsDefaultInput" style="width:16px;height:16px;margin:0;">
                    <label for="groupIsDefaultInput" style="margin:0;cursor:pointer;font-size:13px;color:var(--fg-secondary);">접속 시 이 현장이 자동으로 열립니다</label>
                </div>
            </div>
            <p class="form-help error" id="groupErrorMsg" style="margin-top:8px;"></p>
        </div>
        <footer class="modal-footer">
            <button class="tiny-btn danger modal-footer-spacer" id="groupDeleteBtn" type="button" style="display:none;">현장 삭제</button>
            <button class="tiny-btn" id="groupCancelBtn" type="button">취소</button>
            <button class="tiny-btn primary" id="groupSaveBtn" type="button">저장</button>
        </footer>
    </div>
</div>

<!-- 설정 모달 -->
<div class="modal-backdrop hidden" id="settingsModal">
    <div class="modal-panel wide">
        <header class="modal-header">
            <div>
                <h2>조직도 설정</h2>
                <p class="modal-subtitle">현재 현장 (<b id="settingsGroupName">-</b>) 의 팀 구성과 수수료 기준을 설정합니다.</p>
            </div>
        </header>
        <div class="modal-body">
            <div class="modal-row" id="activeTeamsRow">
                <label class="row-label">활성 팀</label>
                <div class="row-control inline checkboxes" id="activeTeamsBox">
                    <label><input type="checkbox" value="1" data-team>1팀</label>
                    <label><input type="checkbox" value="2" data-team>2팀</label>
                    <label><input type="checkbox" value="3" data-team>3팀</label>
                    <label><input type="checkbox" value="4" data-team>4팀</label>
                    <label><input type="checkbox" value="5" data-team>5팀</label>
                </div>
            </div>

            <div class="modal-row">
                <label class="row-label">기본 수수료</label>
                <div class="row-control">
                    <div class="comm-grid" id="defaultCommGrid">
                        <div class="comm-cell" data-role-cell="head">
                            <label class="comm-label" for="commHQ">본부장</label>
                            <input type="text" inputmode="numeric" data-thousand id="commHQ" placeholder="0">
                        </div>
                        <div class="comm-cell">
                            <label class="comm-label" for="commTL">팀장</label>
                            <input type="text" inputmode="numeric" data-thousand id="commTL" placeholder="0">
                        </div>
                        <div class="comm-cell">
                            <label class="comm-label" for="commTM">팀원</label>
                            <input type="text" inputmode="numeric" data-thousand id="commTM" placeholder="0">
                        </div>
                    </div>
                </div>
            </div>

            <div class="modal-row align-start">
                <label class="row-label">타입별 수수료</label>
                <div class="row-control">
                    <span class="row-help">특정 평형/타입에 별도 수수료를 적용할 때만 추가. 미설정 타입은 기본 수수료를 사용합니다.</span>
                    <div class="type-comm-list" id="typeCommList"></div>
                    <button class="tiny-btn" id="addTypeCommBtn" type="button" style="font-size:12px;padding:6px 12px;align-self:flex-start;">+ 타입 추가</button>
                </div>
            </div>

            <div class="modal-row align-start">
                <label class="row-label">필드 관리</label>
                <div class="row-control" id="fieldManagerBox"></div>
            </div>

            <p class="form-help error" id="settingsErrorMsg" style="margin-top:8px;"></p>
        </div>
        <footer class="modal-footer">
            <button class="tiny-btn danger modal-footer-spacer" id="settingsDeleteBtn" type="button">현장 삭제</button>
            <button class="tiny-btn" id="settingsCancelBtn" type="button">취소</button>
            <button class="tiny-btn primary" id="settingsSaveBtn" type="button">저장</button>
        </footer>
    </div>
</div>

<script type="module" src="org.js?v=20260512-dropdown-center"></script>
<script type="module">
    import { bootApp } from './auth-shared.js?v=20260512-dropdown-center';
    bootApp();
</script>
</body>
</html>
