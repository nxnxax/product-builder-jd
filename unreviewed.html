<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>미확인 요약 · YOUNGMAN</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" href="logo_main.png">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="style.css?v=20260523-unreviewed-v4">
<style>
:root{
    --ledger-line:rgba(20,14,8,.09); --ledger-line-strong:rgba(20,14,8,.16);
    --ledger-bg:#fbf7ef; --ledger-accent:#c8362c; --ledger-accent-deep:#8a2620;
    --done-bg:#0e6b2a; --done-bg-hover:#0a5621;
}
.un-shell{max-width:920px;margin:0 auto;padding:24px 18px 160px}
.un-head{margin-bottom:14px}
.un-title{margin:0;font-size:24px;letter-spacing:-.02em;font-weight:700}
.un-sub{margin:6px 0 0;color:#8a847e;font-size:14px;line-height:1.55}

/* 전체선택 헤더 + 일괄 동작 버튼 (인라인) */
.un-select-all{display:flex;align-items:center;gap:8px;padding:10px 12px;background:#fbf7ef;border-radius:10px;margin-bottom:10px;font-size:14px;color:#3a3530;font-weight:600;flex-wrap:wrap}
.un-select-all label{display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none}
.un-select-all-count{color:#8a847e;font-weight:500;font-size:13px}
.un-select-all-actions{margin-left:auto;display:flex;gap:6px}
.un-bulk-btn{padding:7px 12px;border:1px solid var(--ledger-line-strong);background:#fff;color:#0e0d0c;font-size:13px;font-weight:600;border-radius:8px;cursor:pointer;font-family:inherit;white-space:nowrap;transition:all 160ms}
.un-bulk-btn:hover:not(:disabled){background:#fff5e6}
.un-bulk-btn.primary{background:#0e0d0c;color:#fff;border-color:#0e0d0c}
.un-bulk-btn.primary:hover:not(:disabled){background:#2a2520}
.un-bulk-btn.danger{background:#fff;color:#c8362c;border-color:#e8b8b3}
.un-bulk-btn.danger:hover:not(:disabled){background:#fef2f1;border-color:#c8362c}
.un-bulk-btn:disabled{opacity:.4;cursor:not-allowed}

.un-list{display:flex;flex-direction:column;gap:10px}

/* 날짜 구분선 */
.un-date-sep{display:flex;align-items:center;gap:12px;padding:14px 4px 4px;color:#8a847e;font-size:13px;font-weight:600;letter-spacing:.02em}
.un-date-sep::before,.un-date-sep::after{content:'';flex:1;height:1px;background:var(--ledger-line)}
.un-date-sep:first-child{padding-top:0}

/* 카드 — 좌측 체크박스 + 정보 / 우측 버튼 stack */
.un-card{background:#fff;border:1px solid var(--ledger-line);border-radius:14px;padding:14px 14px;display:flex;gap:10px;align-items:stretch;transition:border-color 160ms,background 160ms}
.un-card:hover{border-color:var(--ledger-line-strong)}
.un-card.selected{border-color:var(--ledger-accent);background:#fef7f6}

.un-check{flex-shrink:0;display:flex;align-items:center;padding:0 2px}
.un-check input{width:20px;height:20px;cursor:pointer;accent-color:var(--ledger-accent)}

.un-card-info{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:4px}
.un-card-name{font-size:17px;font-weight:700;color:#0e0d0c;letter-spacing:-.01em;line-height:1.25}
.un-card-contact{font-size:15px;color:#3a3530;font-weight:600;line-height:1.4}
.un-card-duration{font-size:14px;color:#6a6359;line-height:1.4}
.un-card-date{font-size:13px;color:#8a847e;line-height:1.3}

.un-card-actions{display:flex;flex-direction:column;gap:6px;flex-shrink:0;justify-content:center;min-width:124px}
.un-btn-card{padding:9px 14px;border:1px solid var(--ledger-line-strong);background:#fff;color:#0e0d0c;font-size:13.5px;font-weight:600;border-radius:10px;cursor:pointer;font-family:inherit;transition:all 160ms;white-space:nowrap;text-align:center;display:flex;align-items:center;justify-content:center;gap:6px;min-height:36px}
.un-btn-card:hover:not(:disabled){background:#fbf7ef}
.un-btn-card:active:not(:disabled){background:#f4efe7}
.un-btn-card.primary{background:#0e0d0c;color:#fff;border-color:#0e0d0c}
.un-btn-card.primary:hover:not(:disabled){background:#2a2520}
.un-btn-card.done{background:var(--done-bg);color:#fff;border-color:var(--done-bg)}
.un-btn-card.done:hover:not(:disabled){background:var(--done-bg-hover)}
/* 사장님 2026-05-24 — 요약완료 버튼 2줄 표시. 다른 한 줄 버튼과 동일 height 유지 (min-height 36px). */
.un-btn-card.done-multi{flex-direction:column;gap:1px;padding:4px 12px;line-height:1.15}
.un-btn-card.done-multi .bl1{font-size:12.5px;font-weight:700;letter-spacing:-.01em}
.un-btn-card.done-multi .bl2{font-size:11px;font-weight:500;opacity:.92;letter-spacing:-.02em}
.un-btn-card.danger{background:#fff;color:#c8362c;border-color:#e8b8b3}
.un-btn-card.danger:hover:not(:disabled){background:#fef2f1;border-color:#c8362c}
.un-btn-card:disabled{opacity:.7;cursor:not-allowed}
.un-btn-card.loading{background:#f5f3ee;color:#8a847e;border-color:var(--ledger-line)}

.un-mini-spinner{display:inline-block;width:12px;height:12px;border:2px solid #c8c4bd;border-top-color:#3a3530;border-radius:50%;animation:un-spin 1s linear infinite;flex-shrink:0}
@keyframes un-spin{to{transform:rotate(360deg)}}

.un-empty{text-align:center;padding:80px 24px;color:#8a847e;font-size:15px;line-height:1.7}
.un-empty .icon{font-size:42px;display:block;margin-bottom:14px}
.un-loading{text-align:center;padding:48px 24px;color:#8a847e;font-size:13.5px}

/* 결과 모달 */
.un-modal-backdrop{position:fixed;inset:0;background:rgba(14,13,12,.55);display:none;align-items:center;justify-content:center;z-index:1000;padding:20px}
.un-modal-backdrop.show{display:flex}
.un-modal{background:#fff;border-radius:18px;max-width:520px;width:100%;max-height:90vh;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 24px 60px rgba(20,14,8,.32)}
.un-modal-head{padding:18px 20px 12px;border-bottom:1px solid var(--ledger-line)}
.un-modal-title{margin:0;font-size:19px;font-weight:700;letter-spacing:-.01em}
.un-modal-subtitle{margin:4px 0 0;color:#8a847e;font-size:13.5px}
.un-modal-body{padding:18px 20px;overflow-y:auto;flex:1}
.un-modal-row{margin-bottom:14px}
.un-modal-row:last-child{margin-bottom:0}
.un-modal-label{font-size:12px;font-weight:600;color:#8a847e;letter-spacing:.04em;text-transform:uppercase;margin-bottom:4px}
.un-modal-val{font-size:15px;line-height:1.6;color:#0e0d0c;white-space:pre-wrap;word-break:keep-all}
.un-modal-foot{padding:14px 20px;border-top:1px solid var(--ledger-line);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.un-btn{padding:10px 18px;border:1px solid var(--ledger-line-strong);background:#fff;color:#4f4943;font-size:14.5px;border-radius:10px;cursor:pointer;font-family:inherit;font-weight:500;transition:all 160ms}
.un-btn:hover{background:#fbf7ef;color:#0e0d0c}
.un-btn.primary{background:#0e0d0c;color:#fff;border-color:#0e0d0c}
.un-btn.primary:hover{background:#2a2520}
.un-btn.danger{background:#fff;color:#c8362c;border-color:#e8b8b3}
.un-btn.danger:hover{background:#fef2f1;border-color:#c8362c}
.un-btn:disabled{opacity:.5;cursor:not-allowed}

@media (max-width:520px){
    .un-shell{padding:20px 12px 160px}
    .un-card{padding:12px 10px;gap:8px}
    .un-card-name{font-size:16.5px}
    .un-card-contact{font-size:14.5px}
    .un-card-duration{font-size:13.5px}
    .un-card-actions{min-width:106px}
    .un-btn-card{padding:8px 10px;font-size:12.5px}
    .un-modal{max-height:85vh;border-radius:14px}
    .un-bulk-btn{padding:6px 10px;font-size:12.5px}
    .un-select-all{padding:9px 10px;font-size:13.5px}
    .un-select-all-count{font-size:12.5px}
}
</style>
</head>
<body>
<header id="app-header" class="app-header"></header>

<div class="un-shell">
<header class="un-head">
    <h1 class="un-title">미확인 요약</h1>
    <p class="un-sub">검토 대기 중인 통화입니다. 카드를 선택해서 한 번에 폐기/전송할 수 있습니다.</p>
</header>

<div class="un-select-all" id="unSelectAllBar" style="display:none">
    <label><input type="checkbox" id="unSelectAll"> 전체 선택</label>
    <span class="un-select-all-count" id="unSelectAllCount"></span>
    <div class="un-select-all-actions">
        <button class="un-bulk-btn danger" type="button" id="unBulkDiscard" disabled>선택 삭제</button>
        <button class="un-bulk-btn primary" type="button" id="unBulkSend" disabled>양식으로 전송</button>
    </div>
</div>

<div id="unreviewedList" class="un-list"><div class="un-loading">불러오는 중...</div></div>
</div>

<!-- 결과 모달 -->
<div class="un-modal-backdrop" id="unModal">
    <div class="un-modal">
        <header class="un-modal-head">
            <h2 class="un-modal-title" id="unModalTitle">요약</h2>
            <p class="un-modal-subtitle" id="unModalSubtitle"></p>
        </header>
        <div class="un-modal-body" id="unModalBody"></div>
        <footer class="un-modal-foot" id="unModalFoot"></footer>
    </div>
</div>

<script type="module">
    import { bootApp, apiRequest } from './auth-shared.js?v=20260523-unreviewed-v4';
    await bootApp();

    const list = document.getElementById('unreviewedList');
    const selectAllBar = document.getElementById('unSelectAllBar');
    const selectAllCb = document.getElementById('unSelectAll');
    const selectAllCount = document.getElementById('unSelectAllCount');
    const bulkDiscardBtn = document.getElementById('unBulkDiscard');
    const bulkSendBtn = document.getElementById('unBulkSend');

    const modal = document.getElementById('unModal');
    const modalTitle = document.getElementById('unModalTitle');
    const modalSubtitle = document.getElementById('unModalSubtitle');
    const modalBody = document.getElementById('unModalBody');
    const modalFoot = document.getElementById('unModalFoot');

    let currentJobId = null;
    let pollTimer = null;
    let needsPolling = false;
    const selectedSet = new Set();   // 선택한 job_id (페이지 reload 시에도 유지)
    let allJobIds = [];

    function escapeHtml(s) {
        return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }
    function fmtTime(s) {
        if (!s) return '';
        try {
            const d = new Date(String(s).replace(' ', 'T'));
            if (isNaN(d)) return s;
            const yy = String(d.getFullYear()).slice(2);
            const mm = String(d.getMonth() + 1).padStart(2, '0');
            const dd = String(d.getDate()).padStart(2, '0');
            const hh = d.getHours();
            const mi = String(d.getMinutes()).padStart(2, '0');
            const ampm = hh < 12 ? '오전' : '오후';
            const h12 = ((hh + 11) % 12) + 1;
            return `${yy}.${mm}.${dd} ${ampm} ${String(h12).padStart(2,'0')}:${mi}`;
        } catch { return s; }
    }
    function dateKey(s) {
        if (!s) return '';
        try {
            const d = new Date(String(s).replace(' ', 'T'));
            if (isNaN(d)) return '';
            return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
        } catch { return ''; }
    }
    function dateLabel(s) {
        if (!s) return '';
        try {
            const d = new Date(String(s).replace(' ', 'T'));
            if (isNaN(d)) return s;
            const today = new Date();
            const yest = new Date(); yest.setDate(yest.getDate() - 1);
            const isSameDay = (a, b) => a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate();
            if (isSameDay(d, today)) return '오늘';
            if (isSameDay(d, yest))  return '어제';
            const mm = d.getMonth() + 1;
            const dd = d.getDate();
            const wdNames = ['일','월','화','수','목','금','토'];
            return `${mm}월 ${dd}일 (${wdNames[d.getDay()]})`;
        } catch { return s; }
    }
    function fmtDuration(sec) {
        sec = parseInt(sec, 10) || 0;
        if (sec < 60) return sec + '초';
        const m = Math.floor(sec / 60);
        const s = sec % 60;
        return s ? `${m}분 ${s}초` : `${m}분`;
    }

    function renderButtons(j) {
        const status = j.job_status || j.status || 'audio_pending';
        const autoCf = !!j.auto_confirm;
        const id = escapeHtml(j.id);
        if (status === 'audio_pending') {
            return `
                <button class="un-btn-card" type="button" data-act="trigger-preview" data-job-id="${id}">요약보기</button>
                <button class="un-btn-card primary" type="button" data-act="trigger-auto" data-job-id="${id}">양식으로 전송</button>
            `;
        }
        if (status === 'ready_to_review') {
            return `
                <button class="un-btn-card done done-multi" type="button" data-act="open-result" data-job-id="${id}"><span class="bl1">✓ 요약완료</span><span class="bl2">내용확인하기</span></button>
                <button class="un-btn-card primary" type="button" data-act="confirm-direct" data-job-id="${id}">고객관리대장 전송</button>
            `;
        }
        if (status === 'queued' || status === 'processing') {
            if (autoCf) {
                return `
                    <button class="un-btn-card" type="button" disabled>요약보기</button>
                    <button class="un-btn-card loading" type="button" disabled><span class="un-mini-spinner"></span>전송 중...</button>
                `;
            }
            return `
                <button class="un-btn-card loading" type="button" disabled><span class="un-mini-spinner"></span>요약중...</button>
                <button class="un-btn-card primary" type="button" data-act="trigger-auto" data-job-id="${id}">양식으로 전송</button>
            `;
        }
        if (status === 'failed_retryable') {
            return `
                <button class="un-btn-card" type="button" data-act="trigger-preview" data-job-id="${id}">재시도</button>
                <button class="un-btn-card danger" type="button" data-act="discard" data-job-id="${id}">폐기</button>
            `;
        }
        if (status === 'failed_permanent') {
            return `
                <button class="un-btn-card danger" type="button" data-act="discard" data-job-id="${id}">폐기</button>
            `;
        }
        return `<button class="un-btn-card" type="button" disabled>${escapeHtml(status)}</button>`;
    }

    function updateBulkBar() {
        const n = selectedSet.size;
        // 사장님 spec: 1개 이상 선택 시 인라인 버튼 활성화
        const hasSel = n >= 1;
        bulkDiscardBtn.disabled = !hasSel;
        bulkSendBtn.disabled = !hasSel;
        // 전체선택 체크박스 상태
        if (allJobIds.length > 0) {
            const allSelected = allJobIds.every(id => selectedSet.has(id));
            selectAllCb.checked = allSelected;
            selectAllCb.indeterminate = !allSelected && n > 0;
        } else {
            selectAllCb.checked = false;
            selectAllCb.indeterminate = false;
        }
        selectAllCount.textContent = n > 0 ? `(${n}/${allJobIds.length} 선택)` : '';
    }

    async function load() {
        try {
            const r = await apiRequest('customer-log', { query: 'action=list_unreviewed' });
            const items = r?.items || [];
            try { window.YoungmanBridge?.setUnreviewedCount?.(items.length); } catch {}
            try { localStorage.setItem('yman_unreviewed_count', String(items.length)); } catch {}

            allJobIds = items.map(j => String(j.id));
            // 사라진 항목은 selectedSet 에서 제거
            for (const id of [...selectedSet]) {
                if (!allJobIds.includes(id)) selectedSet.delete(id);
            }

            needsPolling = items.some(j => {
                const s = j.job_status || j.status || '';
                return s === 'queued' || s === 'processing';
            });

            if (items.length === 0) {
                selectAllBar.style.display = 'none';
                list.innerHTML = '<div class="un-empty"><span class="icon">📭</span>미확인 요약이 없습니다.<br>새 통화가 도착하면 여기에 표시됩니다.</div>';
                updateBulkBar();
                schedulePolling();
                return;
            }
            selectAllBar.style.display = 'flex';

            let lastDateKey = '';
            const parts = [];
            for (const j of items) {
                const ts = j.recorded_at || '';
                const dk = dateKey(ts);
                if (dk && dk !== lastDateKey) {
                    parts.push(`<div class="un-date-sep">${escapeHtml(dateLabel(ts))}</div>`);
                    lastDateKey = dk;
                }
                const id = String(j.id);
                const isSel = selectedSet.has(id);
                // 사장님 2026-05-24 — 전화번호 / 통화시간 줄바꿈 분리.
                const phoneLine = j.phone_number ? escapeHtml(j.phone_number) : '';
                const durationLine = j.duration_sec ? '통화 ' + fmtDuration(j.duration_sec) : '';
                parts.push(`
                    <div class="un-card${isSel ? ' selected' : ''}" data-job-id="${escapeHtml(id)}">
                        <div class="un-check">
                            <input type="checkbox" data-cb-job-id="${escapeHtml(id)}"${isSel ? ' checked' : ''}>
                        </div>
                        <div class="un-card-info">
                            <div class="un-card-name">${escapeHtml(j.customer_name || '고객')}</div>
                            ${phoneLine ? `<div class="un-card-contact">${phoneLine}</div>` : ''}
                            ${durationLine ? `<div class="un-card-duration">${durationLine}</div>` : ''}
                            <div class="un-card-date">${escapeHtml(fmtTime(j.recorded_at))}</div>
                        </div>
                        <div class="un-card-actions">
                            ${renderButtons(j)}
                        </div>
                    </div>
                `);
            }
            list.innerHTML = parts.join('');

            bindCardActions();
            bindCheckboxes();
            updateBulkBar();
            schedulePolling();
        } catch (e) {
            list.innerHTML = `<div class="un-empty">불러오기 실패<br><small>${escapeHtml(e?.message || e)}</small></div>`;
        }
    }

    function bindCardActions() {
        list.querySelectorAll('[data-act]').forEach(btn => {
            btn.addEventListener('click', async (ev) => {
                ev.stopPropagation();
                const act = btn.dataset.act;
                const jobId = btn.dataset.jobId;
                if (act === 'trigger-preview')  return doTriggerPreview(jobId, btn);
                if (act === 'trigger-auto')     return doTriggerAuto(jobId, btn);
                if (act === 'open-result')      return openResult(jobId);
                if (act === 'confirm-direct')   return doConfirmDirect(jobId, btn);
                if (act === 'discard')          return doDiscardCard(jobId, btn);
            });
        });
    }

    function bindCheckboxes() {
        list.querySelectorAll('[data-cb-job-id]').forEach(cb => {
            cb.addEventListener('change', (ev) => {
                ev.stopPropagation();
                const id = cb.dataset.cbJobId;
                const card = cb.closest('.un-card');
                if (cb.checked) { selectedSet.add(id); card?.classList.add('selected'); }
                else { selectedSet.delete(id); card?.classList.remove('selected'); }
                updateBulkBar();
            });
        });
    }

    selectAllCb.addEventListener('change', () => {
        if (selectAllCb.checked) {
            allJobIds.forEach(id => selectedSet.add(id));
        } else {
            selectedSet.clear();
        }
        // 모든 체크박스 동기화 + 카드 highlight
        list.querySelectorAll('[data-cb-job-id]').forEach(cb => {
            const id = cb.dataset.cbJobId;
            cb.checked = selectedSet.has(id);
            cb.closest('.un-card')?.classList.toggle('selected', cb.checked);
        });
        updateBulkBar();
    });

    function schedulePolling() {
        if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
        if (!needsPolling) return;
        pollTimer = setInterval(() => { load(); }, 5000);
    }

    async function doTriggerPreview(jobId, btn) {
        btn.disabled = true;
        btn.innerHTML = '<span class="un-mini-spinner"></span>요약중...';
        try {
            // 사장님 2026-06-01 — 사용자 클릭 시점 사용량 차감 신호 (멱등). 실패해도 trigger 진행.
            apiRequest('customer-log', {
                method: 'POST',
                body: JSON.stringify({ action: 'mark_usage', job_id: jobId, click_type: 'summary_view' })
            }).catch(() => {});
            const r = await apiRequest('customer-log', {
                method: 'POST',
                body: JSON.stringify({ action: 'trigger_summarize', job_id: jobId, auto_confirm: false })
            });
            if (r?.dispatched === false && r?.dispatch_error) {
                showToast('AI 분석 시작 대기 — cron 5분 내 자동 진행 (' + r.dispatch_error + ')');
            }
            await load();
        } catch (e) {
            alert('요약 시작 실패: ' + (e?.message || e));
            btn.disabled = false;
            btn.textContent = '요약보기';
        }
    }

    async function doTriggerAuto(jobId, btn) {
        btn.disabled = true;
        btn.innerHTML = '<span class="un-mini-spinner"></span>전송 중...';
        try {
            // 사장님 2026-06-01 — 사용자 클릭 시점 사용량 차감 신호 (멱등). 실패해도 trigger 진행.
            apiRequest('customer-log', {
                method: 'POST',
                body: JSON.stringify({ action: 'mark_usage', job_id: jobId, click_type: 'auto_confirm' })
            }).catch(() => {});
            const r = await apiRequest('customer-log', {
                method: 'POST',
                body: JSON.stringify({ action: 'trigger_summarize', job_id: jobId, auto_confirm: true })
            });
            if (r?.dispatched === false && r?.dispatch_error) {
                showToast('전송 대기 — cron 5분 내 자동 진행 (' + r.dispatch_error + ')');
            } else {
                showToast('AI 분석 후 고객관리대장에 자동 저장됩니다.');
            }
            await load();
        } catch (e) {
            alert('전송 시작 실패: ' + (e?.message || e));
            btn.disabled = false;
            btn.textContent = '양식으로 전송';
        }
    }

    async function openResult(jobId) {
        currentJobId = jobId;
        modalTitle.textContent = '불러오는 중...';
        modalSubtitle.textContent = '';
        modalBody.innerHTML = '<div class="un-loading">불러오는 중...</div>';
        modalFoot.innerHTML = '';
        modal.classList.add('show');
        try {
            const r = await apiRequest('customer-log', { query: 'action=preview&job_id=' + encodeURIComponent(jobId) });
            const s = r?.summary || {};
            modalTitle.textContent = s.customer_name || '고객';
            const subParts = [];
            if (r.recorded_at) subParts.push(fmtTime(r.recorded_at));
            if (r.duration_sec) subParts.push(fmtDuration(r.duration_sec));
            modalSubtitle.textContent = subParts.join(' · ');
            const rows = [
                { label: '요약', value: s.summary },
                { label: '관심사', value: s.interest },
                { label: '문의', value: s.inquiry },
                { label: '예산/조건', value: s.budget_condition },
                { label: 'AI 추천', value: s.next_action },
                { label: '연락처', value: s.phone_number || r.phone_number },
            ].filter(row => row.value);
            modalBody.innerHTML = rows.length
                ? rows.map(row => `
                    <div class="un-modal-row">
                        <div class="un-modal-label">${escapeHtml(row.label)}</div>
                        <div class="un-modal-val">${escapeHtml(row.value)}</div>
                    </div>`).join('')
                : '<div class="un-loading">요약 정보가 없습니다.</div>';
            modalFoot.innerHTML = `
                <button class="un-btn danger" type="button" data-act="discard">요약 폐기</button>
                <button class="un-btn primary" type="button" data-act="confirm">고객관리대장 전송</button>
            `;
            bindModalFoot();
        } catch (e) {
            modalTitle.textContent = '불러오기 실패';
            modalBody.innerHTML = `<div class="un-empty"><small>${escapeHtml(e?.message || e)}</small></div>`;
            modalFoot.innerHTML = '<button class="un-btn" type="button" data-act="close">닫기</button>';
            bindModalFoot();
        }
    }

    function bindModalFoot() {
        modalFoot.querySelectorAll('[data-act]').forEach(btn => {
            btn.addEventListener('click', async () => {
                const act = btn.dataset.act;
                if (act === 'close')    return closeModal();
                if (act === 'discard')  return doDiscardModal(btn);
                if (act === 'confirm')  return doConfirmModal(btn);
            });
        });
    }

    function closeModal() {
        modal.classList.remove('show');
        currentJobId = null;
    }

    /* 사장님 2026-05-23 — confirm/discard 성공 시 카드 즉시 DOM 제거 (낙관적 UI).
     * polling 5초 대기 없이 즉각 사라짐. load() 는 정합성 재확인. */
    function removeCardFromDom(jobId) {
        const card = list.querySelector(`.un-card[data-job-id="${jobId.replace(/"/g,'\\"')}"]`);
        if (card) card.remove();
        selectedSet.delete(String(jobId));
        // job id 목록에서도 제거
        allJobIds = allJobIds.filter(id => id !== String(jobId));
        // 빈 상태 처리
        if (list.querySelectorAll('.un-card').length === 0) {
            selectAllBar.style.display = 'none';
            list.innerHTML = '<div class="un-empty"><span class="icon">📭</span>미확인 요약이 없습니다.<br>새 통화가 도착하면 여기에 표시됩니다.</div>';
        }
        // bridge badge / localStorage 동기화
        const remaining = list.querySelectorAll('.un-card').length;
        try { window.YoungmanBridge?.setUnreviewedCount?.(remaining); } catch {}
        try { localStorage.setItem('yman_unreviewed_count', String(remaining)); } catch {}
        updateBulkBar();
    }

    async function doDiscardModal(btn) {
        if (!currentJobId) return;
        if (!confirm('이 통화 요약을 폐기하시겠습니까?')) return;
        const jobId = currentJobId;
        modalFoot.querySelectorAll('button').forEach(b => b.disabled = true);
        btn.textContent = '폐기 중...';
        try {
            await apiRequest('customer-log', { method: 'POST', body: JSON.stringify({ action: 'discard', job_id: jobId }) });
            closeModal();
            removeCardFromDom(jobId);
            showToast('폐기 완료.');
            load();   // 정합성 재확인 (백그라운드)
        } catch (e) {
            alert('폐기 실패: ' + (e?.message || e));
            modalFoot.querySelectorAll('button').forEach(b => b.disabled = false);
        }
    }

    async function doConfirmModal(btn) {
        if (!currentJobId) return;
        const jobId = currentJobId;
        modalFoot.querySelectorAll('button').forEach(b => b.disabled = true);
        btn.textContent = '전송 중...';
        try {
            await apiRequest('customer-log', { method: 'POST', body: JSON.stringify({ action: 'confirm', job_id: jobId }) });
            closeModal();
            removeCardFromDom(jobId);
            showToast('고객관리대장에 저장 완료.');
            load();
        } catch (e) {
            alert('고객관리대장 전송 실패: ' + (e?.message || e));
            modalFoot.querySelectorAll('button').forEach(b => b.disabled = false);
        }
    }

    async function doConfirmDirect(jobId, btn) {
        btn.disabled = true;
        btn.innerHTML = '<span class="un-mini-spinner"></span>전송 중...';
        try {
            await apiRequest('customer-log', { method: 'POST', body: JSON.stringify({ action: 'confirm', job_id: jobId }) });
            removeCardFromDom(jobId);
            showToast('고객관리대장에 저장 완료.');
            load();
        } catch (e) {
            alert('고객관리대장 전송 실패: ' + (e?.message || e));
            btn.disabled = false;
            btn.textContent = '고객관리대장 전송';
        }
    }

    async function doDiscardCard(jobId, btn) {
        if (!confirm('이 통화를 폐기하시겠습니까?')) return;
        btn.disabled = true;
        btn.textContent = '폐기 중...';
        try {
            await apiRequest('customer-log', { method: 'POST', body: JSON.stringify({ action: 'discard', job_id: jobId }) });
            removeCardFromDom(jobId);
            showToast('폐기 완료.');
            load();
        } catch (e) {
            alert('폐기 실패: ' + (e?.message || e));
            btn.disabled = false;
            btn.textContent = '폐기';
        }
    }

    /* ========== Bulk actions ========== */
    bulkDiscardBtn.addEventListener('click', async () => {
        const ids = [...selectedSet];
        if (ids.length === 0) return;
        if (!confirm(`선택한 ${ids.length}개 통화를 모두 폐기하시겠습니까?`)) return;
        bulkDiscardBtn.disabled = true; bulkSendBtn.disabled = true;
        bulkDiscardBtn.textContent = '폐기 중...';
        const errs = [];
        for (const id of ids) {
            try {
                await apiRequest('customer-log', { method: 'POST', body: JSON.stringify({ action: 'discard', job_id: id }) });
                removeCardFromDom(id);   // 사장님 2026-05-23 — 즉시 카드 제거
            } catch (e) {
                errs.push({ id, msg: e?.message || String(e) });
            }
        }
        bulkDiscardBtn.disabled = false; bulkSendBtn.disabled = false;
        bulkDiscardBtn.textContent = '선택 삭제';
        if (errs.length) {
            alert(`${ids.length - errs.length}개 폐기 완료. 실패 ${errs.length}건:\n` + errs.slice(0, 3).map(e => e.msg).join('\n'));
        } else {
            showToast(`${ids.length}개 폐기 완료.`);
        }
        load();
    });

    bulkSendBtn.addEventListener('click', async () => {
        const ids = [...selectedSet];
        if (ids.length === 0) return;
        if (!confirm(`선택한 ${ids.length}개를 순차로 양식으로 전송하시겠습니까? AI 분석 후 자동으로 고객관리대장에 저장됩니다.`)) return;
        bulkDiscardBtn.disabled = true; bulkSendBtn.disabled = true;
        bulkSendBtn.textContent = '전송 중...';
        const errs = [];
        let sent = 0;
        for (const id of ids) {
            try {
                // 사장님 2026-06-01 — 사용자 클릭 시점 사용량 차감 신호 (멱등).
                apiRequest('customer-log', {
                    method: 'POST',
                    body: JSON.stringify({ action: 'mark_usage', job_id: id, click_type: 'auto_confirm' })
                }).catch(() => {});
                await apiRequest('customer-log', {
                    method: 'POST',
                    body: JSON.stringify({ action: 'trigger_summarize', job_id: id, auto_confirm: true })
                });
                sent++;
                selectedSet.delete(id);
            } catch (e) {
                errs.push({ id, msg: e?.message || String(e) });
            }
        }
        bulkDiscardBtn.disabled = false; bulkSendBtn.disabled = false;
        bulkSendBtn.textContent = '선택 양식으로 전송';
        if (errs.length) {
            alert(`${sent}개 전송 시작. 실패 ${errs.length}건:\n` + errs.slice(0, 3).map(e => e.msg).join('\n'));
        } else {
            showToast(`${sent}개 양식으로 전송 시작. AI 분석 후 자동 저장.`);
        }
        await load();
    });

    function showToast(msg) {
        let t = document.getElementById('un-toast');
        if (!t) {
            t = document.createElement('div');
            t.id = 'un-toast';
            t.style.cssText = 'position:fixed;left:50%;bottom:150px;transform:translateX(-50%);background:rgba(14,13,12,.92);color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;max-width:360px;text-align:center;z-index:2000;line-height:1.5;box-shadow:0 8px 24px rgba(14,13,12,.32);opacity:0;transition:opacity 200ms';
            document.body.appendChild(t);
        }
        t.textContent = msg;
        requestAnimationFrame(() => { t.style.opacity = '1'; });
        clearTimeout(t._timer);
        t._timer = setTimeout(() => { t.style.opacity = '0'; }, 3500);
    }

    modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && modal.classList.contains('show')) closeModal(); });

    load();
</script>
</body>
</html>
