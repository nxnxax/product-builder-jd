<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>로그인 처리 중… · YOUNGMAN</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" type="image/png" href="logo_main.png">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
    html, body { margin:0; padding:0; background:#fbf8f3; font-family:'Pretendard',-apple-system,system-ui,sans-serif; color:#0e0d0c }
    .wrap { width:100%; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:20px; padding:24px; text-align:center; box-sizing:border-box }
    img { height:38px; opacity:.85 }
    .ring { width:38px; height:38px; border:3px solid rgba(200,54,44,.18); border-top-color:#c8362c; border-radius:50%; animation:spin .9s linear infinite }
    @keyframes spin { to { transform:rotate(360deg) } }
    p { margin:0; color:#4f4943; font-size:14px; letter-spacing:-.005em }
    small { display:block; color:#8a847e; font-size:12px; margin-top:6px }
    a { color:#0e0d0c; font-weight:600 }
    .err { color:#c8362c; font-weight:700 }

    /* Google 신규 가입자 추가 정보 입력 form */
    .signup-extra { width:100%; max-width:420px; margin:0 auto; padding:28px 26px; background:#fff; border-radius:16px; box-shadow:0 24px 60px rgba(20,14,8,.18); box-sizing:border-box; text-align:center; }
    .signup-extra h2 { margin:0 0 8px; font-size:22px; font-weight:800; color:#0e0d0c; text-align:center; }
    .signup-extra .sub { margin:0 0 18px; color:#8a847e; font-size:13px; text-align:center; }
    /* 한 줄 label/input layout (사장님 2026-05-25) */
    .signup-extra .field { display:flex; flex-direction:row; align-items:center; gap:10px; font-size:13px; font-weight:600; color:#4f4943; margin-bottom:10px; text-align:left; }
    .signup-extra .field .lbl { min-width:84px; max-width:84px; flex-shrink:0; }
    .signup-extra .field input { flex:1; min-width:0; padding:10px 13px; border:1px solid rgba(20,14,8,.16); border-radius:8px; font-size:14px; font-family:inherit; outline:none; box-sizing:border-box; }
    .signup-extra .field input:focus { border-color:#0e0d0c; }
    /* 사장님 2026-05-25 — input+button 폭 합이 모달 초과 → column 방향으로 줄바꿈, button 우측 정렬 */
    .signup-extra .nick-row { display:flex; flex-direction:column; gap:8px; align-items:stretch; margin-bottom:10px; }
    .signup-extra .nick-row .field { flex:1; margin-bottom:0; }
    .signup-extra .check-btn { padding:8px 16px; background:#0e0d0c; color:#fff; border:0; border-radius:8px; font-size:12px; font-weight:700; cursor:pointer; white-space:nowrap; font-family:inherit; align-self:flex-end; }
    .signup-extra .check-btn:disabled { opacity:.5; cursor:wait; }
    .signup-extra .nick-result { font-size:11.5px; font-weight:600; margin:-2px 0 10px; text-align:left; }
    .signup-extra .nick-result.ok { color:#1b5e20; }
    .signup-extra .nick-result.ng { color:#c8362c; }
    .signup-extra .phone-row { margin-bottom:10px; }
    .signup-extra .consents { display:flex; flex-direction:column; gap:8px; padding:12px; background:#fbf7ef; border-radius:8px; margin-bottom:12px; }
    .signup-extra .consents label { display:flex; align-items:center; gap:8px; font-size:13px; font-weight:500; color:#4f4943; cursor:pointer; }
    .signup-extra .consents input[type=checkbox] { width:14px; height:14px; accent-color:#c8362c; margin:0; }
    .signup-extra .consents .req { font-size:10.5px; font-weight:700; color:#c8362c; background:rgba(200,54,44,.1); padding:2px 6px; border-radius:4px; }
    .signup-extra .consents .opt { font-size:10.5px; font-weight:700; color:#4f4943; background:rgba(20,14,8,.08); padding:2px 6px; border-radius:4px; }
    .signup-extra .consents a { color:#0e0d0c; text-decoration:underline; font-weight:600; }
    .signup-extra .err-msg { color:#c8362c; font-size:12.5px; font-weight:600; min-height:18px; margin:0 0 8px; }
    .signup-extra .submit { width:100%; padding:12px 18px; background:#0e0d0c; color:#fff; border:0; border-radius:8px; font-size:14px; font-weight:700; cursor:pointer; font-family:inherit; }
    .signup-extra .submit:disabled { opacity:.55; cursor:wait; }
</style>
</head>
<body>
    <div class="wrap" role="status" aria-live="polite" id="loadingState">
        <img src="logo_main.png" alt="YOUNGMAN">
        <div class="ring" aria-hidden="true"></div>
        <p id="msg">로그인 처리 중…<small>잠시 후 이전 페이지로 돌아갑니다.</small></p>
        <small>이동되지 않으면 <a href="customers.html">고객관리대장으로 이동</a>하세요.</small>
    </div>

    <div class="wrap" id="extraWrap" style="display:none;">
        <form class="signup-extra" id="extraForm">
            <h2>가입을 완료해 주세요</h2>
            <p class="sub">YOUNGMAN 에 처음 오셨네요. 정보를 입력해 주세요.</p>

            <label class="field phone-row"><span class="lbl">이름</span><input type="text" id="extraFullName" autocomplete="name" placeholder="실명" required></label>

            <div class="nick-row">
                <label class="field"><span class="lbl">휴대폰 번호</span><input type="tel" id="extraPhone" autocomplete="tel" inputmode="numeric" placeholder="010-0000-0000" required></label>
                <button type="button" class="check-btn" id="extraSendOtp">인증번호 받기</button>
            </div>
            <div class="nick-result" id="extraSendOtpResult" hidden></div>

            <div class="nick-row" id="extraOtpRow" hidden>
                <label class="field"><span class="lbl">인증번호</span><input type="text" id="extraOtpCode" maxlength="6" inputmode="numeric" placeholder="6자리 숫자"></label>
                <button type="button" class="check-btn" id="extraVerifyOtp">확인</button>
            </div>
            <div class="nick-result" id="extraVerifyOtpResult" hidden></div>

            <div class="nick-row">
                <label class="field"><span class="lbl">닉네임</span><input type="text" id="extraNickname" minlength="2" maxlength="20" placeholder="2~20자 한글/영문/숫자" required></label>
                <button type="button" class="check-btn" id="extraCheckNick">중복확인</button>
            </div>
            <div class="nick-result" id="extraNickResult" hidden></div>

            <div class="consents">
                <label><input type="checkbox" id="extraAgreeAll"> 전체 동의</label>
                <label><input type="checkbox" id="extraAgreeTerms" data-req> <span class="req">필수</span> <a href="terms.html" target="_blank" rel="noopener">이용약관</a>에 동의</label>
                <label><input type="checkbox" id="extraAgreePrivacy" data-req> <span class="req">필수</span> <a href="privacy.html" target="_blank" rel="noopener">개인정보처리방침</a>에 동의</label>
                <label><input type="checkbox" id="extraAgreeMarketing"> <span class="opt">선택</span> 마케팅 정보 수신 동의</label>
            </div>
            <p class="err-msg" id="extraErr"></p>
            <button type="submit" class="submit" id="extraSubmit">가입 완료</button>
        </form>
    </div>
    <script type="module">
        /* =========================================================================
           단일 로그인 transition 페이지 — 모든 로그인 성공 흐름의 종착지.

           이전 분산된 흐름(openSharedLoginModal 안에서 곧장 navigateAfterAuth,
           Google OAuth 가 현재 페이지로 callback) 이 supabase 의 비동기 storage
           write 와 race 해서 "로그인이 가끔 안 됨" 증상 반복 발생.

           이 페이지의 역할:
             1) initSupabase 호출 → supabase 가 storage 에서 session 읽음
                (OAuth 의 경우 URL hash 의 access_token 자동 처리)
             2) getSession 명시 await → session 인식 확정
             3) 짧은 양보(120ms) 후 한 번 더 확인 → 비동기 storage write 따라잡기
             4) ?next=<url> 파라미터로 받은 페이지로 cache-bust replace
             5) 1.8 초 fallback: 여전히 본 페이지면 강제 customers.html 로 이동
           ========================================================================= */

        const $msg = document.getElementById('msg');

        function safeNext(raw) {
            // 외부 URL / 절대 경로 / javascript: 같은 위험 차단 — 같은 사이트의 .html 만 허용.
            // fallback 도 메인(index.html) — 명시되지 않으면 안전 default.
            const decoded = (() => { try { return decodeURIComponent(raw || ''); } catch { return ''; } })()
                .replace(/^\/+/, '');
            if (!decoded) return 'index.html';
            if (!/^[A-Za-z0-9_.-]+(\.html)?(\?[^/]*)?$/.test(decoded)) return 'index.html';
            return decoded;
        }

        const params = new URLSearchParams(location.search);
        const nextRaw = params.get('next');
        const target  = safeNext(nextRaw);

        let session = null;
        try {
            const mod = await import('./auth-shared.js?v=20260619-logout');
            const result = await mod.initSupabase().catch(() => null);
            const client = result?.client;
            if (client?.auth?.getSession) {
                const { data } = await client.auth.getSession();
                session = data?.session || null;
            }
        } catch {}

        // 첫 시도에 session 없으면 짧게 양보 후 한 번 더 — 비동기 storage write 따라잡기.
        if (!session) {
            await new Promise(r => setTimeout(r, 120));
            try {
                const mod = await import('./auth-shared.js?v=20260619-logout');
                const result = await mod.initSupabase().catch(() => null);
                if (result?.client?.auth?.getSession) {
                    const { data } = await result.client.auth.getSession();
                    session = data?.session || null;
                }
            } catch {}
        }

        if (!session) {
            // 세션이 확실히 set 안 된 경우 — 메인 페이지로 가서 로그인 모달 다시 띄움.
            $msg.innerHTML = '<span class="err">로그인이 완료되지 않았습니다.</span><small>메인 페이지로 돌아갑니다.</small>';
            setTimeout(() => { window.location.replace('index.html?_a=' + Date.now()); }, 800);
        } else {
            // session 확정 → members 행 자동 보강 (idempotent ensure mode).
            // supabase auth 에는 있는데 public.members 에 없는 '고아 user' 케이스 자동 복구.
            const meta = session.user?.user_metadata || {};
            const appMeta = session.user?.app_metadata || {};
            const providerStr = String(appMeta.provider || '').toLowerCase();
            const providersArr = Array.isArray(appMeta.providers) ? appMeta.providers.map(p => String(p).toLowerCase()) : [];
            // Supabase 버전/계정 상태에 따라 provider 가 빈 경우 providers 배열로도 판단.
            // identities 에 google 가 있으면 그것도 인정.
            const identitiesGoogle = Array.isArray(session.user?.identities)
                && session.user.identities.some(i => String(i?.provider || '').toLowerCase() === 'google');
            const isGoogle = providerStr === 'google' || providersArr.includes('google') || identitiesGoogle;
            let ensureSucceeded = false;
            let needsNickname = false;
            let needsPhone = false;
            let isPendingSignup = false;   // 사장님 2026-05-25 — Google 신규 미완료 가입자
            let ensureData = {};
            try {
                const ensureResp = await fetch('records.php?resource=auth-member&ensure=1', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + session.access_token,
                    },
                    body: JSON.stringify({
                        resource: 'auth-member',
                        ensure: true,
                        email: session.user?.email || '',
                        // 사장님 2026-05-25 — Google 가입자만 finalize 강제. provider 명시.
                        provider: isGoogle ? 'google' : 'email',
                        // finalize 없음 — Google 신규 가입자는 보충 폼 통해 입력받기 전 INSERT 금지.
                    }),
                });
                ensureData = await ensureResp.json().catch(() => ({}));
                console.log('[ensure member]', ensureResp.status, ensureData);
                ensureSucceeded = ensureResp.ok && (ensureData?.ok || ensureData?.already);
                isPendingSignup = !!ensureData?.pending_signup;
                needsNickname   = !!ensureData?.needsNickname;
                needsPhone      = !!ensureData?.needsPhone;
                if (!ensureSucceeded) {
                    try {
                        sessionStorage.setItem('erp.ensureError', JSON.stringify({
                            status: ensureResp.status,
                            error: ensureData?.error || 'unknown',
                            at: new Date().toISOString(),
                        }));
                    } catch {}
                }
            } catch (e) {
                console.error('[ensure member] fetch error', e);
                try { sessionStorage.setItem('erp.ensureError', JSON.stringify({ error: String(e?.message || e), at: new Date().toISOString() })); } catch {}
            }

            // Google 신규 = pending_signup → 무조건 form. 옛 가입자 보강 필요 = needsNickname || needsPhone.
            const needsExtra = isPendingSignup || (isGoogle && (needsNickname || needsPhone));
            console.log('[signup-extra trigger]', {
                provider: providerStr, isGoogle, isPendingSignup,
                needsNickname, needsPhone, needsExtra,
            });
            if (needsExtra) {
                document.getElementById('loadingState').style.display = 'none';
                document.getElementById('extraWrap').style.display = 'flex';
                setupExtraForm(session, target, {
                    presetFullName: meta.full_name || meta.name || '',
                    presetNickname: (ensureData && ensureData.nickname) || meta.nickname || '',
                    presetPhone: meta.phone || '',
                    isPendingSignup,
                });
                // submit 후 진행 — 자동 redirect 안 함. module top-level 이라 return 사용 X.
            } else {

            // 원래 가려던 페이지로 cache-bust replace.
            const sep = target.includes('?') ? '&' : '?';
            const url = target + sep + '_a=' + Date.now();
            try { window.location.replace(url); }
            catch { try { window.location.href = url; } catch {} }

            // fallback — 1.8 초 후에도 여전히 이 페이지면 강제 이동.
            setTimeout(() => {
                if (location.pathname.endsWith('login-complete.html')) {
                    try { window.location.href = 'customers.html?_a=' + Date.now(); } catch {}
                    setTimeout(() => { try { window.location.reload(); } catch {} }, 800);
                }
            }, 1800);
            } /* end else (needsExtra 가 false 인 경우만 redirect) */
        }

        // 사장님 2026-05-25 — Google 가입자 보충 form.
        // 이름 / 휴대폰(인증) / 닉네임 / 약관 → "가입 완료" 버튼까지 눌러야 member row INSERT.
        function setupExtraForm(session, target, presets) {
            const form              = document.getElementById('extraForm');
            const fullNameEl        = document.getElementById('extraFullName');
            const phoneEl           = document.getElementById('extraPhone');
            const sendOtpBtn        = document.getElementById('extraSendOtp');
            const sendOtpResultEl   = document.getElementById('extraSendOtpResult');
            const otpRowEl          = document.getElementById('extraOtpRow');
            const otpCodeEl         = document.getElementById('extraOtpCode');
            const verifyOtpBtn      = document.getElementById('extraVerifyOtp');
            const verifyOtpResultEl = document.getElementById('extraVerifyOtpResult');
            const nickEl            = document.getElementById('extraNickname');
            const checkNickBtn      = document.getElementById('extraCheckNick');
            const nickResultEl      = document.getElementById('extraNickResult');
            const errEl             = document.getElementById('extraErr');
            const submitBtn         = document.getElementById('extraSubmit');
            const agreeAll          = document.getElementById('extraAgreeAll');
            const agreeTerms        = document.getElementById('extraAgreeTerms');
            const agreePrivacy      = document.getElementById('extraAgreePrivacy');
            const agreeMarketing    = document.getElementById('extraAgreeMarketing');
            let nickChecked = false;
            let phoneVerificationToken = null;
            let resendCooldownTimer = null;

            // pre-fill
            const presetFullName = (presets?.presetFullName || '').trim();
            const presetNick     = (presets?.presetNickname || '').trim();
            const presetPhone    = (presets?.presetPhone || '').toString().replace(/\D/g, '');
            if (presetFullName) fullNameEl.value = presetFullName;
            if (presetNick) {
                nickEl.value = presetNick;
                nickChecked = true;
                nickResultEl.hidden = false;
                nickResultEl.className = 'nick-result ok';
                nickResultEl.textContent = '✅ 현재 닉네임을 그대로 사용 (수정 시 다시 중복확인)';
            }
            if (presetPhone) phoneEl.value = formatPhone(presetPhone);

            function formatPhone(digits) {
                const d = String(digits || '').replace(/\D/g, '').slice(0, 11);
                if (d.length < 4)       return d;
                else if (d.length < 8)  return d.slice(0, 3) + '-' + d.slice(3);
                else                    return d.slice(0, 3) + '-' + d.slice(3, 7) + '-' + d.slice(7);
            }

            function showResult(el, ok, text) {
                el.hidden = false;
                el.className = ok ? 'nick-result ok' : 'nick-result ng';
                el.textContent = text;
            }

            function resetPhoneVerification() {
                phoneVerificationToken = null;
                otpRowEl.hidden = true;
                otpCodeEl.value = '';
                otpCodeEl.disabled = false;
                verifyOtpResultEl.hidden = true;
                verifyOtpBtn.disabled = false;
                verifyOtpBtn.textContent = '확인';
                sendOtpResultEl.hidden = true;
                if (!resendCooldownTimer) {
                    sendOtpBtn.disabled = false;
                    sendOtpBtn.textContent = '인증번호 받기';
                }
            }

            function startResendCooldown(sec) {
                if (resendCooldownTimer) { clearInterval(resendCooldownTimer); resendCooldownTimer = null; }
                let remain = sec;
                sendOtpBtn.disabled = true;
                sendOtpBtn.textContent = `재발송 (${remain}초)`;
                resendCooldownTimer = setInterval(() => {
                    remain -= 1;
                    if (remain <= 0) {
                        clearInterval(resendCooldownTimer); resendCooldownTimer = null;
                        if (!phoneVerificationToken) {
                            sendOtpBtn.disabled = false;
                            sendOtpBtn.textContent = '인증번호 받기';
                        }
                    } else {
                        sendOtpBtn.textContent = `재발송 (${remain}초)`;
                    }
                }, 1000);
            }

            phoneEl.addEventListener('input', () => {
                phoneEl.value = formatPhone(phoneEl.value);
                if (phoneVerificationToken) resetPhoneVerification();
            });

            sendOtpBtn.addEventListener('click', async () => {
                const phoneDigits = phoneEl.value.replace(/\D/g, '');
                if (!/^01[016789]\d{7,8}$/.test(phoneDigits)) {
                    showResult(sendOtpResultEl, false, '올바른 휴대폰 번호를 입력해주세요 (010-...).');
                    return;
                }
                sendOtpBtn.disabled = true;
                sendOtpBtn.textContent = '발송 중…';
                try {
                    const resp = await fetch('records.php?resource=signup-send-otp', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ phone: phoneDigits }),
                    });
                    const data = await resp.json().catch(() => ({}));
                    if (!resp.ok || !data?.ok) {
                        showResult(sendOtpResultEl, false, data?.error || ('발송 실패 (HTTP ' + resp.status + ')'));
                        sendOtpBtn.disabled = false;
                        sendOtpBtn.textContent = '인증번호 받기';
                        return;
                    }
                    showResult(sendOtpResultEl, true, '📩 ' + (data.sentTo || phoneDigits) + ' 로 6자리 인증번호 발송 (5분 유효)');
                    otpRowEl.hidden = false;
                    setTimeout(() => otpCodeEl.focus(), 50);
                    startResendCooldown(60);
                } catch (e) {
                    showResult(sendOtpResultEl, false, '발송 실패: ' + (e?.message || e));
                    sendOtpBtn.disabled = false;
                    sendOtpBtn.textContent = '인증번호 받기';
                }
            });

            verifyOtpBtn.addEventListener('click', async () => {
                const phoneDigits = phoneEl.value.replace(/\D/g, '');
                const code = otpCodeEl.value.replace(/\D/g, '');
                if (!code || code.length !== 6) {
                    showResult(verifyOtpResultEl, false, '인증번호 6자리를 입력해주세요.');
                    return;
                }
                verifyOtpBtn.disabled = true;
                verifyOtpBtn.textContent = '확인 중…';
                try {
                    const resp = await fetch('records.php?resource=signup-verify-otp', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ phone: phoneDigits, code }),
                    });
                    const data = await resp.json().catch(() => ({}));
                    if (!resp.ok || !data?.ok) {
                        showResult(verifyOtpResultEl, false, data?.error || ('인증 실패 (HTTP ' + resp.status + ')'));
                        verifyOtpBtn.disabled = false;
                        verifyOtpBtn.textContent = '확인';
                        return;
                    }
                    phoneVerificationToken = String(data.verificationToken || '');
                    showResult(verifyOtpResultEl, true, '✅ 휴대폰 인증 완료');
                    verifyOtpBtn.textContent = '✓ 인증완료';
                    verifyOtpBtn.disabled = true;
                    otpCodeEl.disabled = true;
                    if (resendCooldownTimer) { clearInterval(resendCooldownTimer); resendCooldownTimer = null; }
                    sendOtpBtn.disabled = true;
                    sendOtpBtn.textContent = '✓ 인증완료';
                } catch (e) {
                    showResult(verifyOtpResultEl, false, '인증 실패: ' + (e?.message || e));
                    verifyOtpBtn.disabled = false;
                    verifyOtpBtn.textContent = '확인';
                }
            });

            // 전체동의 체크 동기화
            agreeAll.addEventListener('change', () => {
                [agreeTerms, agreePrivacy, agreeMarketing].forEach(el => { el.checked = agreeAll.checked; });
            });
            [agreeTerms, agreePrivacy, agreeMarketing].forEach(el => el.addEventListener('change', () => {
                agreeAll.checked = agreeTerms.checked && agreePrivacy.checked && agreeMarketing.checked;
            }));

            nickEl.addEventListener('input', () => {
                nickResultEl.hidden = true;
                nickChecked = false;
            });

            // 닉네임 중복확인
            checkNickBtn.addEventListener('click', async () => {
                const v = nickEl.value.trim();
                if (!v) { showResult(nickResultEl, false, '닉네임을 입력해주세요.'); return; }
                checkNickBtn.disabled = true; checkNickBtn.textContent = '확인 중…';
                try {
                    const resp = await fetch('records.php?resource=auth-availability&nickname=' + encodeURIComponent(v), { method: 'GET' });
                    const data = await resp.json().catch(() => ({}));
                    if (data?.nickname_invalid) {
                        showResult(nickResultEl, false, '닉네임은 2~20자, 한글/영문/숫자/_/- 만 가능합니다.');
                    } else if (data?.nickname_taken === true) {
                        showResult(nickResultEl, false, '이미 사용 중인 닉네임입니다.');
                    } else {
                        showResult(nickResultEl, true, '✅ 사용 가능한 닉네임입니다.');
                        nickChecked = true;
                    }
                } catch (e) {
                    showResult(nickResultEl, false, '확인 실패: ' + (e?.message || e));
                } finally {
                    checkNickBtn.disabled = false; checkNickBtn.textContent = '중복확인';
                }
            });

            // 가입 완료 submit — auth-member POST (finalize=true) 가 모든 INSERT 처리.
            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                errEl.textContent = '';
                const fullName = fullNameEl.value.trim();
                const phoneDigits = phoneEl.value.replace(/\D/g, '');
                const nickname = nickEl.value.trim();

                if (!fullName) { errEl.textContent = '이름을 입력해주세요.'; return; }
                if (!phoneDigits) { errEl.textContent = '휴대폰 번호를 입력해주세요.'; return; }
                if (!/^01[016789]\d{7,8}$/.test(phoneDigits)) { errEl.textContent = '올바른 휴대폰 번호를 입력해주세요 (010-0000-0000).'; return; }
                if (!phoneVerificationToken) { errEl.textContent = '휴대폰 인증을 완료해주세요.'; return; }
                if (!nickname) { errEl.textContent = '닉네임을 입력해주세요.'; return; }
                if (!nickChecked) { errEl.textContent = '닉네임 중복확인 후 진행해주세요.'; return; }
                if (!agreeTerms.checked || !agreePrivacy.checked) { errEl.textContent = '필수 약관에 동의해주세요.'; return; }

                submitBtn.disabled = true; submitBtn.textContent = '가입 처리 중…';
                try {
                    // member row INSERT (finalize=true → server 가 token 검증 + INSERT)
                    const finalizeResp = await fetch('records.php?resource=auth-member&ensure=1', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + session.access_token },
                        body: JSON.stringify({
                            resource: 'auth-member',
                            ensure: true,
                            finalize: true,
                            provider: 'google',
                            email: session.user?.email || '',
                            fullName,
                            phone: phoneDigits,
                            nickname,
                            phone_verification_token: phoneVerificationToken,
                            terms_agreed: true,
                            privacy_agreed: true,
                            marketing_opt_in: !!agreeMarketing.checked,
                            consent_at: new Date().toISOString(),
                        }),
                    });
                    const finalizeData = await finalizeResp.json().catch(() => ({}));
                    if (!finalizeResp.ok || !(finalizeData?.ok || finalizeData?.already)) {
                        throw new Error(finalizeData?.error || ('HTTP ' + finalizeResp.status));
                    }

                    // 사장님 2026-05-25 — 첫 로그인 환영 모달 트리거 (localStorage flag).
                    try { localStorage.setItem('yman_pending_welcome', '1'); } catch {}

                    // supabase user_metadata 갱신 (이름/닉네임/약관 동의 기록)
                    try {
                        const mod = await import('./auth-shared.js?v=20260619-logout');
                        const result = await mod.initSupabase().catch(() => null);
                        const client = result?.client;
                        if (client?.auth?.updateUser) {
                            await client.auth.updateUser({
                                data: {
                                    full_name: fullName,
                                    nickname,
                                    phone: phoneDigits,
                                    phone_verified: true,
                                    terms_agreed: true,
                                    privacy_agreed: true,
                                    marketing_opt_in: !!agreeMarketing.checked,
                                    consent_at: new Date().toISOString(),
                                    app_registered: true,
                                    needs_welcome: true,   // 사장님 2026-05-25 — 첫 로그인 환영 모달
                                },
                            });
                        }
                    } catch {}

                    // 원래 가려던 페이지로 이동
                    const sep = target.includes('?') ? '&' : '?';
                    const url = target + sep + '_a=' + Date.now();
                    try { window.location.replace(url); }
                    catch { try { window.location.href = url; } catch {} }
                } catch (err) {
                    errEl.textContent = '가입 실패: ' + (err?.message || err);
                    submitBtn.disabled = false; submitBtn.textContent = '가입 완료';
                }
            });

            // 이름 input 자동 focus (presetFullName 있으면 휴대폰)
            setTimeout(() => (presetFullName ? phoneEl : fullNameEl)?.focus(), 100);
        }
    </script>
</body>
</html>
