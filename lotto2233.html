<header id="app-header" class="app-header"></header>

<div class="container">

<script>
/* ============ 모드 전환 ============ */
let currentMode = 'saju';

function switchMode(mode){
    currentMode = mode;
    document.getElementById('tab-saju').classList.toggle('active', mode==='saju');
    document.getElementById('tab-pattern').classList.toggle('active', mode==='pattern');
    document.getElementById('tab-combined').classList.toggle('active', mode==='combined');
    document.getElementById('tab-gunghap').classList.toggle('active', mode==='gunghap');

    const showSaju = (mode==='saju' || mode==='combined');
    document.getElementById('sajuInputs').style.display = showSaju ? '' : 'none';
    document.getElementById('patternIntro').style.display = (mode==='pattern') ? '' : 'none';
    if (mode==='gunghap') initGunghapInputs();
    document.getElementById('gunghapInputs').style.display = (mode==='gunghap') ? '' : 'none';

    const title = document.getElementById('pageTitle');
    const sub   = document.getElementById('pageSubtitle');
    const btn   = document.getElementById('generateBtn');
    const drawLabel = document.getElementById('drawDateLabel');

    if (mode==='saju') {
        title.textContent = '도사의 사주 풀이';
        sub.textContent   = '사주 흐름을 들여다보고 오늘 모이는 기운을 풀어드립니다. (번호 생성은 다른 탭에서)';
        btn.textContent   = '사주 풀이 받기';
        drawLabel.textContent = '오늘 / 풀이 기준일';
    } else if (mode==='pattern') {
        title.textContent = '1등 패턴 분석 추천';
        sub.textContent   = '역대 1등 당첨 데이터의 빈도·간격·페어 패턴으로 이번 회차 추천번호를 뽑습니다.';
        btn.textContent   = '이번 회차 추천번호 받기';
    } else if (mode==='combined') {
        title.textContent = '사주 × 패턴 융합 추천';
        sub.textContent   = '내 사주의 보완 오행과 1등 데이터 패턴을 함께 보고, 운이 잘 모이는 번호 조합을 추천합니다.';
        btn.textContent   = '종합 추천 받기';
        drawLabel.textContent = '로또 추첨일';
    } else {
        title.textContent = '도사의 궁합 풀이';
        sub.textContent   = '두 사람의 사주를 펼쳐 일간·오행·지지의 합과 충, 띠와 용신의 인연까지 보고 궁합을 풀어드립니다.';
        btn.textContent   = '궁합 풀이 받기';
    }

    document.getElementById('result').innerHTML = '';
}

/* ============ 사주 계산 엔진 (기존 로직 보존) ============ */
let selectedGender = 'male';

window.onload = function(){
    document.getElementById('maleBtn').classList.add('active');
    const t = new Date();
    document.getElementById('drawY').value = t.getFullYear();
    document.getElementById('drawM').value = t.getMonth() + 1;
    document.getElementById('drawD').value = t.getDate();
    document.getElementById('birthRegion').innerHTML = REGION_OPTS;
    initGunghapInputs();
    switchMode('saju');
};

function setGender(g){
    selectedGender = g;
    document.getElementById('maleBtn').classList.remove('active');
    document.getElementById('femaleBtn').classList.remove('active');
    document.getElementById(g==='male' ? 'maleBtn' : 'femaleBtn').classList.add('active');
}

function toggleTime(){
    const type = document.getElementById('timeType').value;
    document.getElementById('timeZodiac').style.display = type==='zodiac' ? 'block' : 'none';
    document.getElementById('timeExact').style.display  = type==='exact'  ? 'block' : 'none';
}

const stems    = ['갑','을','병','정','무','기','경','신','임','계'];
const branches = ['자','축','인','묘','진','사','오','미','신','유','술','해'];
const elementMap = {
    '갑':'wood','을':'wood','병':'fire','정':'fire','무':'earth','기':'earth',
    '경':'metal','신':'metal','임':'water','계':'water',
    '자':'water','축':'earth','인':'wood','묘':'wood','진':'earth','사':'fire',
    '오':'fire','미':'earth','유':'metal','술':'earth','해':'water'
};
const elementKor = {wood:'목(木)',fire:'화(火)',earth:'토(土)',metal:'금(金)',water:'수(水)'};
const produces = {wood:'fire',fire:'earth',earth:'metal',metal:'water',water:'wood'};
const controls = {wood:'earth',earth:'water',water:'fire',fire:'metal',metal:'wood'};
const hiddenStems = {
    자:['계'],축:['기','계','신'],인:['갑','병','무'],묘:['을'],
    진:['무','을','계'],사:['병','무','경'],오:['정','기'],미:['기','정','을'],
    신:['경','임','무'],유:['신'],술:['무','신','정'],해:['임','갑']
};

function mod(n,m){return ((n%m)+m)%m;}
function validDate(y,m,d){const dt=new Date(y,m-1,d);return dt.getFullYear()===y&&dt.getMonth()===m-1&&dt.getDate()===d;}
function formatKoreanLunar(date){
    const parts = new Intl.DateTimeFormat('ko-KR-u-ca-dangi',{year:'numeric',month:'numeric',day:'numeric'}).formatToParts(date);
    const out = {};
    parts.forEach(p=>{const n=Number(String(p.value).replace(/\D/g,''));if(p.type==='year'||p.type==='relatedYear')out.y=n;if(p.type==='month')out.m=n;if(p.type==='day')out.d=n;});
    return out;
}
function lunarToSolar(y,m,d){
    const start=new Date(y-1,0,1), end=new Date(y+1,11,31);
    for(let t=start.getTime();t<=end.getTime();t+=86400000){
        const dt=new Date(t);
        const lunar=formatKoreanLunar(dt);
        if(lunar.y===y&&lunar.m===m&&lunar.d===d) return {y:dt.getFullYear(),m:dt.getMonth()+1,d:dt.getDate()};
    }
    return null;
}
function resolveBirthDate(y,m,d){
    const type=document.getElementById('calendarType').value;
    if(!validDate(y,m,d)) return {error:'올바른 생년월일을 입력해주세요.'};
    if(type==='solar') return {y,m,d,type:'양력'};
    try{
        const c=lunarToSolar(y,m,d);
        if(!c) return {error:'입력한 음력 날짜를 양력으로 변환할 수 없습니다.'};
        return {...c,type:'음력',input:{y,m,d}};
    }catch(e){
        return {error:'이 브라우저는 한국 음력 변환을 지원하지 않습니다. 양력으로 입력해주세요.'};
    }
}

function solarMonthIndex(m,d){
    if((m===2&&d>=4)||(m===3&&d<6))return 2;
    if((m===3&&d>=6)||(m===4&&d<5))return 3;
    if((m===4&&d>=5)||(m===5&&d<6))return 4;
    if((m===5&&d>=6)||(m===6&&d<6))return 5;
    if((m===6&&d>=6)||(m===7&&d<7))return 6;
    if((m===7&&d>=7)||(m===8&&d<8))return 7;
    if((m===8&&d>=8)||(m===9&&d<8))return 8;
    if((m===9&&d>=8)||(m===10&&d<8))return 9;
    if((m===10&&d>=8)||(m===11&&d<7))return 10;
    if((m===11&&d>=7)||(m===12&&d<7))return 11;
    if((m===12&&d>=7)||(m===1&&d<6))return 0;
    return 1;
}
function yearPillar(y,m,d){let yy=y;if(m===1||(m===2&&d<4))yy--;const diff=yy-1984;return {stem:stems[mod(diff,10)],branch:branches[mod(diff,12)]};}
function monthPillar(yearStem,m,d){const mi=solarMonthIndex(m,d);const yi=stems.indexOf(yearStem);return {stem:stems[mod(yi*2+mi,10)],branch:branches[mi]};}
function dayPillar(y,m,d){const target=new Date(y,m-1,d);const base=new Date(1900,0,31);const diff=Math.floor((target-base)/86400000);return {stem:stems[mod(diff,10)],branch:branches[mod(diff,12)]};}
function hourPillar(dayStem,h){let bi=(h===23||h===0)?0:Math.floor((h+1)/2);if(bi>11) bi=11;const di=stems.indexOf(dayStem);return {stem:stems[mod(di*2+bi,10)],branch:branches[bi]};}
function getPillars(y,m,d,h){const yp=yearPillar(y,m,d);const mp=monthPillar(yp.stem,m,d);const dp=dayPillar(y,m,d);const hp=hourPillar(dp.stem,h);return [yp,mp,dp,hp];}

function yinYang(s){return ['갑','병','무','경','임'].includes(s)?'양':'음';}
function tenGod(dayStem,targetStem){
    const a=elementMap[dayStem], b=elementMap[targetStem];
    const same=yinYang(dayStem)===yinYang(targetStem);
    if(a===b) return same?'비견':'겁재';
    if(produces[a]===b) return same?'식신':'상관';
    if(produces[b]===a) return same?'편인':'정인';
    if(controls[a]===b) return same?'편재':'정재';
    if(controls[b]===a) return same?'편관':'정관';
    return '중립';
}
function elementScore(ps){
    const s={wood:0,fire:0,earth:0,metal:0,water:0};
    ps.forEach((p,i)=>{
        s[elementMap[p.stem]]+=(i===1?1.8:1.2);
        s[elementMap[p.branch]]+=(i===1?2.0:1.0);
        hiddenStems[p.branch].forEach((hs,idx)=>{s[elementMap[hs]]+=(idx===0?0.8:0.35);});
    });
    return s;
}
function strength(dayStem,ps,score){
    const dayEl=elementMap[dayStem];
    const monthEl=elementMap[ps[1].branch];
    const mother=Object.keys(produces).find(k=>produces[k]===dayEl);
    let p=0;
    if(monthEl===dayEl) p+=3.2;
    if(produces[monthEl]===dayEl) p+=2.1;
    if(score[dayEl]>=3.5) p+=2;
    if(score[mother]>=2.4) p+=1.6;
    if(p>=5.2) return '신강';
    if(p<=2.7) return '신약';
    return '중화';
}
function climate(branch){
    if(['사','오','미'].includes(branch)) return '조열';
    if(['해','자','축'].includes(branch)) return '한습';
    if(['인','묘','진'].includes(branch)) return '생목';
    return '숙금';
}
function yongshin(dayStem,ps,score,str){
    const dayEl=elementMap[dayStem];
    const mother=Object.keys(produces).find(k=>produces[k]===dayEl);
    const child=produces[dayEl];
    const wealth=controls[dayEl];
    const c=climate(ps[1].branch);
    if(c==='조열' && score.water<2.8) return 'water';
    if(c==='한습' && score.fire<2.8)  return 'fire';
    if(str==='신강') return score[child]<=score[wealth]?child:wealth;
    if(str==='신약') return score[mother]<=score[dayEl]?mother:dayEl;
    let min='wood';
    for(const k in score) if(score[k]<score[min]) min=k;
    return min;
}
function gyeok(ps,dayStem){const main=hiddenStems[ps[1].branch][0];return tenGod(dayStem,main)+'격';}
function gyeokStatus(ge,str,rel){
    if(rel.includes('충')) return '파격 기운';
    if(str==='중화') return '균형격';
    if(str==='신강' && (ge.includes('비견')||ge.includes('겁재'))) return '신강 변격';
    if(str==='신약' && (ge.includes('정관')||ge.includes('편관'))) return '관성 부담격';
    return '성격 유지';
}
function relations(ps){
    const z=ps.map(p=>p.branch);
    const arr=[];
    const list=[
        ['자','오','자오충'],['축','미','축미충'],['인','신','인신충'],['묘','유','묘유충'],['진','술','진술충'],['사','해','사해충'],
        ['자','축','자축합'],['인','해','인해합'],['묘','술','묘술합'],['진','유','진유합'],['사','신','사신합'],['오','미','오미합'],
        ['자','묘','자묘형'],['인','사','인사형'],['축','술','축술형'],['자','유','자유파'],['진','축','진축파'],['신','해','신해해']
    ];
    list.forEach(([a,b,n])=>{ if(z.includes(a)&&z.includes(b)) arr.push(n); });
    return arr.length?arr.join(', '):'큰 충돌 없이 안정적';
}
function luckyElement(birthPs,drawPs,ys,str){
    const bs=elementScore(birthPs), ds=elementScore(drawPs);
    const sc={wood:0,fire:0,earth:0,metal:0,water:0};
    for(const e in sc){
        sc[e] += Math.max(0, 3.5-bs[e]) * 1.8;
        sc[e] += ds[e] * 1.2;
        if(e===ys) sc[e] += 5.5;
    }
    const rel=relations(birthPs.concat(drawPs));
    if(rel.includes('합')) sc[ys] += 1.7;
    if(rel.includes('충')) sc[elementMap[drawPs[2].stem]] += 1.1;
    if(str==='신약') sc[ys] += 1.5;
    return Object.keys(sc).sort((a,b)=>sc[b]-sc[a])[0];
}
function getDaewoon(year, gender){
    const nowYear=new Date().getFullYear();
    const koreanAge=nowYear-year+1;
    const startAge = gender==='male'?8:7;
    const cycle=Math.max(0, Math.floor((koreanAge-startAge)/10));
    const from=startAge+cycle*10;
    return `${from}세 ~ ${from+9}세 대운`;
}
function getSewoon(year){const diff=year-1984;return stems[mod(diff,10)]+branches[mod(diff,12)];}
function getWolwoon(year,month){const yStem=yearPillar(year,month,15).stem;const mp=monthPillar(yStem,month,15);return mp.stem+mp.branch;}

function color(n){if(n<=10)return'yellow';if(n<=20)return'blue';if(n<=30)return'red';if(n<=40)return'gray';return'green';}

/* ============ 입력 검증 ============ */
function validateSaju(){
    if (!document.getElementById('userName').value.trim()) return '이름을 입력해주세요.';
    const by=Number(document.getElementById('birthY').value), bm=Number(document.getElementById('birthM').value), bd=Number(document.getElementById('birthD').value);
    if (!by||!bm||!bd) return '생년월일을 입력해주세요.';
    if (!validDate(by,bm,bd)) return '올바른 생년월일을 입력해주세요.';
    const dy=Number(document.getElementById('drawY').value), dm=Number(document.getElementById('drawM').value), dd=Number(document.getElementById('drawD').value);
    if (!dy||!dm||!dd) return '추첨일을 입력해주세요.';
    if (!validDate(dy,dm,dd)) return '올바른 추첨일을 입력해주세요.';
    return '';
}

function computeSajuContext(){
    const nm = document.getElementById('userName').value.trim();
    const by=Number(document.getElementById('birthY').value), bm=Number(document.getElementById('birthM').value), bd=Number(document.getElementById('birthD').value);
    const birthDate = resolveBirthDate(by,bm,bd);
    if (birthDate.error) return {error: birthDate.error};
    const y=birthDate.y, m=birthDate.m, d=birthDate.d;
    const h = document.getElementById('timeType').value==='exact'
        ? Number(document.getElementById('timeExact').value || 12)
        : Number(document.getElementById('timeZodiac').value);
    const dy=Number(document.getElementById('drawY').value), dm=Number(document.getElementById('drawM').value), dd=Number(document.getElementById('drawD').value);

    const bp=getPillars(y,m,d,h);
    const dp=getPillars(dy,dm,dd,12);
    const bs=elementScore(bp);
    const str=strength(bp[2].stem, bp, bs);
    const ys=yongshin(bp[2].stem, bp, bs, str);
    const ge=gyeok(bp, bp[2].stem);
    const cl=climate(bp[1].branch);
    const rel=relations(bp.concat(dp));
    const geStatus=gyeokStatus(ge, str, rel);
    const lucky=luckyElement(bp, dp, ys, str);
    const dw=getDaewoon(y, selectedGender);
    const sw=getSewoon(dy);
    const ww=getWolwoon(dy, dm);

    const birthLabel = birthDate.type==='음력'
        ? `음력 ${by}년 ${bm}월 ${bd}일 → 양력 ${y}년 ${m}월 ${d}일`
        : `양력 ${y}년 ${m}월 ${d}일`;
    const region = (document.getElementById('birthRegion').value) || '모름';

    return {
        name: nm, gender: selectedGender, birthLabel, region, drawDate: `${dy}년 ${dm}월 ${dd}일`,
        ge, geStatus, str, cl, ys, lucky, dw, sw, ww, rel,
        seed: `${nm}|${selectedGender}|${y}-${m}-${d}|${h}|${dy}-${dm}-${dd}|${ys}|${lucky}`,
    };
}

async function fetchDosaReading(targetId, payload){
    const target = document.getElementById(targetId);
    if (!target) return;
    try {
        const email = (() => { try { return localStorage.getItem('erp.userEmail.last') || sessionStorage.getItem('erp.userEmail') || ''; } catch { return ''; } })();
        const res = await fetch('saju-reading.php', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ ...payload, email }),
        });
        const data = await res.json().catch(() => null);
        if (!res.ok || !data?.ok) {
            target.innerHTML = `<em style="color:#888;">도사의 풀이를 가져오지 못했습니다 (${data?.error || res.status}). 다시 시도해 주세요.</em>`;
            return;
        }
        target.textContent = data.reading;
        addDosaCopyButton(target, payload.name, data.reading);
    } catch (e) {
        target.innerHTML = `<em style="color:#888;">도사의 풀이를 가져오지 못했습니다 (${(e && e.message) || e}). 다시 시도해 주세요.</em>`;
    }
}

function addDosaCopyButton(target, name, reading){
    const box = target.closest('.box.dosa') || target.parentElement;
    if (!box || box.querySelector('.dosa-copy-btn')) return;
    const copyText = `${(name || '').trim()} 님 사주풀이\n\n${reading}`.trim();
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'dosa-copy-btn';
    btn.textContent = '📋 풀이 복사';
    btn.addEventListener('click', async () => {
        let ok = false;
        try {
            await navigator.clipboard.writeText(copyText);
            ok = true;
        } catch {
            // WebView/비보안 컨텍스트 폴백
            try {
                const ta = document.createElement('textarea');
                ta.value = copyText;
                ta.style.position = 'fixed'; ta.style.opacity = '0';
                document.body.appendChild(ta); ta.focus(); ta.select();
                ok = document.execCommand('copy');
                document.body.removeChild(ta);
            } catch { ok = false; }
        }
        btn.textContent = ok ? '✓ 복사됨' : '복사 실패 — 길게 눌러 선택하세요';
        btn.classList.toggle('copied', ok);
        setTimeout(() => { btn.textContent = '📋 풀이 복사'; btn.classList.remove('copied'); }, 1800);
    });
    box.appendChild(btn);
}

function getPillars3(y,m,d){const yp=yearPillar(y,m,d);const mp=monthPillar(yp.stem,m,d);const dp=dayPillar(y,m,d);return [yp,mp,dp];}
function resolveBirth(calType,y,m,d){
    if(!validDate(y,m,d)) return {error:'올바른 생년월일을 입력해주세요.'};
    if(calType==='solar') return {y,m,d,type:'양력'};
    try{ const c=lunarToSolar(y,m,d); if(!c) return {error:'음력 날짜를 양력으로 변환할 수 없습니다.'}; return {...c,type:'음력'}; }
    catch(e){ return {error:'이 브라우저는 음력 변환을 지원하지 않습니다. 양력으로 입력해주세요.'}; }
}
const branchAnimal={자:'쥐',축:'소',인:'호랑이',묘:'토끼',진:'용',사:'뱀',오:'말',미:'양',신:'원숭이',유:'닭',술:'개',해:'돼지'};
// 지지 인연/충돌 규칙: 육합·삼합(인연) / 충·형·파·해(갈등)
const PAIR_RULES=[
    ['자','오','충'],['축','미','충'],['인','신','충'],['묘','유','충'],['진','술','충'],['사','해','충'],
    ['자','축','육합'],['인','해','육합'],['묘','술','육합'],['진','유','육합'],['사','신','육합'],['오','미','육합'],
    ['신','자','삼합'],['자','진','삼합'],['신','진','삼합'],['해','묘','삼합'],['묘','미','삼합'],['해','미','삼합'],
    ['인','오','삼합'],['오','술','삼합'],['인','술','삼합'],['사','유','삼합'],['유','축','삼합'],['사','축','삼합'],
    ['자','묘','형'],['인','사','형'],['사','신','형'],['축','술','형'],['술','미','형'],['축','미','형'],
    ['자','유','파'],['진','축','파'],['신','해','해'],['인','사','해']
];
function crossPairs(aB,bB){
    const out=new Set();
    aB.forEach(a=>bB.forEach(b=>{
        PAIR_RULES.forEach(([x,yy,n])=>{ if((a===x&&b===yy)||(a===yy&&b===x)) out.add(`${a}${b} ${n}`); });
    }));
    return [...out];
}
function fmtScore(sc){return Object.keys(sc).map(k=>elementKor[k][0]+(Math.round(sc[k]*10)/10)).join(' ');}

function computePerson(pfx){
    const g=id=>document.getElementById(pfx+id);
    const name=g('Name').value.trim();
    if(!name) return {error:'두 분의 이름을 모두 입력해주세요.'};
    const by=Number(g('Y').value), bm=Number(g('M').value), bd=Number(g('D').value);
    if(!by||!bm||!bd||!validDate(by,bm,bd)) return {error:`${name}님의 생년월일을 정확히 입력해주세요.`};
    const birth=resolveBirth(g('Cal').value,by,bm,bd);
    if(birth.error) return {error:`${name}님: ${birth.error}`};
    const {y,m,d}=birth;
    const tt=g('TimeType').value;
    let h=null, timeLabel='모름';
    if(tt==='zodiac'){ h=Number(g('TimeZodiac').value); timeLabel=g('TimeZodiac').selectedOptions[0].text; }
    else if(tt==='exact'){ const v=g('TimeExact').value, ex=Number(v); if(v!==''&&!Number.isNaN(ex)&&ex>=0&&ex<=23){ h=ex; timeLabel=`${ex}시`; } }
    const region=g('Region').value || '모름';
    const bp = h!=null ? getPillars(y,m,d,h) : getPillars3(y,m,d);
    const sc=elementScore(bp);
    const dayStem=bp[2].stem;
    const str=strength(dayStem,bp,sc);
    const ys=yongshin(dayStem,bp,sc,str);
    const ge=gyeok(bp,dayStem);
    const cl=climate(bp[1].branch);
    const rel=relations(bp);
    const geStatus=gyeokStatus(ge,str,rel);
    const birthLabel = birth.type==='음력' ? `음력 ${by}.${bm}.${bd} → 양력 ${y}.${m}.${d}` : `양력 ${y}.${m}.${d}`;
    return {
        name, gender: window[pfx+'Gender']||'male', birthLabel, timeLabel, region, hasHour:h!=null,
        dayStem, dayEl:elementMap[dayStem], yearBranch:bp[0].branch, animal:branchAnimal[bp[0].branch],
        branches:bp.map(p=>p.branch), pillarsTxt:bp.map(p=>p.stem+p.branch).join(' '),
        ge,geStatus,str,cl,ys,sc,rel,
    };
}

function gunghapData(A,B){
    const ea=A.dayEl, eb=B.dayEl;
    let elRel, elRelShort;
    if(ea===eb){ elRel=`두 분 다 ${elementKor[ea]} 일간 — 같은 기운(비화). 닮아 통하지만 부딪힘도 닮음`; elRelShort='같은 기운(비화)'; }
    else if(produces[ea]===eb){ elRel=`${A.name}님의 ${elementKor[ea]}가 ${B.name}님의 ${elementKor[eb]}를 살리는 상생 (${A.name}님이 베푸는 자리)`; elRelShort='상생 (A→B)'; }
    else if(produces[eb]===ea){ elRel=`${B.name}님의 ${elementKor[eb]}가 ${A.name}님의 ${elementKor[ea]}를 살리는 상생 (${B.name}님이 베푸는 자리)`; elRelShort='상생 (B→A)'; }
    else if(controls[ea]===eb){ elRel=`${A.name}님의 ${elementKor[ea]}가 ${B.name}님의 ${elementKor[eb]}를 누르는 상극 (${A.name}님이 주도)`; elRelShort='상극 (A→B)'; }
    else { elRel=`${B.name}님의 ${elementKor[eb]}가 ${A.name}님의 ${elementKor[ea]}를 누르는 상극 (${B.name}님이 주도)`; elRelShort='상극 (B→A)'; }

    const dgAB=tenGod(A.dayStem,B.dayStem);
    const dgBA=tenGod(B.dayStem,A.dayStem);

    const cross=crossPairs(A.branches,B.branches);
    const harmonies=cross.filter(x=>/(합)/.test(x));
    const clashes  =cross.filter(x=>/(충|형|파|해)/.test(x));

    const animalTag=crossPairs([A.yearBranch],[B.yearBranch]).map(l=>l.split(' ')[1]);
    const animalRel=`${A.animal}띠 × ${B.animal}띠 — ${animalTag.length?animalTag.join(', '):'평이(특별한 합·충 없음)'}`;

    const aFromB=B.sc[A.ys]>=3, bFromA=A.sc[B.ys]>=3;
    const aGetsFromB=aFromB?`${B.name}님이 ${A.name}님의 용신(${elementKor[A.ys]})을 채워줌 — 서로의 귀인`:`${B.name}님은 ${A.name}님의 용신(${elementKor[A.ys]}) 보완이 약함`;
    const bGetsFromA=bFromA?`${A.name}님이 ${B.name}님의 용신(${elementKor[B.ys]})을 채워줌 — 서로의 귀인`:`${A.name}님은 ${B.name}님의 용신(${elementKor[B.ys]}) 보완이 약함`;

    // 조후 보완: 한쪽 조열 + 한쪽 한습 → 서로 식히고 데움
    let climateNote='두 분의 기운 온도가 비슷함';
    const hotA=A.cl==='조열', hotB=B.cl==='조열', coldA=A.cl==='한습', coldB=B.cl==='한습';
    if((hotA&&coldB)||(coldA&&hotB)) climateNote='한쪽은 뜨겁고 한쪽은 차가워 서로의 온도를 맞춰주는 조후 보완(좋은 짝)';
    else if(hotA&&hotB) climateNote='두 분 다 기운이 뜨거워 함께 달아오르기 쉬움(과열 주의)';
    else if(coldA&&coldB) climateNote='두 분 다 기운이 차가워 정이 가라앉기 쉬움(온기 보충 필요)';

    return {
        elRel, elRelShort, dgAB, dgBA, animalRel, climateNote,
        harmonies: harmonies.length?harmonies.join(', '):'뚜렷한 합 없음',
        clashes:   clashes.length?clashes.join(', '):'뚜렷한 충돌 없음',
        branchSummary:(harmonies.length?`합 ${harmonies.length}`:'합 없음')+(clashes.length?` · 충돌 ${clashes.length}`:' · 충돌 없음'),
        yongshinShort:(aFromB||bFromA)?'서로 보완':'보완 약함',
        aGetsFromB, bGetsFromA,
        scA:fmtScore(A.sc), scB:fmtScore(B.sc),
    };
}

function buildCoupleSummary(A,B,gh){
    const P = p =>
`- 이름: ${p.name} (${p.gender==='female'?'여성':'남성'})
- 출생: ${p.birthLabel} / 태어난 시간: ${p.timeLabel}${p.hasHour?'':' (시간 모름 → 시주 제외하고 풀이)'} / 지역: ${p.region}
- 사주: ${p.pillarsTxt}
- 일간(본인 본질): ${p.dayStem}(${elementKor[p.dayEl]}) / 띠: ${p.animal}
- 격국: ${p.ge} (${p.geStatus}) / 신강·신약: ${p.str} / 조후: ${p.cl}
- 용신(필요한 기운): ${elementKor[p.ys]} / 본인 사주 안 합충: ${p.rel}
- 오행 분포: `;
    return `[나(본인)]
${P(A)}${gh.scA}

[상대방]
${P(B)}${gh.scB}

[두 사람의 궁합 데이터 — 명리 법칙으로 산출, 이 근거 안에서만 풀이할 것]
- 일간 오행 관계(서로의 본질이 살리는지 누르는지): ${gh.elRel}
- 십성 관계: ${A.name}님이 본 ${B.name}님 = ${gh.dgAB} / ${B.name}님이 본 ${A.name}님 = ${gh.dgBA}
- 띠(연지) 궁합: ${gh.animalRel}
- 지지 인연(합 — 끌림·잘 맞음): ${gh.harmonies}
- 지지 충돌(충·형·파·해 — 부딪힘·조심): ${gh.clashes}
- 용신 보완(서로 부족한 기운을 채워주는지): ${gh.aGetsFromB} / ${gh.bGetsFromA}
- 조후(기운 온도) 보완: ${gh.climateNote}`;
}

async function runGunghap(){
    const result=document.getElementById('result'); result.innerHTML='';
    const A=computePerson('a'); if(A.error){ result.innerHTML=`<div class="error">${A.error}</div>`; return; }
    const B=computePerson('b'); if(B.error){ result.innerHTML=`<div class="error">${B.error}</div>`; return; }
    const gh=gunghapData(A,B);
    const couple=buildCoupleSummary(A,B,gh);
    const readingId='gh-'+Math.random().toString(36).slice(2,9);
    result.innerHTML=`
        <div class="box dosa">
            <h3>도사가 풀어주는 궁합</h3>

                <span><b>${A.name}</b>님 (${A.animal}띠) · ${A.birthLabel} · ${A.pillarsTxt}</span>

}

async function fetchGunghap(targetId, nameA, nameB, couple){
    const target=document.getElementById(targetId);
    if(!target) return;
    try{
        const email=(()=>{ try{ return localStorage.getItem('erp.userEmail.last')||sessionStorage.getItem('erp.userEmail')||''; }catch{ return ''; } })();
        const res=await fetch('saju-reading.php', {
            method:'POST',
            headers:{'Content-Type':'application/json'},
            body:JSON.stringify({ mode:'gunghap', name:`${nameA}·${nameB}`, couple, email }),
        });
        const data=await res.json().catch(()=>null);
        if(!res.ok || !data?.ok){
            target.innerHTML=`<em style="color:#888;">궁합 풀이를 가져오지 못했습니다 (${data?.error||res.status}). 다시 시도해 주세요.</em>`;
            return;
        }
        target.textContent=data.reading;
        addDosaCopyButton(target, `${nameA}·${nameB}`, data.reading);
    }catch(e){
        target.innerHTML=`<em style="color:#888;">궁합 풀이를 가져오지 못했습니다 (${(e&&e.message)||e}). 다시 시도해 주세요.</em>`;
    }
}
