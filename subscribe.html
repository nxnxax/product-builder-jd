<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>구독 플랜 · YOUNGMAN</title>
    <link rel="icon" type="image/png" href="logo_main.png">
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
    <link rel="stylesheet" href="style.css?v=20260518-subscribe">

    <style>
        .sub-shell {
            max-width: 1080px;
            margin: 0 auto;
            padding: 32px 20px 64px;
        }
        .sub-header {
            text-align: center;
            margin-bottom: 32px;
        }
        .sub-header h1 {
            font-size: 28px;
            letter-spacing: -0.025em;
            margin: 0 0 8px;
        }
        .sub-header p {
            color: var(--fg-tertiary);
            font-size: 15px;
            margin: 0;
            line-height: 1.55;
        }
        .sub-current-pill {
            display: inline-block;
            margin-top: 14px;
            padding: 6px 14px;
            background: rgba(200, 54, 44, 0.08);
            border: 1px solid rgba(200, 54, 44, 0.25);
            color: var(--accent, #c8362c);
            font-size: 13px;
            font-weight: 600;
            border-radius: 999px;
        }
        .plan-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
        }
        .plan-card {
            background: var(--bg, #fff);
            border: 1px solid var(--border, #ebe8e0);
            border-radius: 16px;
            padding: 26px 22px 24px;
            display: flex;
            flex-direction: column;
            min-height: 480px;
            position: relative;
            transition: transform 160ms ease, box-shadow 160ms ease;
        }
        .plan-card.recommended {
            border-color: var(--accent, #c8362c);
            box-shadow: 0 14px 40px rgba(200, 54, 44, 0.12);
            transform: translateY(-4px);
        }
        .plan-card.current::before {
            content: '현재 사용 중';
            position: absolute;
            top: -12px;
            right: 16px;
            background: var(--accent, #c8362c);
            color: #fff;
            font-size: 11.5px;
            font-weight: 700;
            padding: 4px 12px;
            border-radius: 999px;
            letter-spacing: -0.005em;
        }
        .plan-card .plan-name {
            font-size: 14px;
            font-weight: 700;
            color: var(--fg-tertiary, #908a82);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin: 0 0 8px;
        }
        .plan-card.recommended .plan-name {
            color: var(--accent, #c8362c);
        }
        .plan-card .plan-price {
            display: flex;
            align-items: baseline;
            gap: 6px;
            margin-bottom: 4px;
        }
        .plan-card .price-num {
            font-size: 30px;
            font-weight: 800;
            letter-spacing: -0.025em;
            color: var(--fg, #1a1611);
        }
        .plan-card .price-unit {
            font-size: 14px;
            color: var(--fg-tertiary, #908a82);
        }
        .plan-card .plan-tagline {
            color: var(--fg-secondary, #6e655c);
            font-size: 13.5px;
            line-height: 1.5;
            margin: 0 0 18px;
            min-height: 40px;
        }
        .plan-card ul.plan-features {
            list-style: none;
            padding: 0;
            margin: 0 0 22px;
            flex: 1 1 auto;
        }
        .plan-card ul.plan-features li {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            padding: 7px 0;
            font-size: 13.5px;
            line-height: 1.5;
            color: var(--fg, #1a1611);
        }
        .plan-card ul.plan-features li::before {
            content: '✓';
            color: #16a34a;
            font-weight: 800;
            flex: 0 0 16px;
        }
        .plan-card ul.plan-features li.muted {
            color: var(--fg-tertiary, #908a82);
        }
        .plan-card ul.plan-features li.muted::before {
            content: '·';
            color: #c4bfb8;
        }
        .plan-card .plan-cta {
            display: block;
            text-align: center;
            padding: 12px 14px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: -0.01em;
            border: 0;
            cursor: pointer;
            text-decoration: none;
            transition: background 140ms ease;
        }
        .plan-cta.primary {
            background: var(--accent, #c8362c);
            color: #fff;
        }
        .plan-cta.primary:hover {
            background: #b02e25;
        }
        .plan-cta.secondary {
            background: var(--bg-muted, #f5f3ee);
            color: var(--fg, #1a1611);
            border: 1px solid var(--border, #ebe8e0);
        }
        .plan-cta.disabled {
            background: var(--bg-subtle, #faf9f5);
            color: var(--fg-quaternary, #a3a39a);
            cursor: not-allowed;
            border: 1px dashed var(--border, #ebe8e0);
        }
        .plan-cta.current {
            background: rgba(22, 163, 74, 0.08);
            color: #15803d;
            border: 1px solid rgba(22, 163, 74, 0.3);
            cursor: default;
        }
        .sub-fineprint {
            text-align: center;
            margin-top: 28px;
            color: var(--fg-tertiary, #908a82);
            font-size: 12.5px;
            line-height: 1.6;
        }
        .sub-fineprint a {
            color: var(--accent, #c8362c);
            text-decoration: underline;
        }

        .sub-trial-banner {
            background: linear-gradient(135deg, rgba(200, 54, 44, 0.04), rgba(200, 54, 44, 0.08));
            border: 1px solid rgba(200, 54, 44, 0.2);
            border-radius: 12px;
            padding: 14px 18px;
            margin-bottom: 26px;
            font-size: 13.5px;
            line-height: 1.6;
            color: var(--fg, #1a1611);
            text-align: center;
        }
        .sub-trial-banner b { color: var(--accent, #c8362c); }

        .anon-notice {
            text-align: center;
            padding: 60px 20px;
            color: var(--fg-secondary, #6e655c);
        }
        .anon-notice a {
            color: var(--accent, #c8362c);
            font-weight: 600;
        }

        @media (max-width: 820px) {
            .plan-grid {
                grid-template-columns: 1fr;
                gap: 14px;
            }
            .plan-card {
                min-height: auto;
            }
            .plan-card.recommended {
                transform: none;
            }
        }
    </style>
</head>
<body>

<header id="app-header" class="app-header"></header>

<main class="sub-shell">
    <div class="sub-header">
        <h1>구독 플랜</h1>
        <p>영맨을 더 강력하게 — AI 통화 요약과 자동 저장으로 영업의 모든 순간을 기록하세요.</p>
        <div id="sub-current-display" style="display:none;"></div>
    </div>

    <div id="sub-trial-banner" class="sub-trial-banner" style="display:none;">
        🎁 <b>신규 가입 5회 무료 체험</b> 진행 중 — Plus/Pro 가입 없이도 통화 AI 요약을 5회까지 사용해 보실 수 있습니다.
    </div>

    <div id="sub-content"></div>

    <p class="sub-fineprint">
        모든 가격은 부가가치세(VAT) 포함입니다. 결제 전 <a href="auto-billing.html">자동결제 안내</a>와
        <a href="refund.html">환불정책</a>을 확인해 주세요.<br>
        결제 처리는 PortOne · 토스페이먼츠를 통해 안전하게 이루어집니다.
    </p>
</main>

<script type="module">
    import { initSupabase, apiRequest, getSession, mountAppHeader, mountAppFooter } from './auth-shared.js?v=20260517-session-persist';

    const PLAN_DEFS = [
        {
            key: 'free',
            name: 'Free',
            price: 0,
            tagline: '무료로 영맨의 기본 기능을 사용하세요.',
            features: [
                { text: '고객관리대장 + 양식 커스터마이징', on: true },
                { text: '문자발송 (사용량 개인 부담)', on: true },
                { text: '마케팅 분석', on: true },
                { text: 'AI 사주 + 로또 분석', on: true },
                { text: '통화 AI 자동요약', on: false },
                { text: '고객관리대장 원터치 저장', on: false },
            ],
            cta: { primary: false, label: '무료로 시작' },
        },
        {
            key: 'plus',
            name: 'Plus',
            price: 19000,
            tagline: 'AI 통화 요약으로 영업 기록을 자동화하세요.',
            recommended: true,
            features: [
                { text: 'Free 전체 기능 포함', on: true },
                { text: '통화 AI 자동요약 월 20회', on: true },
                { text: 'AI 요약 → 고객관리대장 원터치 저장 월 20회', on: true },
                { text: '동일 전화번호 통화 자동 누적', on: true },
                { text: '담당자 메모 동기화', on: true },
            ],
            cta: { primary: true, label: 'Plus 시작하기' },
        },
        {
            key: 'pro',
            name: 'Pro',
            price: 39000,
            tagline: '제한 없이 모든 통화를 자동 기록합니다.',
            features: [
                { text: 'Plus 전체 기능 포함', on: true },
                { text: '통화 AI 자동요약 무제한', on: true },
                { text: '고객관리대장 원터치 저장 무제한', on: true },
                { text: '공정 사용 정책 적용', on: true },
            ],
            cta: { primary: true, label: 'Pro 시작하기' },
        },
    ];

    const PLAN_LABEL = { free: 'Free', plus: 'Plus', pro: 'Pro', trialing: '신규 체험' };

    function formatPrice(n) {
        if (!n) return '무료';
        return '₩' + Number(n).toLocaleString('ko-KR');
    }

    function escapeHtml(s) {
        return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    function renderPlans(currentPlan, planStatus) {
        const isTrialing = planStatus === 'trialing';
        const html = PLAN_DEFS.map(plan => {
            const isCurrent = (
                (plan.key === 'free' && (currentPlan === 'free' || (isTrialing && currentPlan !== 'plus' && currentPlan !== 'pro'))) ||
                plan.key === currentPlan
            );
            const cardCls = ['plan-card', plan.recommended ? 'recommended' : '', isCurrent ? 'current' : ''].filter(Boolean).join(' ');
            const featuresHtml = plan.features.map(f =>
                `<li class="${f.on ? '' : 'muted'}">${escapeHtml(f.text)}</li>`
            ).join('');

            let ctaHtml;
            if (isCurrent) {
                ctaHtml = `<button class="plan-cta current" type="button" disabled>현재 사용 중</button>`;
            } else if (plan.key === 'free') {
                // 유료 플랜 사용자가 free 로 다운그레이드 — billing 페이지에서 해지로 처리.
                ctaHtml = `<a class="plan-cta secondary" href="billing.html">관리 페이지에서 해지</a>`;
            } else {
                // 결제 진행 — PortOne 결합 전 임시 disabled.
                ctaHtml = `<button class="plan-cta disabled" type="button" data-plan="${plan.key}" disabled title="PortOne 결제 시스템 결합 후 활성화됩니다">${escapeHtml(plan.cta.label)} (준비 중)</button>`;
            }

            return `
                <article class="${cardCls}">
                    <h2 class="plan-name">${escapeHtml(plan.name)}</h2>
                    <div class="plan-price">
                        <span class="price-num">${formatPrice(plan.price)}</span>
                        ${plan.price ? '<span class="price-unit">/ 월</span>' : ''}
                    </div>
                    <p class="plan-tagline">${escapeHtml(plan.tagline)}</p>
                    <ul class="plan-features">${featuresHtml}</ul>
                    ${ctaHtml}
                </article>
            `;
        }).join('');

        document.getElementById('sub-content').innerHTML = `<div class="plan-grid">${html}</div>`;

        // 현재 plan 상단 표시
        if (currentPlan && currentPlan !== 'free') {
            const display = document.getElementById('sub-current-display');
            display.style.display = 'block';
            display.innerHTML = `<span class="sub-current-pill">현재 플랜: ${escapeHtml(PLAN_LABEL[currentPlan] || currentPlan)}</span>`;
        }
        if (isTrialing) {
            document.getElementById('sub-trial-banner').style.display = 'block';
        }
    }

    function renderAnon() {
        document.getElementById('sub-content').innerHTML = `
            <div class="anon-notice">
                <p style="font-size:16px;margin-bottom:12px;">구독 정보를 보려면 먼저 <a href="index.html">로그인</a>해 주세요.</p>
                <p style="font-size:13px;color:var(--fg-tertiary);">로그인하지 않아도 아래 플랜 정보는 비교해 보실 수 있습니다.</p>
            </div>
            <div style="margin-top:24px;">${renderPlansHTMLOnly()}</div>
        `;
    }
    function renderPlansHTMLOnly() {
        const html = PLAN_DEFS.map(plan => {
            const cardCls = ['plan-card', plan.recommended ? 'recommended' : ''].filter(Boolean).join(' ');
            const featuresHtml = plan.features.map(f =>
                `<li class="${f.on ? '' : 'muted'}">${escapeHtml(f.text)}</li>`
            ).join('');
            const ctaHtml = `<a class="plan-cta ${plan.cta.primary ? 'primary' : 'secondary'}" href="index.html">로그인 후 시작</a>`;
            return `
                <article class="${cardCls}">
                    <h2 class="plan-name">${escapeHtml(plan.name)}</h2>
                    <div class="plan-price">
                        <span class="price-num">${formatPrice(plan.price)}</span>
                        ${plan.price ? '<span class="price-unit">/ 월</span>' : ''}
                    </div>
                    <p class="plan-tagline">${escapeHtml(plan.tagline)}</p>
                    <ul class="plan-features">${featuresHtml}</ul>
                    ${ctaHtml}
                </article>
            `;
        }).join('');
        return `<div class="plan-grid">${html}</div>`;
    }

    (async function boot() {
        mountAppHeader();
        mountAppFooter();
        try { await initSupabase(); } catch {}
        const session = getSession();
        if (!session?.user) {
            renderAnon();
            return;
        }
        try {
            const res = await apiRequest('auth-profile');
            const profile = res?.profile || {};
            const plan = (profile.plan || 'trialing').toLowerCase();
            const planStatus = (profile.plan_status || 'trialing').toLowerCase();
            renderPlans(plan, planStatus);
        } catch (e) {
            console.warn('[subscribe] profile fetch failed', e);
            renderPlans('trialing', 'trialing');
        }
    })();
</script>

</body>
</html>
