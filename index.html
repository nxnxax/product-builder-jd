<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise Resource Planning | ERP Console</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <header class="app-header">
        <div class="header-container">
            <h1>JDHOON <span class="accent">ERP CONSOLE</span></h1>
            <nav class="main-nav">
                <button id="nav-customers" class="nav-link active">CRM: 고객 관리</button>
                <button id="nav-employees" class="nav-link">HRM: 직원 관리</button>
            </nav>
        </div>
    </header>

    <main class="dashboard">
        <!-- 고객 관리 섹션 -->
        <section id="customer-section" class="content-section">
            <div class="section-header">
                <div class="title-group">
                    <h2>Customer Management</h2>
                    <p class="subtitle">전체 등록 고객 현황 및 세부 정보 관리</p>
                </div>
                <div class="controls">
                    <div class="search-box">
                        <input type="text" id="customer-search" placeholder="고객 성명으로 데이터 검색...">
                    </div>
                    <button id="add-customer-btn" class="primary-btn">+ 신규 고객 등록</button>
                </div>
            </div>

            <div class="table-wrapper">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>고객 성명</th>
                            <th>연락처</th>
                            <th>등록 일자</th>
                            <th>액션</th>
                        </tr>
                    </thead>
                    <tbody id="customer-list">
                        <!-- 데이터 로딩... -->
                    </tbody>
                </table>
                <div id="customer-empty" class="empty-state hidden">
                    <p>조회된 데이터가 없습니다. 새로운 고객을 등록해 주세요.</p>
                </div>
            </div>
        </section>

        <!-- 직원 관리 섹션 -->
        <section id="employee-section" class="content-section hidden">
            <div class="section-header">
                <div class="title-group">
                    <h2>Human Resources</h2>
                    <p class="subtitle">임직원 인사 정보 및 투입 현황 통합 관리</p>
                </div>
                <div class="controls">
                    <div class="search-box">
                        <input type="text" id="employee-search" placeholder="성명 또는 직함으로 검색...">
                    </div>
                    <button id="add-employee-btn" class="primary-btn">+ 신규 직원 등록</button>
                </div>
            </div>

            <div class="table-wrapper">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>임직원 성명</th>
                            <th>직함 / 포지션</th>
                            <th>연락처</th>
                            <th>투입(입사) 일자</th>
                            <th>액션</th>
                        </tr>
                    </thead>
                    <tbody id="employee-list">
                        <!-- 데이터 로딩... -->
                    </tbody>
                </table>
                <div id="employee-empty" class="empty-state hidden">
                    <p>조회된 임직원 데이터가 없습니다.</p>
                </div>
            </div>
        </section>
    </main>

    <!-- 통합 관리 모달 -->
    <div id="app-modal" class="modal hidden">
        <div class="modal-content">
            <header class="modal-header">
                <h2 id="modal-title">Data Management</h2>
                <button id="close-modal" class="close-btn">&times;</button>
            </header>
            <form id="app-form">
                <input type="hidden" id="item-id">
                <input type="hidden" id="item-type">
                
                <div id="form-fields">
                    <!-- JS Dynamic Rendering -->
                </div>

                <div class="form-actions">
                    <button type="button" id="cancel-btn" class="secondary-btn">취소</button>
                    <button type="submit" id="save-btn" class="primary-btn">데이터 저장</button>
                </div>
            </form>
        </div>
    </div>

    <style>
        .title-group h2 { margin-bottom: 0.25rem; }
        .subtitle { color: var(--text-muted); font-size: 0.9rem; font-weight: 500; }
        @media (max-width: 768px) {
            .section-header { align-items: flex-start; }
            .title-group { margin-bottom: 1rem; }
        }
    </style>

    <script src="main.js" type="module"></script>
</body>
</html>
