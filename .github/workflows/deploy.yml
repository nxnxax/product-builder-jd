name: Deploy via FTP

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: cafe24-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare deploy files
        run: |
          rm -rf deploy
          mkdir -p deploy
          cp index.html style.css main.js Marketing.html kapp_premium.php deploy/
          cp api/analyze.php deploy/analyze.php

      - name: FTP Deploy
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.CAFE24_FTP_SERVER }}
          username: ${{ secrets.CAFE24_FTP_USER }}
          password: ${{ secrets.CAFE24_FTP_PASSWORD }}
          port: ${{ secrets.CAFE24_FTP_PORT || 21 }}
          protocol: ftp
          local-dir: ./deploy/
          server-dir: ./
          dangerous-clean-slate: false
